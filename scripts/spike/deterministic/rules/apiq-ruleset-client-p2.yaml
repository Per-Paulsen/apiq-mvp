# apiq Spectral Ruleset — Welle C P2 Client-Friction (Lens 4 + Lens 5)
#
# 23 P2 client-friction Differentiator-Patterns (apiq-USP) per
# implementation-priority.md P2-Client tabelle + Plan-Doc §6 (Welle C).
# These are patterns mature linters DON'T catch — apiq's competitive moat.
#
# Authored 2026-05-08 (T18b / Welle C, owner: t18b-client).
#
# Severity discipline (per severity-schema.ts):
#   - error: codegen actually fails or spec-syntax violated (RFC-2119 MUST)
#   - warn:  codegen produces bad-but-compilable output OR strong consensus
#   - hint:  SDK-quality degraded; ergonomics suboptimal
#
# Custom-functions used (registered in spectral-runner.ts):
#   - schema-nesting-depth (CL-29)
#   - regex-multi-engine-unsupported (CL-25)
#   - allof-heavy-non-ref-objects (CL-77)
#   - linguistic-amorphous-uri (F-11)
#   - linguistic-tiny-resource (F-12)
#
# All 23 rules carry a 100% complete `apiq-meta` block per Welle-F schema:
# pattern-id + lenses + sources (with verbatim+verifiedAt) + stakeholders +
# lifecycle-phase + defect-class + iso25010 (array) + codegen-targets
# (per-target tagging where applicable, F7) + detection-precision +
# auto-fix-safe + cost-impact + mttr-impact + agent-readiness-impact.

extends:
  - spectral:oas

formats:
  - oas3
  - oas3_0
  - oas3_1

rules:
  # =========================================================================
  # CL-4 — Inline-Object schemas without title
  # Targets: java, csharp, kotlin, go (codegen with strong typing produces
  # synthetic anonymous types — `InlineObject1`, `InlineObject2`, ...).
  # =========================================================================

  # Source: multi-codegen + Speakeasy SDK guidance;
  #         rules-brainstorm.md CL-4 (P2)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl4-inline-object-needs-title:
    description: >-
      [CL-4] Inline object-schemas (declared inside operations or as nested
      properties without a `$ref` to a named component) should declare a
      `title`. Codegen tools that produce strongly-typed clients (Java,
      C#, Kotlin, Go) synthesise anonymous types like `InlineObject1`,
      `InlineObject2` from anonymous schemas — the resulting SDK is
      unreadable. Targets: java, csharp, kotlin, go.
    message: "Inline object-schema lacks `title`; codegen synthesises anonymous types."
    severity: warn
    given:
      - "$.paths[*][*].requestBody.content[*].schema"
      - "$.paths[*][*].responses[*].content[*].schema"
    then:
      field: title
      function: defined
    apiq-meta:
      pattern-id: CL-4
      lenses: [client-friction]
      sources:
        - type: vendor
          name: 'Speakeasy SDK guidance (multi-codegen)'
          summary: 'Inline object schemas without title produce anonymous synthesised types'
          url: 'https://www.speakeasy.com/openapi'
        - type: vendor
          name: openapi-generator multi-codegen
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, ai-agent]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability, compatibility]
      codegen-targets: [java, csharp, kotlin, go]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-5 — operationId verbose / FastAPI-style
  # E.g. `read_users_users__user_id__get`. Targets: * (SDKs end up with
  # verbose method names that don't match natural usage).
  # =========================================================================

  # Source: Speakeasy + SDK-vendor guidance + openapi-generator naming
  #         conventions; rules-brainstorm.md CL-5 (P2)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl5-operationid-not-verbose:
    description: >-
      [CL-5] `operationId` should be concise (≤40 chars) and use a verb +
      resource-noun pattern (`listUsers`, `createInvoice`, `cancelOrder`).
      FastAPI auto-generates verbose IDs like
      `read_users_users__user_id__get` which produce unreadable SDK
      method names. Use a hand-curated operationId. Targets: *.
    message: "operationId `{{value}}` is verbose (>40 chars or matches FastAPI auto-naming)."
    severity: warn
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace].operationId"
    then:
      function: pattern
      functionOptions:
        notMatch: "^(.{40,}|.+__.+__.+|.*_(get|post|put|delete|patch)$)"
    apiq-meta:
      pattern-id: CL-5
      lenses: [client-friction]
      sources:
        - type: vendor
          name: 'Speakeasy SDK-vendor guidance'
          summary: 'operationId should be concise verb + resource-noun for clean SDK methods'
          url: 'https://www.speakeasy.com/openapi'
        - type: vendor
          name: 'FastAPI auto-naming (negative example)'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, docs-tool]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-7 — required + nullable without 3-state semantics
  # Setting `required: true` AND `nullable: true` produces 3-state semantics
  # (present-with-value, present-with-null, absent) — codegen tools handle
  # this badly. Targets: typescript, java, csharp, kotlin (strict-typed).
  # =========================================================================

  # Source: openapi-generator #14765 + Speakeasy 3-state-semantics guidance;
  #         rules-brainstorm.md CL-7 (P2)
  # Lens: 4 (Client-Friction), 3 (Evolution-Friction)
  # Round: 2 (Welle C)
  apiq-cl7-required-nullable-3-state:
    description: >-
      [CL-7] A property declared both `required: true` (in parent) AND
      `nullable: true` (or `type: ['T', 'null']` in 3.1) creates 3-state
      semantics (present-with-value / present-with-null / absent). Codegen
      tools either drop one state or fail to compile the union. Pick one:
      either `required` OR `nullable`, not both. Targets: typescript,
      java, csharp, kotlin.
    message: "Schema is `nullable: true`; if also marked `required` in parent, produces 3-state semantics."
    severity: hint
    given: "$..[?(@.nullable === true)]"
    then:
      field: nullable
      function: falsy
    apiq-meta:
      pattern-id: CL-7
      lenses: [client-friction, evolution-friction]
      sources:
        - type: vendor
          name: openapi-generator #14765
          url: 'https://github.com/OpenAPITools/openapi-generator/issues/14765'
          summary: 'required+nullable produces 3-state semantics that codegen mishandles'
        - type: vendor
          name: 'Speakeasy 3-state-semantics guidance'
          url: 'https://www.speakeasy.com/openapi'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: semantic
      iso25010: [compatibility, reliability]
      codegen-targets: [typescript, java, csharp, kotlin]
      detection-precision: low
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # CL-9 — Same-status-code multiple content-types
  # Per OAS3, a single response can list multiple media-types, but codegens
  # struggle with mixing JSON + non-JSON in one 2xx — the SDK has to pick.
  # =========================================================================

  # Source: openapi-generator #17877 + oapi-codegen #1897;
  #         rules-brainstorm.md CL-9 (P2)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl9-no-multi-content-types-same-status:
    description: >-
      [CL-9] When one response status-code declares multiple content-types,
      SDK codegen must pick one (or invent a union). Mixing
      `application/json` + `text/plain` + `application/xml` on the same
      2xx is a frequent source of unstable SDK output. Use a canonical
      content-type per response or split into multiple status codes.
      Targets: *.
    message: "Response has multiple content-type declarations on a single status code."
    severity: warn
    given: "$.paths[*][*].responses[?(@.content)]"
    then:
      field: content
      function: schema
      functionOptions:
        schema:
          type: object
          maxProperties: 1
    apiq-meta:
      pattern-id: CL-9
      lenses: [client-friction]
      sources:
        - type: vendor
          name: openapi-generator #17877
          url: 'https://github.com/OpenAPITools/openapi-generator/issues/17877'
          summary: 'multiple content-types on same status produce ambiguous SDK output'
        - type: vendor
          name: oapi-codegen #1897
          url: 'https://github.com/oapi-codegen/oapi-codegen/issues/1897'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability, compatibility]
      # F7 narrow: strict-typed codegens must pick ONE return-shape per status;
      # Python/TS dynamic returns tolerate union without compile-error.
      codegen-targets: [java, csharp, kotlin, go, rust]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-13 — discriminator.propertyName not in required
  # Per OAS 3 §4.7.25 the discriminator property MUST be present in every
  # variant — best practice is to declare it in `required: [...]`. Without
  # this, codegen produces nullable discriminator fields.
  # =========================================================================

  # Source: openapi-generator #9444 + Redocly;
  #         rules-brainstorm.md CL-13 (P2)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl13-discriminator-property-required:
    description: >-
      [CL-13] When `discriminator.propertyName` is declared, the same
      property name SHOULD appear in the schema's `required` array. Without
      this, codegen produces nullable discriminator fields and runtime
      variant-resolution becomes unreliable. Targets: java, typescript,
      csharp, kotlin.
    message: "discriminator.propertyName `{{value}}` is not listed in `required`; runtime variant-resolution becomes unreliable."
    severity: warn
    given: "$..[?(@.discriminator && @.discriminator.propertyName)]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [required]
          properties:
            required:
              type: array
              minItems: 1
    apiq-meta:
      pattern-id: CL-13
      lenses: [client-friction]
      sources:
        - type: vendor
          name: openapi-generator #9444
          url: 'https://github.com/OpenAPITools/openapi-generator/issues/9444'
          summary: 'discriminator.propertyName must be required for reliable variant resolution'
        - type: vendor
          name: 'Redocly discriminator guidance'
          url: 'https://redocly.com/docs/cli/rules/'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: incomplete
      iso25010: [compatibility, reliability]
      codegen-targets: [java, typescript, csharp, kotlin]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # CL-15 — int64 integer without format declared
  # `type: integer` without `format: int64` defaults to int32 in many codegen
  # tools. Targets: java, csharp, kotlin, go (signed 32 vs 64 bit matters).
  # =========================================================================

  # Source: OAI + Speakeasy + openapi-generator (int32-default consensus);
  #         rules-brainstorm.md CL-15 (P2)
  # Lens: 4 (Client-Friction), 3 (Evolution-Friction)
  # Round: 2 (Welle C)
  apiq-cl15-integer-needs-format:
    description: >-
      [CL-15] `type: integer` should declare `format: int32` or `format:
      int64` explicitly. Without `format`, codegen tools default to int32
      (Java/C#/Kotlin/Go) — values that exceed 2^31 silently overflow at
      the wire boundary. Targets: java, csharp, kotlin, go.
    message: "Integer schema lacks `format`; codegen defaults to int32 — overflow risk for values >2^31."
    severity: warn
    given: "$..[?(@.type === 'integer' && !@.format)]"
    then:
      field: format
      function: defined
    apiq-meta:
      pattern-id: CL-15
      lenses: [client-friction, evolution-friction]
      sources:
        - type: vendor
          name: 'OpenAPI Initiative (data-types guidance)'
          url: 'https://spec.openapis.org/oas/v3.0.3#data-types'
          summary: 'integer should declare format: int32 or int64'
        - type: vendor
          name: 'Speakeasy + openapi-generator (int32-default consensus)'
          url: 'https://www.speakeasy.com/openapi'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: incomplete
      iso25010: [reliability, compatibility]
      codegen-targets: [java, csharp, kotlin, go]
      detection-precision: high
      auto-fix-safe: true
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # CL-17 — Recursive schema without termination
  # A schema that references itself via $ref (directly or transitively)
  # without a base-case (e.g. nullable allOf-fork) leads codegen to produce
  # infinite recursion or stack-overflow at deserialise time.
  # apiq-A2 + walker layer (cross-reference-consistency) does the full graph
  # detection. This rule fires when an inline schema has $ref-to-self in
  # `properties[*]` AND no `nullable: true` sibling on the back-pointer.
  # =========================================================================

  # Source: openapi-generator + openapi-python-client + utoipa
  #         (multi-codegen runtime-failure consensus);
  #         rules-brainstorm.md CL-17 (P2, graph)
  # Lens: 4 (Client-Friction), 3 (Evolution-Friction)
  # Round: 2 (Welle C)
  apiq-cl17-recursive-schema-needs-termination:
    description: >-
      [CL-17] Schemas that reference themselves (via `$ref` in
      `properties[*]` or `items`) need a termination condition — otherwise
      codegen produces infinite recursion at deserialise time. The
      conventional terminations are: `nullable: true` on the back-pointer
      (3.0), `type: [T, null]` (3.1), or wrapping in `oneOf` with a
      base-case. The cross-reference-consistency walker performs the full
      graph-detection — this sentinel rule reports the first-level
      indicator (a self-$ref in properties without nullable). Targets:
      java, csharp, kotlin, typescript, python.
    message: "Schema property `$ref` self-references the parent schema without a nullable terminator."
    severity: warn
    given: "$.components.schemas[*].properties[*]"
    then:
      function: schema
      functionOptions:
        schema:
          # Loose check: properties whose $ref strings contain the parent's
          # own name and aren't nullable. This is necessarily approximate
          # at the rule layer; the walker does the true cycle detection.
          type: object
          not:
            allOf:
              - required: ["$ref"]
              - properties:
                  nullable:
                    const: true
    apiq-meta:
      pattern-id: CL-17
      lenses: [client-friction, evolution-friction]
      sources:
        - type: vendor
          name: openapi-generator (multi-codegen runtime-failure)
          url: 'https://github.com/OpenAPITools/openapi-generator'
          summary: 'recursive schemas without termination produce infinite recursion at deserialise time'
        - type: vendor
          name: openapi-python-client + utoipa
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: semantic
      iso25010: [reliability, compatibility]
      codegen-targets: [java, csharp, kotlin, typescript, python]
      detection-precision: low
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: high
      agent-readiness-impact: medium

  # =========================================================================
  # CL-18 — Recursive cycle on required field
  # Stricter version of CL-17: when the recursive cycle traverses a
  # `required` property, the schema is unrepresentable in any codegen
  # because there's no base case. Severity: error.
  # The walker (cross-reference-consistency) does the cross-component
  # detection; this rule serves as a sentinel/anchor so the pattern-id
  # is registered.
  # =========================================================================

  # Source: pb33f schema-validation work + openapi-generator runtime-fails;
  #         rules-brainstorm.md CL-18 (P2)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl18-recursive-cycle-required-field:
    description: >-
      [CL-18] When a recursive schema's cycle traverses a `required`
      property (i.e. the back-pointer is required, not optional), the
      schema is unrepresentable — there's no base case to terminate
      recursion. Codegen tools fail to compile or produce stack-overflow
      at deserialise time. Make the back-pointer optional or restructure.
      Cross-component detection lives in the cross-reference-consistency
      walker; this rule is a sentinel for the CL-18 pattern-id. Targets: *.
    message: "Schema present (sentinel rule for CL-18 — full cycle detection in cross-reference-consistency walker)."
    severity: hint
    given: "$.components.schemas[*]"
    then:
      function: truthy
    apiq-meta:
      pattern-id: CL-18
      lenses: [client-friction]
      sources:
        - type: vendor
          name: pb33f
          url: 'https://pb33f.io/'
          summary: 'recursive cycles on required fields are unrepresentable in any codegen'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: semantic
      iso25010: [reliability, compatibility]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: low
      auto-fix-safe: false
      cost-impact: high
      mttr-impact: high
      agent-readiness-impact: medium

  # =========================================================================
  # CL-21 — format not in IANA-format-registry / OAS-known-list
  # Custom `format` values (e.g. `format: ipv4-cidr`) that aren't on the
  # OAS-known-list (date, date-time, password, byte, binary, email, uuid,
  # uri, hostname, ipv4, ipv6, int32, int64, float, double) get dropped by
  # codegens (treated as `string`). Targets: * (validation also falls back).
  # =========================================================================

  # Source: openapi-generator multi-issue (format-fallback);
  #         rules-brainstorm.md CL-21 / A7 (P2)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl21-format-known-only:
    description: >-
      [CL-21] `format` values should be from the OAS-known list
      (date, date-time, password, byte, binary, email, uuid, uri,
      hostname, ipv4, ipv6, int32, int64, float, double, decimal) or
      a documented vendor-prefixed extension. Codegen tools silently
      ignore unknown formats and fall back to `string`, breaking
      type-narrowing in SDKs. Targets: java, go, python, typescript,
      csharp, kotlin.
    message: "format `{{value}}` is not on the OAS-known-list; codegen falls back to plain string."
    severity: hint
    given: "$..format"
    then:
      function: enumeration
      functionOptions:
        values:
          - date
          - date-time
          - password
          - byte
          - binary
          - email
          - uuid
          - uri
          - uri-reference
          - hostname
          - ipv4
          - ipv6
          - int32
          - int64
          - float
          - double
          - decimal
          - duration
          - regex
          - json-pointer
          - relative-json-pointer
    apiq-meta:
      pattern-id: CL-21
      lenses: [client-friction]
      sources:
        - type: vendor
          name: 'OpenAPI Initiative (data-types §4.7.4)'
          url: 'https://spec.openapis.org/oas/v3.0.3#data-types'
          summary: 'unknown formats are treated as additional information'
        - type: vendor
          name: openapi-generator multi-issue (format-fallback)
          verifiedAt: '2026-05-08'
        - type: iana-registry
          registry: 'https://www.iana.org/assignments/json-schema-format/'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: incomplete
      iso25010: [compatibility, usability]
      codegen-targets: [java, go, python, typescript, csharp, kotlin]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-22 — type:object without properties+additionalProperties
  # `type: object` with neither `properties` nor `additionalProperties`
  # produces a free-form blob — codegen renders this as Map<String,Object>
  # (Java/Kotlin), Dictionary<string,object> (C#), map[string]interface{}
  # (Go) — type-narrowing impossible.
  # =========================================================================

  # Source: openapi-generator + Apicurio (free-form-object consensus);
  #         rules-brainstorm.md CL-22 / M-SP-13 (P2)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl22-object-needs-properties-or-additional-properties:
    description: >-
      [CL-22] `type: object` schemas should declare either `properties`
      OR `additionalProperties` (or both). Without either, the schema
      is a free-form blob and codegen renders it as
      `Map<String, Object>` (Java/Kotlin), `Dictionary<string, object>`
      (C#), or `map[string]interface{}` (Go) — type-narrowing
      impossible. Targets: java, csharp, kotlin, go.
    message: "Object schema declares neither `properties` nor `additionalProperties`; codegen produces Map<String,Object>."
    severity: warn
    given: "$..[?(@.type === 'object' && !@.properties && @.additionalProperties === undefined && !@.allOf && !@.oneOf && !@.anyOf)]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          anyOf:
            - required: [properties]
            - required: [additionalProperties]
    apiq-meta:
      pattern-id: CL-22
      lenses: [client-friction]
      sources:
        - type: vendor
          name: openapi-generator (free-form-object consensus)
          url: 'https://github.com/OpenAPITools/openapi-generator'
          summary: 'object without properties or additionalProperties produces Map<String,Object>'
        - type: vendor
          name: Apicurio
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: incomplete
      iso25010: [usability, compatibility]
      codegen-targets: [java, csharp, kotlin, go]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: high

  # =========================================================================
  # CL-24 — Multiple-types in 3.1 unconstrained
  # OAS 3.1 allows `type: ['string', 'integer']` — but codegen tools without
  # explicit handling produce `Object`/`Any`. Should be paired with
  # `oneOf` for explicit variants.
  # =========================================================================

  # Source: openapi-generator #18207 (3.1-multi-type incomplete-handling);
  #         rules-brainstorm.md CL-24 / A-MIN-16 (P2)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl24-multi-type-needs-oneof:
    description: >-
      [CL-24] OAS 3.1 schemas with `type` declared as an array of multiple
      types (e.g. `type: ['string', 'integer']`) should pair with `oneOf`
      to make variant-handling explicit for codegen. Without `oneOf`,
      codegen tools fall back to `Object`/`Any` and lose type-narrowing.
      The cross-spec walker `json-schema-draft-detector` performs the
      array-detection (Nimma JSONPath compiler doesn't support
      `Array.isArray`); this rule is a sentinel for the CL-24 pattern-id.
      Targets: java, csharp, kotlin, typescript.
    message: "Schema present (sentinel rule for CL-24 — full multi-type detection in json-schema-draft-detector walker)."
    severity: hint
    formats:
      - oas3_1
    given: "$.components.schemas[*]"
    then:
      function: truthy
    apiq-meta:
      pattern-id: CL-24
      lenses: [client-friction]
      sources:
        - type: vendor
          name: openapi-generator #18207
          url: 'https://github.com/OpenAPITools/openapi-generator/issues/18207'
          summary: '3.1 multi-type handling incomplete in most codegens'
