      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-25 — pattern Regex unsupported by ECMA/Java/Python
  # Pattern uses regex features that aren't portable across the three
  # major codegen-target engines (ECMA-262, Java java.util.regex,
  # Python re). Uses custom function regex-multi-engine-unsupported.
  # =========================================================================

  # Source: ReDoc + openapi-python-client (regex-engine-mismatch reports);
  #         Java java.util.regex docs + Python re module spec + ECMA-262 §22.2;
  #         rules-brainstorm.md CL-25 / A6 (P2)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl25-pattern-multi-engine-portable:
    description: >-
      [CL-25] `pattern` strings should use a portable regex subset that
      ECMA-262 (JavaScript), Java `java.util.regex`, and Python `re` all
      accept. Avoid: lookbehind, named groups (Python-style `(?P<...>)`),
      possessive quantifiers, atomic groups, conditional patterns,
      Unicode property escapes. The custom function reports specific
      incompatibilities. Targets: typescript, java, python.
    message: "{{error}}"
    severity: warn
    given: "$..pattern"
    then:
      function: regex-multi-engine-unsupported
    apiq-meta:
      pattern-id: CL-25
      lenses: [client-friction]
      sources:
        - type: vendor
          name: ReDoc + openapi-python-client (regex-engine-mismatch)
          summary: 'patterns using ECMA-262-only features get rejected by Python re or Java java.util.regex'
        - type: vendor
          name: 'ECMA-262 §22.2 RegExp + Java java.util.regex + Python re docs'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: semantic
      iso25010: [compatibility, reliability]
      codegen-targets: [typescript, java, python]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # CL-29 — Deeply-nested inline objects (>3 levels)
  # Uses custom function schema-nesting-depth.
  # Inline schemas with object-property-nesting >3 levels deep cause
  # codegen to produce Nested* types and dock-portals to render mismodelled
  # tree views.
  # =========================================================================

  # Source: swagger-ui + redoc multi-issue (deeply-nested inline rendering);
  #         rules-brainstorm.md CL-29 / M4 (P2, mech-stat)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl29-no-deep-inline-nesting:
    description: >-
      [CL-29] Inline object-schemas with property-nesting depth >3 levels
      produce unreadable docs (Swagger-UI / Redoc render tree-views that
      clip) and synthetic Nested-Nested-Nested type names in codegen.
      Extract nested schemas to named components. The depth check uses
      a custom function that walks `properties[*]`, `items`, and
      `additionalProperties` (treating `allOf`/`oneOf`/`anyOf` as
      composition not nesting). Targets: *.
    message: "{{error}}"
    severity: warn
    given:
      - "$.paths[*][*].requestBody.content[*].schema"
      - "$.paths[*][*].responses[*].content[*].schema"
      - "$.components.schemas[*]"
    then:
      function: schema-nesting-depth
      functionOptions:
        maxDepth: 3
    apiq-meta:
      pattern-id: CL-29
      lenses: [client-friction]
      sources:
        - type: vendor
          name: swagger-ui multi-issue (deep-inline-render)
          url: 'https://github.com/swagger-api/swagger-ui'
          summary: 'deeply-nested inline objects produce unreadable docs'
        - type: vendor
          name: redoc deep-inline-rendering issues
          url: 'https://github.com/Redocly/redoc'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, docs-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability, maintainability]
      # F7 narrow: synthetic Nested-Nested-Nested type-name explosion is
      # worst in OO codegens + TypeScript .d.ts; Rust/Python compose with
      # less synthetic-class proliferation.
      codegen-targets: [java, csharp, kotlin, go, typescript]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: high

  # =========================================================================
  # CL-35 — Schema named Client/API/Response/Request
  # Schemas with these names produce class-name collisions in Python clients
  # (the SDK class is named `Client`; openapi-python-client #1045 + reports
  # for `API`, `Response`, `Request`).
  # Targets: python, ruby (where SDK class-names commonly collide).
  # =========================================================================

  # Source: openapi-python-client (Client/API/Response/Request collision report);
  #         rules-brainstorm.md CL-35 (P2)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl35-schema-name-not-sdk-reserved:
    description: >-
      [CL-35] Component-schema names that collide with common SDK class
      names — `Client`, `Api`/`API`, `Response`, `Request`, `Configuration`
      — produce import-collisions and runtime errors in Python and Ruby
      SDKs. Use a domain-prefix (e.g. `MyApiClient`, `UserResponse`).
      Targets: python, ruby.
    message: "Schema name `{{property}}` collides with common SDK class names; will rename in Python / Ruby clients."
    severity: warn
    given: "$.components.schemas.*~"
    then:
      function: pattern
      functionOptions:
        notMatch: "^(Client|Api|API|Response|Request|Configuration|Config|Adapter|Service)$"
    apiq-meta:
      pattern-id: CL-35
      lenses: [client-friction]
      sources:
        - type: vendor
          name: openapi-python-client (SDK-class-collision)
          url: 'https://github.com/openapi-generators/openapi-python-client'
          summary: 'Schema named Client/API collides with generated SDK base-class'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [compatibility, usability]
      codegen-targets: [python, ruby]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: low

  # =========================================================================
  # CL-48 — Multiple similar-not-identical schemas (no convention)
  # Cross-spec aggregation — walker territory (`duplicate-schemas` walker).
  # Sentinel rule emits per-schema with hint-severity so the pattern-id is
  # visible in the catalog. Walker does the cross-component clustering.
  # =========================================================================

  # Source: Lens-4 + Stripe (similar-not-identical schemas);
  #         rules-brainstorm.md CL-48 / M7 near-dup (P2, mech-stat)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl48-similar-schemas-walker-sentinel:
    description: >-
      [CL-48] Components-schemas that are similar-not-identical (≥80%
      property overlap, ≠100%) suggest the spec author meant to extend
      a base schema via `allOf` but didn't. The cross-spec clustering
      lives in the duplicate-schemas walker — this rule serves as a
      catalog-visibility sentinel. Targets: *.
    message: "Schema present (sentinel rule for CL-48 — full near-dup detection in duplicate-schemas walker)."
    severity: hint
    given: "$.components.schemas[*]"
    then:
      function: truthy
    apiq-meta:
      pattern-id: CL-48
      lenses: [client-friction]
      sources:
        - type: vendor
          name: 'Stripe + Lens-4 mining (similar-schema near-dups)'
          url: 'https://stripe.com/docs/api'
          summary: 'similar-not-identical schemas indicate missed allOf composition'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, spec-author, codegen-tool]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [maintainability, usability]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: low
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # CL-54 — securitySchemes mixed types globally
  # When `components.securitySchemes` contains heterogeneous types (apiKey
  # + oauth2 + http-bearer all together), SDKs ship multi-auth fan-out
  # boilerplate. The pattern is detected pure-DSL by counting distinct
  # security-scheme types.
  # =========================================================================

  # Source: Speakeasy SDK (multi-auth-fan-out report);
  #         rules-brainstorm.md CL-54 / F (P2, mech-stat)
  # Lens: 4 (Client-Friction), 3 (Evolution-Friction)
  # Round: 2 (Welle C)
  apiq-cl54-security-schemes-not-mixed:
    description: >-
      [CL-54] When `components.securitySchemes` declares ≥3 distinct
      types (apiKey + oauth2 + http-bearer + openIdConnect + mutualTLS),
      SDKs end up with multi-auth fan-out boilerplate (every method
      accepts every auth-type). Consolidate to one or two auth-flavours
      where possible. The full cross-op detection lives in the
      operations-classifier walker. Targets: *.
    message: "Spec declares ≥3 distinct securityScheme types; SDKs ship multi-auth fan-out boilerplate."
    severity: hint
    given: "$.components.securitySchemes"
    then:
      function: schema
      functionOptions:
        schema:
          # Heuristic: cap distinct values of `type` field
          type: object
          maxProperties: 5
    apiq-meta:
      pattern-id: CL-54
      lenses: [client-friction, evolution-friction]
      sources:
        - type: vendor
          name: 'Speakeasy SDK (multi-auth-fan-out)'
          url: 'https://www.speakeasy.com/openapi'
          summary: 'mixed securityScheme types produce multi-auth fan-out boilerplate'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author, security]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability, maintainability]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: low
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # CL-56 — Enum values not valid identifier-chars
  # Enum values that contain spaces, dots, slashes etc. produce invalid
  # identifiers in target languages that codegen-tools synthesise as enum
  # constants. Targets: python, java, go, typescript, csharp, rust.
  # =========================================================================

  # Source: openapi-typescript #1874;
  #         rules-brainstorm.md CL-56 (P2)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl56-enum-value-identifier-safe:
    description: >-
      [CL-56] Enum values used in spec authoring become identifier
      constants in generated SDKs (Python `MyEnum.RED_BLUE`,
      Java `MyEnum.RED_BLUE`). Values containing spaces, dots, slashes,
      hyphens, or other special chars produce invalid identifiers; the
      codegen tool either renames silently (`RED_BLUE` for `red blue`)
      or fails. Targets: python, java, go, typescript, csharp, rust.
    message: "Enum value `{{value}}` is not identifier-safe — codegen will rename or fail."
    severity: warn
    given: "$..enum[*]"
    then:
      function: pattern
      functionOptions:
        match: "^[A-Za-z_][A-Za-z0-9_-]*$"
    apiq-meta:
      pattern-id: CL-56
      lenses: [client-friction]
      sources:
        - type: vendor
          name: openapi-typescript #1874
          url: 'https://github.com/openapi-ts/openapi-typescript/issues/1874'
          summary: 'enum values must be identifier-safe for clean SDK enum generation'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability, compatibility]
      codegen-targets: [python, java, go, typescript, csharp, rust]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # CL-64 — operationId verb-prefix vs HTTP-method
  # operationId beginning with a verb that contradicts its HTTP method
  # (e.g. POST + operationId `getUser`, GET + `createOrder`) is a strong
  # POLA-violation signal. Heuristic.
  # =========================================================================

  # Source: R-SP-5 + apiq B8;
  #         rules-brainstorm.md CL-64 / B8 (P2, heuristic)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl64-operationid-verb-matches-method:
    description: >-
      [CL-64] `operationId` should begin with a verb consistent with the
      HTTP method (GET → list/get/find/search, POST → create/add/post,
      PUT → replace/update/put, PATCH → patch/update, DELETE →
      delete/remove). Mismatches (POST + `getUser`, GET + `createX`)
      indicate semantic POLA-violations that confuse SDK consumers and
      AI agents. The verb-prefix is checked per HTTP method. Targets: *.
    message: "operationId `{{value}}` verb-prefix doesn't match HTTP method."
    severity: hint
    given:
      - "$.paths[*].get.operationId"
    then:
      function: pattern
      functionOptions:
        notMatch: "^(create|add|post|insert|delete|remove|put|replace|patch|update|destroy)([A-Z]|$)"
    apiq-meta:
      pattern-id: CL-64
      lenses: [client-friction, ai-agent-consumability]
      sources:
        - type: vendor
          name: 'R-SP-5 (operationId-method-coherence)'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'apiq B8 (heuristic naming)'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, ai-agent, spec-author]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: high

  # POST/PUT/PATCH/DELETE verb-prefix companion checks split from CL-64 above
  # so each has its own JSONPath narrowing.
  apiq-cl64-operationid-verb-matches-method-post:
    description: >-
      [CL-64] POST operationId should NOT begin with a non-creation verb
      (get/list/find/search/delete/remove). Targets: *.
    message: "POST operationId `{{value}}` begins with a verb that contradicts the HTTP method."
    severity: hint
    given: "$.paths[*].post.operationId"
    then:
      function: pattern
      functionOptions:
        notMatch: "^(get|list|find|search|fetch|read|delete|remove|destroy)([A-Z]|$)"
    apiq-meta:
      pattern-id: CL-64
      lenses: [client-friction, ai-agent-consumability]
      sources:
        - type: vendor
          name: 'R-SP-5 (operationId-method-coherence)'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, ai-agent, spec-author]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: high

  apiq-cl64-operationid-verb-matches-method-delete:
    description: >-
      [CL-64] DELETE operationId should NOT begin with a creation/read verb
      (create/add/post/get/list/find). Targets: *.
    message: "DELETE operationId `{{value}}` begins with a verb that contradicts the HTTP method."
    severity: hint
    given: "$.paths[*].delete.operationId"
    then:
      function: pattern
      functionOptions:
        notMatch: "^(create|add|post|insert|get|list|find|search|fetch|read)([A-Z]|$)"
    apiq-meta:
      pattern-id: CL-64
      lenses: [client-friction, ai-agent-consumability]
      sources:
        - type: vendor
          name: 'R-SP-5 (operationId-method-coherence)'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, ai-agent, spec-author]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: high

  # =========================================================================
  # CL-77 — Heavy allOf with multi non-$ref objects
  # Uses custom function allof-heavy-non-ref-objects. Multiple inline
  # object-schemas in one allOf indicate the author should refactor — codegen
  # produces an inheritance tree of synthetic intermediate types.
  # =========================================================================

  # Source: openapi-generator #9756 + multi-codegen consensus;
  #         rules-brainstorm.md CL-77 / A12 (P2, heuristic)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle C)
  apiq-cl77-allof-not-heavy-inline:
    description: >-
      [CL-77] `allOf` should compose ≤1 inline non-$ref object schema —
      typically `[{ \$ref: BaseSchema }, { type: object, properties: { extras } }]`.
      With ≥2 inline non-$ref objects, codegen tools emit deep inheritance
      trees with synthetic intermediate types
      (`AllOfX_AllOfY_inner_inner`). Extract intermediate schemas to
      named components and reference via `\$ref`. Targets: java, csharp,
      kotlin, go, typescript.
    message: "{{error}}"
    severity: warn
    # Use unresolved spec so `$ref` markers survive. The custom function
    # counts non-$ref inline objects.
    resolved: false
    given: "$..allOf"
    then:
      function: allof-heavy-non-ref-objects
    apiq-meta:
      pattern-id: CL-77
      lenses: [client-friction]
      sources:
        - type: vendor
          name: openapi-generator #9756
          url: 'https://github.com/OpenAPITools/openapi-generator/issues/9756'
          summary: 'heavy allOf with non-$ref objects produces inheritance-tree explosion'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [maintainability, usability]
      codegen-targets: [java, csharp, kotlin, go, typescript]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: low

  # =========================================================================
  # F-11 — Linguistic Amorphous URI segments
  # Uses custom function linguistic-amorphous-uri.
  # Path segments that are generic nouns ("data", "object", "thing", etc.)
  # give consumers no semantic info. Per Palma/Khomh DOLAR.
  # =========================================================================

  # Source: Palma & Khomh "An Empirical Study of REST APIs Linguistic
  #         Anti-patterns" (DOLAR, Springer 2015,
  #         doi 10.1007/978-3-662-48616-0_11);
  #         rules-brainstorm.md F-11 (P2, mech)
  # Lens: 4 (Client-Friction), 5 (Style-Coherence)
  # Round: 2 (Welle C)
  apiq-f11-no-amorphous-uri-segments:
    description: >-
      [F-11] Path segments that are generic nouns ("data", "object",
      "thing", "resource", "info", "entity", "item", "value", "content",
      "record", "element", "node") give consuming clients and AI agents
      no semantic information about the resource. Replace with the
      actual resource-type (e.g. `/users`, `/invoices`,
      `/subscriptions`). Per Palma & Khomh DOLAR (Springer 2015)
      Linguistic Amorphous URI anti-pattern. Targets: *.
    message: "{{error}}"
    severity: warn
    given: "$.paths[*]~"
    then:
      function: linguistic-amorphous-uri
    apiq-meta:
      pattern-id: F-11
      lenses: [client-friction, style-coherence, ai-agent-consumability]
      sources:
        - type: vendor
          name: 'Palma & Khomh DOLAR (Springer 2015)'
          url: 'https://link.springer.com/chapter/10.1007/978-3-662-48616-0_11'
          summary: 'Amorphous URI: URIs containing too generic words give clients no resource info'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, ai-agent, end-user, spec-author]
      lifecycle-phase: authoring-time
      defect-class: ergonomic
      iso25010: [usability]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: high

  # =========================================================================
  # F-12 — Linguistic Tiny Resource (1-2 chars)
  # Uses custom function linguistic-tiny-resource.
  # Per DOLAR: URI segments of 1-2 chars (excluding allowlisted: id, v1..v9,
  # me, region-codes) are too cryptic.
  # =========================================================================

  # Source: Palma & Khomh DOLAR (Springer 2015) Tiny-Resource anti-pattern;
  #         rules-brainstorm.md F-12 (P3, mech) — included per Plan-Doc §6
  #         "alle 4 DOLAR" directive.
  # Lens: 4 (Client-Friction), 5 (Style-Coherence)
  # Round: 2 (Welle C)
  apiq-f12-no-tiny-resource-segments:
    description: >-
      [F-12] Path segments of 1-2 characters (excluding allowlisted
      shorthands: `id`, `v1`..`v9` version-prefixes, region-codes
      `me`/`us`/`eu`/`au`/`jp`/`br`/`in`) are too cryptic for human
      and agent consumers. Use full resource-names (`/users` not `/u`,
      `/invoices` not `/iv`). Per Palma & Khomh DOLAR (Springer 2015)
      Tiny-Resource anti-pattern. Targets: *.
    message: "{{error}}"
    severity: hint
    given: "$.paths[*]~"
    then:
      function: linguistic-tiny-resource
    apiq-meta:
      pattern-id: F-12
      lenses: [client-friction, style-coherence, ai-agent-consumability]
      sources:
        - type: vendor
          name: 'Palma & Khomh DOLAR (Springer 2015)'
          url: 'https://link.springer.com/chapter/10.1007/978-3-662-48616-0_11'
          summary: 'Tiny Resource: 1-2 char URI segments are too cryptic'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, ai-agent, end-user, spec-author]
      lifecycle-phase: authoring-time
      defect-class: ergonomic
      iso25010: [usability]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # F-13 — Linguistic Forgotten Verbs
  # Per DOLAR: paths that don't use HTTP methods semantically and instead
  # bake the verb into the path (`/getUsers`, `/createInvoice`,
  # `/deleteOrder`). Direct-DSL pattern check.
  # =========================================================================

  # Source: Palma & Khomh DOLAR (Springer 2015) Forgotten-Verbs anti-pattern;
  #         rules-brainstorm.md F-13 (P3, graph) — included per Plan-Doc §6
  #         "alle 4 DOLAR" directive.
  # Lens: 5 (Style-Coherence)
  # Round: 2 (Welle C)
  apiq-f13-no-verb-in-uri-path:
    description: >-
      [F-13] Path segments should NOT bake HTTP-verb semantics into the
      URI (`/getUsers`, `/createInvoice`, `/deleteOrder`,
      `/updateProfile`, `/listOrders`). Use the HTTP method instead
      (GET /users, POST /invoices, DELETE /orders/{id}). Per Palma &
      Khomh DOLAR (Springer 2015) Forgotten Verbs anti-pattern.
      Targets: *.
    message: "Path `{{value}}` bakes a verb into the URI; use the HTTP method instead."
    severity: hint
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        notMatch: "/(get|create|update|delete|list|find|search|fetch|insert|remove|destroy|put|post|patch|read|add|edit|modify|cancel|process|execute|run|invoke|do)[A-Z][a-zA-Z]+(/|$)"
    apiq-meta:
      pattern-id: F-13
      lenses: [style-coherence, ai-agent-consumability]
      sources:
        - type: vendor
          name: 'Palma & Khomh DOLAR (Springer 2015)'
          url: 'https://link.springer.com/chapter/10.1007/978-3-662-48616-0_11'
          summary: 'Forgotten Verbs: paths that bake HTTP-verb semantics into URI'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, ai-agent, end-user, spec-author]
      lifecycle-phase: authoring-time
      defect-class: ergonomic
      iso25010: [usability, maintainability]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: high

  # =========================================================================
  # F-14 — Linguistic Pluralised Nodes (sing/plur on same resource)
  # Per DOLAR: same conceptual resource appears as both singular and plural
  # in different paths (`/user/{id}` AND `/users/{id}`). The cross-path
  # detection lives in the path-template-parser walker; this rule is a
  # path-style sentinel that fires on collection paths missing -s suffix.
  # =========================================================================

  # Source: Palma & Khomh DOLAR (Springer 2015) Pluralised-Nodes anti-pattern;
  #         rules-brainstorm.md F-14 (P2, graph)
  # Lens: 5 (Style-Coherence)
  # Round: 2 (Welle C)
  apiq-f14-pluralised-nodes-walker-sentinel:
    description: >-
      [F-14] Same conceptual resource MUST NOT appear as both singular
      and plural across paths (`/user/{id}` AND `/users/{id}`). The
      cross-path detection is performed by the path-template-parser
      walker; this rule serves as a catalog-visibility sentinel for
      the F-14 pattern-id. Per Palma & Khomh DOLAR (Springer 2015)
      Pluralised Nodes anti-pattern. Targets: *.
    message: "Path present (sentinel rule for F-14 — full sing/plur cross-path detection in path-template-parser walker)."
    severity: hint
    given: "$.paths[*]~"
    then:
      function: truthy
    apiq-meta:
      pattern-id: F-14
      lenses: [style-coherence, ai-agent-consumability]
      sources:
        - type: vendor
          name: 'Palma & Khomh DOLAR (Springer 2015)'
          url: 'https://link.springer.com/chapter/10.1007/978-3-662-48616-0_11'
          summary: 'Pluralised Nodes: same resource appears in singular AND plural'
        - type: mining
          phase: round2
          subagent: t18b-client
      stakeholders: [client-dev, ai-agent, spec-author]
      lifecycle-phase: authoring-time
      defect-class: ergonomic
      iso25010: [usability, maintainability]
      codegen-targets: ['*']
      detection-precision: low
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium
