  # =========================================================================
  # CL-78 — Schema combines allOf + oneOf + anyOf siblings
  # Targets: * (composition-soup overwhelms codegen).
  # Stock DSL: schema check.
  # =========================================================================
  # Source: Speakeasy;
  #         rules-brainstorm.md CL-78 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl78-no-allof-oneof-anyof-siblings:
    description: >-
      [CL-78] A schema combining `allOf`, `oneOf`, AND `anyOf` as direct siblings is composition-soup — codegen produces synthetic intermediate types that obscure the SDK shape. Pick at most 2 of the 3 composition keywords and refactor the third via named components. Targets: java, csharp, kotlin, typescript, go (strict-typed-targets struggle most).
    message: "Schema declares allOf, oneOf, AND anyOf as siblings — composition-soup confuses codegen."
    severity: warn
    given: "$..[?(@.allOf && @.oneOf && @.anyOf)]"
    then:
      function: falsy
    apiq-meta:
      pattern-id: CL-78
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: 'Speakeasy schema-composition guidance'
          url: 'https://www.speakeasy.com/openapi'
          summary: 'allOf+oneOf+anyOf together as siblings is composition-soup — confuses codegen'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [ maintainability, usability ]
      codegen-targets: [ java, csharp, kotlin, typescript, go ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: low

  # =========================================================================
  # CL-79 — requestBody form-urlencoded + JSON simultaneously
  # Targets: * (codegen has to pick one — typically JSON wins).
  # Stock DSL.
  # =========================================================================
  # Source: openapi-gen #4908;
  #         rules-brainstorm.md CL-79 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl79-no-form-and-json-same-request:
    description: >-
      [CL-79] Request bodies declaring both `application/json` AND `application/x-www-form-urlencoded` force codegen to pick one content-type — typically JSON wins, and form-urlencoded support is silently dropped. Pick one canonical content-type or split into two operations. Targets: java, csharp, kotlin, go, typescript (strict-typed targets surface the union as synthetic intermediate type).
    message: "Request body declares both `application/json` and `application/x-www-form-urlencoded`; codegen picks one."
    severity: warn
    given: "$.paths[*][*].requestBody.content"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          not:
            allOf:
              - required: [ 'application/json' ]
              - required: [ 'application/x-www-form-urlencoded' ]
    apiq-meta:
      pattern-id: CL-79
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: openapi-gen #4908
          url: 'https://github.com/OpenAPITools/openapi-generator/issues/4908'
          summary: 'requestBody form-urlencoded + JSON simultaneously forces codegen to pick'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [ usability, compatibility ]
      codegen-targets: [ java, csharp, kotlin, go, typescript ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # CL-80 / M-SP-3 mirrors — readOnly:true AND required:true
  # Targets: typescript, java, csharp, kotlin (strict-typed languages
  # surface the conflict).
  # Custom function: read-only-required-conflict.
  # =========================================================================
  # Source: M-SP-3 mirrors;
  #         rules-brainstorm.md CL-80 (P3)
  # Lens: 4 (Client-Friction), 3 (Evolution-Friction)
  # Round: 2 (Welle D)
  apiq-cl80-no-readonly-required-conflict:
    description: >-
      [CL-80] A property that is both `readOnly: true` AND in parent's `required` array creates an impossible contract: clients cannot satisfy the required-constraint on POST/PUT input (since readOnly fields are server-set), yet the spec demands it. Strict-typed SDKs produce uncomfortable "always-set-but-server-ignores" semantics. Pick one: either `readOnly` (server-managed) OR `required` (client-supplied). Targets: typescript, java, csharp, kotlin.
    message: "{{error}}"
    severity: hint
    given:
      - "$.components.schemas[*]"
      - "$..[?(@.type === 'object' && @.required && @.properties)]"
    then:
      function: read-only-required-conflict
    apiq-meta:
      pattern-id: CL-80
      lenses: [ client-friction, evolution-friction ]
      sources:
        - type: vendor
          name: 'M-SP-3 mirrors (read-only-required-conflict)'
          summary: 'readOnly:true + required:true creates impossible client-input contract'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: semantic
      iso25010: [ reliability, compatibility ]
      codegen-targets: [ typescript, java, csharp, kotlin ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: medium
