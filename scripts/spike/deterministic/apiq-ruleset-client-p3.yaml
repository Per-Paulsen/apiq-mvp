  # Lens: 4 (Client-Friction), 1 (Threat-Modeling)
  # Round: 2 (Welle D)
  apiq-cl74-webhook-signature-walker-sentinel:
    description: >-
      [CL-74] Specs with `callbacks` (3.0) or `webhooks` (3.1) MUST document signature verification (HMAC, JWS, X-Signature header). Without it, SDK consumers cannot reject spoofed webhook deliveries. Cross-section walk lives in the security-classifier walker; this rule is a sentinel. Per Twilio + Stripe webhook-best-practices. Targets: *.
    message: "callbacks/webhooks present (sentinel rule for CL-74 — full signature-presence-walk in security-classifier walker)."
    severity: hint
    given:
      - "$..callbacks"
      - "$.webhooks"
    then:
      function: truthy
    apiq-meta:
      pattern-id: CL-74
      lenses: [ client-friction, threat-modeling ]
      sources:
        - type: vendor
          name: 'Twilio + Stripe webhook-signature best-practices'
          url: 'https://www.twilio.com/docs/usage/webhooks/webhooks-security'
          summary: 'webhook deliveries must be HMAC-signed for SDK consumers to reject spoofed traffic'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, security, ai-agent, spec-author ]
