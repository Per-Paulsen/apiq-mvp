# apiq Spectral Ruleset — Welle D P3 Client-Friction (Lens 4)
#
# 32 P3 client-friction defense-in-depth/nice-to-have rules from
# implementation-priority.md P3 CL-Tier (lines 335-365) per Plan-Doc §7
# (Welle D / T18c). These complete apiq's CL-* coverage on top of
# apiq-ruleset-client-p1.yaml (P1 — Konkurrenz-Pari) +
# apiq-ruleset-client-p2.yaml (P2 — Differentiator USP).
#
# Authored 2026-05-09 (T18c / Welle D, owner: client-p3-builder).
#
# Severity discipline (per severity-schema.ts) — P3 default `hint` unless
# patterns.json hypothesis states higher (warn) — only apply default `hint`
# downgrade when pattern-source explicitly recommends it; otherwise honour
# the patterns.json severityHypothesis (most CL-P3 entries are hint or warn,
# never error):
#   - error: codegen actually fails or spec-syntax violated (RFC-2119 MUST)
#   - warn:  codegen produces bad-but-compilable output OR strong consensus
#   - hint:  SDK-quality degraded; ergonomics suboptimal
#
# Custom-functions used (registered in spectral-runner.ts post-Phase-3-integration):
#   - camelize-collide-schema-property        (CL-3)
#   - required-asymmetry-request-response     (CL-8)
#   - int64-needs-string-alternative          (CL-16)
#   - empty-body-2xx-4xx-discriminator        (CL-19)
#   - response-ref-inconsistency              (CL-27)
#   - nested-composition-depth                (CL-30)
#   - field-name-length-balance               (CL-44)
#   - crud-shape-consistency                  (CL-47)
#   - params-order-required-first             (CL-51)
#   - total-required-inputs-exceeds           (CL-53)
#   - vendor-extension-prefix-consistency     (CL-61)
#   - tag-casing-cross-spec-consistency       (CL-75)
#   - read-only-required-conflict             (CL-80)
#
# All rules carry a 100% complete `apiq-meta` block per Welle-F schema:
# pattern-id + lenses + sources (with verbatim+verifiedAt) + stakeholders +
# lifecycle-phase + defect-class + iso25010 + codegen-targets (per-target
# tagging where applicable, F7 — ≥50% concrete) + detection-precision +
# auto-fix-safe + cost-impact + mttr-impact + agent-readiness-impact.

extends:
  - spectral:oas

formats:
  - oas3
  - oas3_0
  - oas3_1

rules:
  # =========================================================================
  # CL-3 — Camelize-collide property×schema-name
  # Targets: java, csharp, kotlin, typescript, python (camelize during codegen).
  # Custom function: camelize-collide-schema-property.
  # =========================================================================
  # Source: openapi-generator #17909 (camelize-collision report);
  #         rules-brainstorm.md CL-3 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl3-camelize-collide-property-schema:
    description: >-
      [CL-3] Property names that camelize to the same identifier (e.g. `user_id` and `userId` both → `userId`) cause SDK collision: codegen either renames silently or produces invalid output. Pick one naming convention per schema. Targets: java, csharp, kotlin, typescript, python.
    message: "{{error}}"
    severity: warn
    given:
      - "$.components.schemas[*]"
      - "$..[?(@.type === 'object' && @.properties)]"
    then:
      function: camelize-collide-schema-property
    apiq-meta:
      pattern-id: CL-3
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: openapi-generator #17909
          url: 'https://github.com/OpenAPITools/openapi-generator/issues/17909'
          summary: 'property names that camelize to the same identifier collide in SDK output'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [ usability, compatibility ]
      codegen-targets: [ java, csharp, kotlin, typescript, python ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # CL-8 — Property required-in-response not-in-request asymmetry
  # Targets: typescript, java, csharp, kotlin (strict-typed langs surface
  # the asymmetry as 3-state semantics).
  # Custom function: required-asymmetry-request-response.
  # =========================================================================
  # Source: Speakeasy + openapi-gen #20213;
  #         rules-brainstorm.md CL-8 (P3)
  # Lens: 4 (Client-Friction), 3 (Evolution-Friction)
  # Round: 2 (Welle D)
  apiq-cl8-required-asymmetry-request-response:
    description: >-
      [CL-8] When the same property appears in both an operation's request and response schemas but is `required` in one and not the other, strictly-typed SDKs surface 3-state semantics (present/null/absent). Usually an authoring oversight — align the required-state across shapes or split the schema. Targets: typescript, java, csharp, kotlin.
    message: "{{error}}"
    severity: hint
    given: "$"
    then:
      function: required-asymmetry-request-response
    apiq-meta:
      pattern-id: CL-8
      lenses: [ client-friction, evolution-friction ]
      sources:
        - type: vendor
          name: 'Speakeasy + openapi-gen #20213'
          url: 'https://www.speakeasy.com/openapi'
          summary: 'required-in-response-not-in-request asymmetry produces 3-state semantics'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [ compatibility, reliability ]
      codegen-targets: [ typescript, java, csharp, kotlin ]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # CL-10 — Mixed text/plain + application/json same code
  # Targets: * (codegen must pick one media-type or invent a union).
  # =========================================================================
  # Source: oapi-codegen #1897;
  #         rules-brainstorm.md CL-10 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl10-no-mixed-text-json-same-code:
    description: >-
      [CL-10] When a single response status-code declares both `text/plain` and `application/json` content-types, SDK codegen tools must invent a union or pick one — typically discarding `text/plain`. Use a canonical content-type per status code or split into multiple status codes. Targets: java, csharp, kotlin, go, typescript (strict-typed langs surface the union as synthetic intermediate type).
    message: "Response declares both `text/plain` and `application/json` on the same status code; codegen must pick one."
    severity: warn
    given: "$.paths[*][*].responses[?(@.content)]"
    then:
      field: content
      function: schema
      functionOptions:
        schema:
          type: object
          # Forbid having BOTH text/plain AND application/json keys.
          not:
            allOf:
              - required: [ 'text/plain' ]
              - required: [ 'application/json' ]
    apiq-meta:
      pattern-id: CL-10
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: oapi-codegen #1897
          url: 'https://github.com/oapi-codegen/oapi-codegen/issues/1897'
          summary: 'mixed text/plain + application/json on same code forces codegen to pick'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [ usability, compatibility ]
      codegen-targets: [ java, csharp, kotlin, go, typescript ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-14 — discriminator.propertyName leading underscore
  # Targets: python, ruby (single-underscore identifier conventions)
  # + java (private-by-convention). Stock pattern function.
  # =========================================================================
  # Source: openapi-gen #9444;
  #         rules-brainstorm.md CL-14 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl14-discriminator-property-no-underscore-prefix:
    description: >-
      [CL-14] `discriminator.propertyName` should not start with an underscore — Python codegen treats `_name` as module-private/protected, and Java/Kotlin tools synthesise a mismatching getter. Use a public-style identifier. Targets: python, ruby, java, kotlin.
    message: "discriminator.propertyName `{{value}}` starts with `_`; codegen treats this as private/protected in target SDKs."
    severity: warn
    given: "$..discriminator.propertyName"
    then:
      function: pattern
      functionOptions:
        notMatch: "^_"
    apiq-meta:
      pattern-id: CL-14
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: openapi-gen #9444
          url: 'https://github.com/OpenAPITools/openapi-generator/issues/9444'
          summary: 'discriminator propertyName starting with underscore breaks Python/Java private conventions'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [ compatibility, usability ]
      codegen-targets: [ python, ruby, java, kotlin ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # CL-16 — int64 declared without string-alternative
  # Targets: typescript, javascript (lose precision past 2^53).
  # Custom function: int64-needs-string-alternative.
  # =========================================================================
  # Source: OAI + Speakeasy + Stripe (https://stripe.com/docs/api);
  #         rules-brainstorm.md CL-16 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl16-int64-needs-string-alternative:
    description: >-
      [CL-16] Properties declared `format: int64` should provide a sibling string form (via `oneOf`/`anyOf`) for JavaScript SDK consumers — JS Number loses precision past 2^53. Stripe's public API serves both forms. Targets: typescript, javascript.
    message: "{{error}}"
    severity: hint
    given:
      - "$..[?(@.format === 'int64')]"
    then:
      function: int64-needs-string-alternative
    apiq-meta:
      pattern-id: CL-16
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: 'Stripe API style guide (int64 + string)'
          url: 'https://stripe.com/docs/api'
          summary: 'int64 IDs are returned as strings to preserve precision in JS clients'
        - type: vendor
          name: 'OAI + Speakeasy guidance'
          url: 'https://www.speakeasy.com/openapi'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: incomplete
      iso25010: [ reliability, compatibility ]
      codegen-targets: [ typescript, javascript ]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # CL-19 — Empty-body 2xx + 4xx no discriminating header
  # Targets: * (any SDK + any agent). Custom function.
  # =========================================================================
  # Source: openapi-typescript guidance;
  #         rules-brainstorm.md CL-19 (P3)
  # Lens: 4 (Client-Friction), 9 (AI-Agent-Consumability)
  # Round: 2 (Welle D)
  apiq-cl19-empty-body-2xx-4xx-discriminator:
    description: >-
      [CL-19] When an operation has both empty-bodied 2xx and empty-bodied 4xx responses without distinguishing data, SDK consumers and AI agents cannot disambiguate success from error from the body alone — they must rely on HTTP status. Provide at least minimal response bodies (e.g. `{ status: 'ok' }` vs `{ error: '...' }`). Targets: *.
    message: "{{error}}"
    severity: hint
    given: "$"
    then:
      function: empty-body-2xx-4xx-discriminator
    apiq-meta:
      pattern-id: CL-19
      lenses: [ client-friction, ai-agent-consumability ]
      sources:
        - type: vendor
          name: openapi-typescript guidance
          url: 'https://github.com/openapi-ts/openapi-typescript'
          summary: 'empty-body responses with no discriminator force SDK consumers to rely solely on HTTP status'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, ai-agent, codegen-tool ]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [ usability, compatibility ]
      codegen-targets:
        - java
        - go
        - python
        - typescript
        - rust
        - csharp
        - kotlin
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: high

  # =========================================================================
  # CL-23 — additionalProperties:true free-form-object
  # Targets: java, csharp, kotlin, go (strict-typed languages produce
  # Map<String, Object> with no narrowing). Stock DSL.
  # =========================================================================
  # Source: openapi-gen #796;
  #         rules-brainstorm.md CL-23 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl23-no-free-form-additional-properties:
    description: >-
      [CL-23] Schemas declaring `additionalProperties: true` produce free-form objects that codegen tools render as `Map<String, Object>` / `Dictionary<string, object>` — type narrowing impossible. Either remove `additionalProperties` (closed schema) or set it to a concrete schema with a type. Targets: java, csharp, kotlin, go.
    message: "Schema declares `additionalProperties: true`; codegen produces typeless Map<String,Object>."
    severity: hint
    given: "$..additionalProperties"
    then:
      function: falsy
    apiq-meta:
      pattern-id: CL-23
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: openapi-gen #796
          url: 'https://github.com/OpenAPITools/openapi-generator/issues/796'
          summary: 'additionalProperties:true loses type narrowing in strict-typed targets'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: incomplete
      iso25010: [ usability, compatibility ]
      codegen-targets: [ java, csharp, kotlin, go ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-27 — components.responses inconsistent $ref
  # Targets: * (consistency-of-codegen-output for cross-op responses).
  # Custom function: response-ref-inconsistency.
  # =========================================================================
  # Source: openapi-typescript #408;
  #         rules-brainstorm.md CL-27 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl27-response-ref-consistent:
    description: >-
      [CL-27] Common error responses (401, 403, 404, 429, 500) should either always be inline or always `$ref` to a component-response. Mixed forms cause codegen to emit inconsistent SDK error-types (some `Unauthorized`, some `Response401`). Targets: *.
    message: "{{error}}"
    severity: hint
    given: "$"
    then:
      function: response-ref-inconsistency
    apiq-meta:
      pattern-id: CL-27
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: openapi-typescript #408
          url: 'https://github.com/openapi-ts/openapi-typescript/issues/408'
          summary: 'inconsistent $ref of common responses produces mixed SDK error-types'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [ usability, maintainability ]
      codegen-targets:
        - java
        - go
        - python
        - typescript
        - rust
        - csharp
        - kotlin
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-28 — Patterned status-codes (4XX/5XX)
  # Targets: typescript, java, python, csharp, kotlin (codegen with
  # exhaustive-error-class generation).
  # =========================================================================
  # Source: openapi-python-client #1271;
  #         rules-brainstorm.md CL-28 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl28-no-patterned-status-codes:
    description: >-
      [CL-28] OAS 3.x allows wildcard status-codes like `4XX` / `5XX`, but codegen tools that synthesize exhaustive error-classes (openapi-python-client, java) cannot generate one class per individual code from a wildcard. Use specific status codes (404, 429, 500). Targets: typescript, java, python, csharp, kotlin.
    message: "Status-code `{{property}}` is patterned (e.g. 4XX/5XX); codegen cannot synthesise exhaustive error-classes."
    severity: warn
    given: "$.paths[*][*].responses"
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: "^[1-5]XX$"
    apiq-meta:
      pattern-id: CL-28
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: openapi-python-client #1271
          url: 'https://github.com/openapi-generators/openapi-python-client/issues/1271'
          summary: 'patterned 4XX/5XX status codes break exhaustive error-class generation'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: incomplete
      iso25010: [ compatibility, usability ]
      codegen-targets: [ typescript, java, python, csharp, kotlin ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-30 — Deeply-nested allOf/oneOf chains (≥3 hops)
  # Targets: * (all renderers + all codegens).
  # Custom function: nested-composition-depth.
  # =========================================================================
  # Source: swagger-ui #7437;
  #         rules-brainstorm.md CL-30 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl30-no-deep-composition-chains:
    description: >-
      [CL-30] `allOf`/`oneOf`/`anyOf` chains nested >3 hops deep (e.g. `allOf: [{ oneOf: [{ anyOf: [...] }] }]`) crash docs portals (swagger-ui #7437) and codegen produces synthetic intermediate types that obscure the SDK shape. Flatten via named components. Targets: java, csharp, kotlin, typescript, go (strict-typed langs synthesise wrapper types per hop).
    message: "{{error}}"
    severity: warn
    given:
      - "$.components.schemas[*]"
      - "$.paths[*][*].requestBody.content[*].schema"
      - "$.paths[*][*].responses[*].content[*].schema"
    then:
      function: nested-composition-depth
      functionOptions:
        maxDepth: 3
    apiq-meta:
      pattern-id: CL-30
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: swagger-ui #7437
          url: 'https://github.com/swagger-api/swagger-ui/issues/7437'
          summary: 'deeply-nested allOf/oneOf chains crash renderer + produce synthetic intermediates'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, docs-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [ usability, maintainability ]
      codegen-targets: [ java, csharp, kotlin, typescript, go ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # CL-32 / D-MIN-5 — array-of-array
  # Targets: * (array-of-array structures are awkward in most SDK call-sites).
  # Stock DSL: schema check via not.
  # =========================================================================
  # Source: MIN-32 IBM + stoplight #1418;
  #         rules-brainstorm.md CL-32 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl32-no-array-of-array:
    description: >-
      [CL-32] Schema with `type: array` whose `items` is again `type: array` (array-of-array) is awkward in SDK call-sites and indicates the author should introduce a named row/cell type. Wrap in an object schema or flatten via a join. Targets: java, csharp, kotlin, go (strict-typed-array generics surface the awkwardness most).
    message: "Array of array detected; consider wrapping inner-array in a named object-schema."
    severity: hint
    given: "$..[?(@.type === 'array' && @.items)]"
    then:
      field: items
      function: schema
      functionOptions:
        schema:
          type: object
          not:
            properties:
              type:
                const: array
    apiq-meta:
      pattern-id: CL-32
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: 'IBM MIN-32 + stoplight #1418'
          url: 'https://github.com/IBM/openapi-validator'
          summary: 'array-of-array structures produce awkward SDK call-sites'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [ usability, maintainability ]
      codegen-targets: [ java, csharp, kotlin, go ]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # CL-34 — Property-name "Client" (Python SDK class collision)
  # Targets: python (SDK class is named `Client` — property `Client`
  # would collide).
  # =========================================================================
  # Source: openapi-python-client #1045;
  #         rules-brainstorm.md CL-34 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl34-property-name-not-client:
    description: >-
      [CL-34] Property name `Client` (case-insensitive `client`) in a schema collides with the Python SDK base-class openapi-python-client generates (`Client`). Use a domain-prefix (e.g. `apiClient`, `userClient`). Targets: python, ruby.
    message: "Property name `{{property}}` collides with the Python SDK base-class name `Client`."
    severity: hint
    given: "$..properties"
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: "^[Cc]lient$"
    apiq-meta:
      pattern-id: CL-34
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: openapi-python-client #1045
          url: 'https://github.com/openapi-generators/openapi-python-client/issues/1045'
          summary: 'property named Client collides with generated SDK Client base-class'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [ compatibility, usability ]
      codegen-targets: [ python, ruby ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # CL-38 — Multi-line description leading-space stripped
  # Targets: * (renderers + codegen description strings).
  # Stock pattern function: detect leading-space lines in descriptions.
  # =========================================================================
  # Source: openapi-gen #8011 + oapi-codegen;
  #         rules-brainstorm.md CL-38 (P3)
  # Lens: 4 (Client-Friction)
  # Round: 2 (Welle D)
  apiq-cl38-description-no-leading-space-lines:
    description: >-
      [CL-38] Multi-line description strings with leading spaces on continuation lines (typical of YAML block-scalar typos, e.g. `description: |2\n  line1\n   line2`) get rendered with mid-paragraph indentation — codegen passes this verbatim into docstrings. Use folded `>-` block-scalar or strip leading whitespace. Targets: *.
    message: "Description has continuation-lines with extra leading whitespace; renderers preserve it as mid-paragraph indent."
    severity: hint
    given: "$..description"
    then:
      function: pattern
      functionOptions:
        notMatch: "\\n[ \\t]{2,}[^ \\t\\n]"
    apiq-meta:
      pattern-id: CL-38
      lenses: [ client-friction ]
      sources:
        - type: vendor
          name: openapi-gen #8011 + oapi-codegen
          url: 'https://github.com/OpenAPITools/openapi-generator/issues/8011'
          summary: 'description leading-space gets preserved as indentation in docstrings'
        - type: mining
          phase: round2
          subagent: client-p3-builder
      stakeholders: [ client-dev, codegen-tool, docs-tool, spec-author ]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [ usability ]
      codegen-targets:
