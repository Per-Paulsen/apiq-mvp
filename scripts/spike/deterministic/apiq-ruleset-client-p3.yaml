  # Source: MIN Q-SP-5;
  #         rules-brainstorm.md CL-75 (P3)
  # Lens: 4 (Client-Friction), 5 (Style-Coherence)
  # Round: 2 (Welle D)
  apiq-cl75-tag-casing-consistent:
    description: >-
      [CL-75] Tag names should follow ONE casing convention across the spec — all PascalCase OR all camelCase OR all kebab-case OR all snake_case. Mixed casings produce inconsistent SDK method-group names (`UsersApi`, `usersApi`, `users_api`) and broken docs sidebar. Targets: *.
    message: "{{error}}"
    severity: hint
    given: "$"
    then:
      function: tag-casing-cross-spec-consistency
    apiq-meta:
      pattern-id: CL-75
