  # =========================================================================
  # CL-55 — Uppercase mixed lowercase enum values.
  # Cross-element pattern; we approximate with a per-enum check that fires
  # when both an UPPERCASE-looking value AND a lowercase-looking value
  # co-exist. Pure Spectral can't easily express this — we use a `schema`
  # function that inspects the array as a whole.
  # =========================================================================

  # Source: SG-37 + apiq M12 (Round-1);
  #         rules-brainstorm.md CL-55 (P1)
  # Lens: 4 (Client-Friction)
  # Round: 2
  apiq-cl55-enum-casing-uniform:
    description: >-
      [CL-55] Enum value-arrays should be uniform-case (all UPPERCASE,
      all snake_case, or all kebab-case) — mixing cases produces awkward
      generated identifiers in Go (`EnumABC` vs `EnumAbc`) and Rust
      (`Camel` vs `SCREAMING`). Targets: *.
    message: "Enum mixes UPPERCASE and lowercase values; pick one casing convention."
    severity: warn
    given: "$..enum"
    then:
      function: schema
      functionOptions:
        schema:
          # AJV-evaluable expression: NOT (any-uppercase AND any-lowercase).
          # We approximate via `not: { allOf: [contains-upper, contains-lower] }`.
          not:
            allOf:
              - contains:
                  type: string
                  pattern: "^[A-Z][A-Z0-9_]*$"
              - contains:
                  type: string
                  pattern: "^[a-z][a-z0-9_]*$"
    apiq-meta:
      pattern-id: CL-55
      lenses: [client-friction, style-coherence]
      sources:
        - type: vendor
          name: 'SG-37 (style-guide enum-casing consensus)'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round1
          subagent: m12-naming
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability]
      codegen-targets: [go, rust]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # CL-57 — enum with duplicate values.
  # spectral:oas covers via `duplicated-entry-in-enum`; tagged here for the
