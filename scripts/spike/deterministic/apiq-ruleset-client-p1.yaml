# apiq Spectral Ruleset — Welle B P1 Client-Friction (Lens 4)
#
# 25 P1 client-friction rules from Mining-Round-2 Phase D
# (`specs/big-spec-architecture-spike-stage-a-mining-round2-client.md`).
#
# Authored 2026-05-06 (T18a / Task #47, owner: t18a-client).
#
# These rules complement `apiq-ruleset.yaml` — they're loaded as a separate
# YAML so the spectral-runner merges them on top of the base ruleset, and so
# the file ownership / mining-provenance is clear.
#
# Severity discipline (per severity-schema.ts):
#   - error: codegen actually fails or spec-syntax is violated
#   - warn:  codegen produces bad-but-compilable output OR a renderer fails
#   - hint:  SDK-quality degraded; ergonomics suboptimal
#
# Each rule's `description` records the pattern-ID and the codegen targets
# affected so the metadata-layer (severity-schema.ts:CodegenTargetSchema)
# can group findings by per-target rule-set.
#
# CL-1 (multi-lang reserved-keywords) uses the custom Spectral function
# `multi-lang-reserved-keywords` registered by spectral-runner.ts from
# `spectral-functions/multi-lang-reserved-keywords.ts`. All other rules
# use the built-in functions Spectral ships.

extends:
  - spectral:oas

formats:
  - oas3
  - oas3_0
  - oas3_1

rules:
  # =========================================================================
  # CL-1 — Multi-lang reserved-keyword allowlist (LOAD-BEARING)
  # Targets: java, go, python, javascript, rust, csharp, kotlin
  # =========================================================================

  # CL-1a — properties named after a reserved keyword in any of 7 SDK targets.
  # Source: openapi-generator multi-issue (#1831, #7100) + swagger-codegen
  #         #4805 + per-language reserved-keyword catalogs (Java/Go/Python/JS/
  #         Rust/C#/Kotlin); rules-brainstorm.md CL-1 (P1, load-bearing)
  # Lens: 4 (Client-Friction)
  # Round: 2
  apiq-cl1-property-name-reserved-keyword:
    description: >-
      [CL-1] Property name collides with a reserved keyword / built-in
      identifier in one of the supported SDK target languages
      (Java, Go, Python, JavaScript, Rust, C#, Kotlin). Codegen tools
      either silently rename, fail to compile, or produce ambiguous code.
      Targets: java, go, python, typescript, rust, csharp, kotlin.
    message: "{{error}}"
    severity: warn
    given: "$..properties[*]~"
    then:
      function: multi-lang-reserved-keywords
      functionOptions:
        kind: property
    apiq-meta:
      pattern-id: CL-1
      lenses: [client-friction]
      sources:
        - type: vendor
          name: openapi-generator multi-issue (#1831, #7100)
          verbatim: 'reserved word collides with target-language identifier'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: swagger-codegen #4805
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, codegen-tool, ai-agent]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability, compatibility]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # CL-1b — operationId values that collide.
  # Source: openapi-generator multi-issue + per-language reserved-keyword catalogs;
  #         rules-brainstorm.md CL-1 (P1)
  # Lens: 4 (Client-Friction)
  # Round: 2
  apiq-cl1-operationid-reserved-keyword:
    description: >-
      [CL-1] operationId collides with a reserved keyword / built-in
      identifier in one of the supported SDK target languages. SDK-method
      generators use operationId as a method name; collision = unbuildable
      SDK or silently-renamed method. Targets: java, go, python, typescript,
      rust, csharp, kotlin.
    message: "{{error}}"
    severity: warn
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace].operationId"
    then:
      function: multi-lang-reserved-keywords
      functionOptions:
        kind: operationId
    apiq-meta:
      pattern-id: CL-1
      lenses: [client-friction]
      sources:
        - type: vendor
          name: openapi-generator multi-issue (#1831, #7100)
          verbatim: 'reserved word collides with target-language identifier'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: swagger-codegen #4805
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, codegen-tool, ai-agent]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability, compatibility]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-2 — Property-name with leading underscore or leading digit.
  # Targets: java (compile-fail), go (collisions after underscore-strip),
  # python (reserved name-mangling).
  # =========================================================================

  # Source: swagger-codegen #4805 + openapi-generator (multi-language
  #         compile-fail / collision); rules-brainstorm.md CL-2 (P1)
  # Lens: 4 (Client-Friction)
  # Round: 2
  apiq-cl2-property-name-leading-underscore-or-digit:
    description: >-
      [CL-2] Property names with a leading underscore or leading digit
      cause Go-codegen to strip and collide, Java to fail-to-compile, and
      Python to mangle (double-underscore becomes name-mangled). Use a
      letter-prefixed identifier instead.
      Targets: java, go, python.
    message: "Property name `{{property}}` starts with `_` or a digit; codegen tools break."
    severity: warn
    given: "$..properties[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^[A-Za-z][A-Za-z0-9_]*$"
    apiq-meta:
      pattern-id: CL-2
      lenses: [client-friction]
      sources:
        - type: vendor
          name: swagger-codegen #4805
          verifiedAt: '2026-05-08'
        - type: vendor
          name: openapi-generator (multi-language compile-fail/collision)
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, codegen-tool]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability, compatibility]
      codegen-targets: [java, go, python]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # CL-6 — operationId missing entirely.
  # Re-emphasised here with apiq-pattern-id metadata (spectral:oas already
  # has `operation-operationId`; this rule is intentionally additive so
  # the apiq finding-mapping can carry the CL-6 pattern-tag).
  # =========================================================================

  # Source: openapi-generator + spectral:oas operation-operationId;
  #         rules-brainstorm.md CL-6 (P1) + EV-8 (P1, drift)
  # Lens: 4 (Client-Friction), 3 (Evolution-Friction)
  # Round: 2
  apiq-cl6-operationid-required:
    description: >-
      [CL-6] Every operation MUST declare an `operationId`. SDK-codegen
      tools and SDK-method-naming all key off operationId; absence forces
      the tool to invent a name from path+method, producing unidiomatic
      SDK methods. Targets: *.
    message: "Operation lacks `operationId`; SDK codegen cannot derive a stable method name."
    severity: warn
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace]"
    then:
      field: operationId
      function: defined
    apiq-meta:
      pattern-id: CL-6
      lenses: [client-friction, evolution-friction, ai-agent-consumability]
      sources:
        - type: vendor
          name: openapi-generator (operation-operationId)
          verbatim: 'operationId is the canonical method-naming key'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: spectral:oas operation-operationId
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, codegen-tool, docs-tool, ai-agent]
      lifecycle-phase: build-time
      defect-class: incomplete
      iso25010: [usability, maintainability]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: high

  # =========================================================================
  # CL-12 — oneOf without discriminator.
  # apiq-ruleset.yaml has `apiq-oneof-needs-discriminator` already at hint;
  # CL-12 confirms upgrade to warn for P1.
  # =========================================================================

  # Source: OAS 3.0 §4.7.25 + Redocly + multi-codegen;
  #         rules-brainstorm.md CL-12 (P1, severity-upgrade hint→warn)
  # Lens: 4 (Client-Friction)
  # Round: 2
  apiq-cl12-oneof-needs-discriminator:
    description: >-
      [CL-12] `oneOf` schemas should declare a `discriminator` to enable
      machine-readable variant deserialisation per OAS 3.0 §4.7.25.
      Without discriminator, codegen produces verbose union-handling
      (TS produces `T1|T2|...`, Java needs custom deserializer).
      Targets: *.
    message: "`oneOf` schema lacks `discriminator`; codegens fall back to runtime variant-probing."
    severity: warn
    given: "$..[?(@.oneOf && @.oneOf.length > 1 && !@.discriminator)]"
    then:
      field: discriminator
      function: defined
    apiq-meta:
      pattern-id: CL-12
      lenses: [client-friction, standards-compliance]
      sources:
        - type: vendor
          name: 'OAS 3.0 §4.7.25 (Discriminator)'
          verbatim: 'discriminator hint to alternative schemas'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: Redocly + multi-codegen
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, codegen-tool, ai-agent]
      lifecycle-phase: build-time
      defect-class: incomplete
      iso25010: [usability, compatibility]
      codegen-targets: [typescript, java, csharp, kotlin, go]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-20 — 204 response declared with content body (RFC violation).
  # Per RFC 9110 §15.3.5, 204 No Content "MUST NOT include content".
  # Targets: * (renderer + codegen).
  # =========================================================================

  # Source: RFC 9110 §15.3.5 verbatim "MUST NOT include content" + OAI #3536;
  #         rules-brainstorm.md CL-20 (P1)
  # Lens: 4 (Client-Friction), 2 (Standards-Compliance)
  # Round: 2
  apiq-cl20-204-must-not-have-content:
    description: >-
      [CL-20] HTTP 204 No Content responses MUST NOT carry a body
      (RFC 9110 §15.3.5). Declaring `content` on a 204 confuses codegen
      tools (some emit body-deserialisation; some omit; some crash) and
      contradicts the wire-protocol. Remove `content` or change the
      status code to a body-bearing one. Targets: *.
    message: "Response 204 declares `content`; RFC 9110 §15.3.5 forbids a body on 204."
    severity: warn
    given: "$.paths[*][*].responses.204"
    then:
      field: content
      function: undefined
    apiq-meta:
      pattern-id: CL-20
      lenses: [client-friction, standards-compliance]
      sources:
        - type: rfc
          number: 9110
          section: '15.3.5'
          verbatim: 'A 204 response is terminated by the end of the header section; it cannot contain content'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: OAI #3536
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: norm
      iso25010: [compatibility, reliability]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: true
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-26 — pattern without ^ / $ anchors.
  # Default ECMA-262 regex behaviour is partial-match, so an unanchored
  # pattern silently passes inputs that contain a match anywhere. Leads to
  # both client-friction (codegen warnings) and security gaps.
  # Targets: *.
  # =========================================================================

  # Source: MIN-2 IBM ibm-anchored-patterns + Speakeasy + ECMA-262 partial-match
  #         semantics; rules-brainstorm.md CL-26 (P1) + EV-24 (P1, tighten)
  # Lens: 4 (Client-Friction), 1 (Threat-Modeling)
  # Round: 2
  apiq-cl26-pattern-needs-anchors:
    description: >-
      [CL-26] `pattern` strings should start with `^` and end with `$` to
      assert full-string match. Without anchors, ECMA-262 partial-match
      semantics silently pass inputs with a match anywhere — both a
      validation gap (security) and a codegen-warning trigger.
      Targets: *.
    message: "Pattern `{{value}}` is unanchored; many engines partial-match unless `^...$` is present."
    severity: warn
    given: "$..pattern"
    then:
      function: pattern
      functionOptions:
        match: "^\\^.*\\$$"
    apiq-meta:
      pattern-id: CL-26
      lenses: [client-friction, threat-modeling]
      sources:
        - type: vendor
          name: IBM ibm-anchored-patterns (MIN-2)
          url: 'https://github.com/IBM/openapi-validator'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: Speakeasy + ECMA-262 partial-match semantics
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, security, spec-author]
      lifecycle-phase: build-time
      defect-class: incomplete
      iso25010: [security, usability]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: low

  # =========================================================================
  # CL-31 — Bare-array request body.
  # Targets: * (codegen). Languages with method-overloads expecting named
  # keys cannot represent a top-level-array body well.
  # =========================================================================

  # Source: openapi-generator #17877 + multi-codegen;
  #         rules-brainstorm.md CL-31 (P1, extends EV-4)
  # Lens: 4 (Client-Friction), 3 (Evolution-Friction)
  # Round: 2
  apiq-cl31-no-bare-array-request-body:
    description: >-
      [CL-31] Request bodies typed as bare arrays produce awkward SDK
      method signatures across all targets. Wrap the array in a named
      object property (e.g. `{ items: [...] }`) so SDK-codegen can name
      the parameter and so the wire-shape can grow envelope fields
      without breaking. Targets: *.
    message: "Request body schema is a bare array; wrap in an envelope object."
    severity: warn
    given: "$.paths[*][post,put,patch].requestBody.content[*].schema"
    then:
      field: type
      function: pattern
      functionOptions:
        notMatch: "^array$"
    apiq-meta:
      pattern-id: CL-31
      lenses: [client-friction, evolution-friction]
      sources:
        - type: vendor
          name: openapi-generator #17877
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability, compatibility]
      codegen-targets: [java, csharp, kotlin, go]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-33 — schema without type.
  # Targets: * (codegen falls back to Object/Any/Map).
  # =========================================================================

  # Source: MIN-11 Vacuum + openapi-generator;
  #         rules-brainstorm.md CL-33 (P1)
  # Lens: 4 (Client-Friction)
  # Round: 2
  apiq-cl33-schema-needs-type:
    description: >-
      [CL-33] Inline schemas with `properties` should declare `type:
      object` explicitly. Without `type`, codegen tools differ in
      interpretation (Object, Any, Map<String, Object>) — the safe-bet
      is to spell it out. Targets: *.
    message: "Schema declares `properties` but omits `type: object`; codegen behaviour is undefined."
    severity: warn
    given: "$..[?(@.properties && !@.type && !@.allOf && !@.oneOf && !@.anyOf && !@.$ref)]"
    then:
      field: type
      function: defined
    apiq-meta:
      pattern-id: CL-33
      lenses: [client-friction]
      sources:
        - type: vendor
          name: 'Vacuum (MIN-11)'
          url: 'https://quobix.com/vacuum/'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: openapi-generator
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: incomplete
      iso25010: [usability, compatibility]
      codegen-targets: [java, csharp, kotlin, go]
      detection-precision: high
      auto-fix-safe: true
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # CL-36 — example with value AND externalValue.
  # OAS 3.0 §4.7.18 requires xor. Already covered by spectral:oas
  # `oas3-examples-value-or-externalValue`; re-tagged here with CL-36
  # pattern-id and severity-upgrade to error.
  # =========================================================================

  # Source: OAS 3.0 §4.7.18 (xor) + MIN-48 Redocly;
  #         rules-brainstorm.md CL-36 (P1, syntax-error)
  # Lens: 4 (Client-Friction), 2 (Standards-Compliance)
  # Round: 2
  apiq-cl36-example-value-xor-externalvalue:
    description: >-
      [CL-36] An example object MUST declare either `value` or
      `externalValue`, not both — they are mutually exclusive per OAS
      3.0 §4.7.18. Renderers and codegen disagree on which to honour.
      Targets: *.
    message: "Example object has both `value` and `externalValue`; OAS 3 requires one OR the other."
    severity: error
    given: "$..[?(@.value !== undefined && @.externalValue !== undefined)]"
    then:
      field: value
      function: undefined
    apiq-meta:
      pattern-id: CL-36
      lenses: [client-friction, standards-compliance]
      sources:
        - type: vendor
          name: 'OAS 3.0 §4.7.18 (Example Object)'
          verbatim: 'value field and externalValue field are mutually exclusive'
          url: 'https://spec.openapis.org/oas/v3.0.3#example-object'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'Redocly (MIN-48)'
          url: 'https://redocly.com/docs/cli/rules/'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, codegen-tool, docs-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: syntax
      iso25010: [compatibility, usability]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # CL-37 — Component naming uses spaces or special chars.
  # Targets: * (codegen produces invalid identifier).
  # =========================================================================

  # Source: MIN-47 IBM + MIN-49 Redocly;
  #         rules-brainstorm.md CL-37 (P1)
  # Lens: 4 (Client-Friction)
  # Round: 2
  apiq-cl37-component-name-identifier-safe:
    description: >-
      [CL-37] Component-keys (`components.schemas`, `components.responses`,
      `components.parameters`, etc.) must match `^[A-Za-z_][A-Za-z0-9_-]*$`.
      Spaces, dots, slashes, and other special chars produce invalid
      identifiers in every target language. Targets: *.
    message: "Component key `{{property}}` is not identifier-safe; renames will surprise consumers."
    severity: warn
    given:
      - "$.components.schemas.*~"
      - "$.components.responses.*~"
      - "$.components.parameters.*~"
      - "$.components.requestBodies.*~"
      - "$.components.headers.*~"
      - "$.components.examples.*~"
      - "$.components.links.*~"
      - "$.components.callbacks.*~"
    then:
      function: pattern
      functionOptions:
        match: "^[A-Za-z_][A-Za-z0-9_-]*$"
    apiq-meta:
      pattern-id: CL-37
      lenses: [client-friction]
      sources:
        - type: vendor
          name: 'IBM (MIN-47)'
          url: 'https://github.com/IBM/openapi-validator'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'Redocly (MIN-49)'
          url: 'https://redocly.com/docs/cli/rules/'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability, compatibility]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin, php, ruby]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # CL-40 — Path with `?` query in path-template.
  # spectral:oas has `path-not-include-query` already; tagged here for the
  # CL-40 pattern-id.
  # =========================================================================

  # Source: SP-G-SPS-17 + spectral:oas path-not-include-query + RFC 3986 §3.4;
  #         rules-brainstorm.md CL-40 (P1) + RFC2-68 (P1)
  # Lens: 4 (Client-Friction), 2 (Standards-Compliance)
  # Round: 2
  apiq-cl40-path-must-not-have-query:
    description: >-
      [CL-40] Path-template strings MUST NOT contain `?` — query
      parameters are declared via `parameters[in: query]`, not embedded
      in the path key. Validators reject `?` in path keys.
      Targets: *.
    message: "Path key contains `?`; declare query params via parameters[in:query]."
    severity: warn
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        notMatch: "\\?"
    apiq-meta:
      pattern-id: CL-40
      lenses: [client-friction, standards-compliance]
      sources:
        - type: rfc
          number: 3986
          section: '3.4'
          verbatim: 'The query component is indicated by the first question mark'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'spectral:oas path-not-include-query'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, codegen-tool, spec-author]
      lifecycle-phase: build-time
      defect-class: syntax
      iso25010: [compatibility, usability]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # CL-45 — Pagination mixed conventions cross-spec.
  # Cross-spec clustering — pure Spectral cannot detect this. Implemented
  # at hint-severity as a sentinel that documents the rule-id; the real
  # detector is the `pagination-style-inconsistency` walker which already
  # ships and emits the cross-op finding.
  #
  # We still include the rule-name here for catalog-visibility (every P1
  # CL-* has a rule that mentions its pattern-id). The rule fires only
  # when an operation declares a `cursor` parameter AND a sibling
  # operation declares an `offset` parameter — pure-Spectral can't see
  # cross-op state, so this rule fires per-operation and the walker does
  # the cross-op aggregation.
  # =========================================================================

  # Source: Speakeasy + Postman + Lens-4 mining;
  #         rules-brainstorm.md CL-45 (P1, sentinel — full detector in walker)
  # Lens: 4 (Client-Friction)
  # Round: 2
  apiq-cl45-pagination-cursor-and-offset-cooccur:
    description: >-
      [CL-45] Operations that mix cursor-style and offset-style pagination
      parameters in a single operation indicate an in-flight transition
      between conventions. SDKs cannot expose a clean pagination helper
      when both forms appear. The cross-op variant (different ops use
      different conventions) is detected by the
      `pagination-style-inconsistency` walker. Targets: *.
    message: "Operation declares both cursor- and offset-style pagination params; pick one."
    severity: hint
