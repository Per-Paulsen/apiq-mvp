  # =========================================================================
  # CL-46 — Inconsistent error-shape cross-endpoint.
  # Cross-endpoint walker territory; ships in the
  # `error-shape-coherence` walker (T18b/D2). Sentinel rule below fires
  # when a 4xx response component declares neither $ref nor a
  # documented Problem schema — the cross-op clustering is in the walker.
  # =========================================================================

  # Source: Speakeasy + Lens-4 mining + RFC 7807/9457;
  #         rules-brainstorm.md CL-46 (P1, sentinel — walker does cross-op)
  # Lens: 4 (Client-Friction), 2 (Standards-Compliance)
  # Round: 2
  apiq-cl46-error-response-needs-shape:
    description: >-
      [CL-46] 4xx response objects should reference a shared error
      schema (or use Problem+JSON) — declaring inline different shapes
      per operation produces inconsistent SDK error-handling. The
      cross-op aggregation is performed by the error-shape-coherence
      walker. Targets: *.
    message: "4xx response declares an inline content schema instead of $ref to a shared error schema."
    severity: hint
    given:
      - "$.paths[*][*].responses.400.content[*]"
      - "$.paths[*][*].responses.401.content[*]"
      - "$.paths[*][*].responses.403.content[*]"
      - "$.paths[*][*].responses.404.content[*]"
      - "$.paths[*][*].responses.409.content[*]"
      - "$.paths[*][*].responses.422.content[*]"
    then:
      field: schema
      function: schema
      functionOptions:
        schema:
          type: object
          required: ["$ref"]
          properties:
            $ref:
              type: string
    apiq-meta:
      pattern-id: CL-46
      lenses: [client-friction, standards-compliance, ai-agent-consumability]
      sources:
        - type: rfc
          number: 9457
          verbatim: 'Problem Details for HTTP APIs (supersedes RFC 7807)'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: Speakeasy (cross-endpoint error-coherence)
          url: 'https://www.speakeasy.com/openapi'
          verifiedAt: '2026-05-08'
        - type: mining
          phase: round2
          subagent: t18a-client
      stakeholders: [client-dev, codegen-tool, ai-agent]
      lifecycle-phase: build-time
      defect-class: ergonomic
      iso25010: [usability, maintainability]
      codegen-targets: ['*']
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: high

  # =========================================================================
  # CL-50 — Path file-extension (`/users.json`). Targets: * (router-fail).
  # =========================================================================

  # Source: SG-5 + SP-G-SPS-13;
  #         rules-brainstorm.md CL-50 (P1) + EV-27 (P1)
  # Lens: 4 (Client-Friction), 2 (Standards-Compliance), 3 (Evolution-Friction)
  # Round: 2
  apiq-cl50-path-no-file-extension:
    description: >-
      [CL-50] Path segments MUST NOT end in a file-extension
      (`.json`, `.xml`, `.html`). Codegen tools strip silently or
      crash; routing breaks. Use the `Accept` header for content
      negotiation instead. Targets: *.
    message: "Path key contains a file-extension segment; use Accept-header content negotiation."
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        notMatch: "\\.(json|xml|html|yaml|yml|csv|txt|pdf)(/|$)"
    apiq-meta:
      pattern-id: CL-50
