  apiq-cl81-no-ref-siblings:
    description: >-
      [CL-81] Per OAS 3.0 §3.0 (Reference Object), `$ref` MUST be the
      only key in its object — sibling keys are silently dropped by
      conformant parsers. OAS 3.1 relaxes this for some keywords;
      this rule fires for OAS 3.0 only. Strengthens
      `apiq-no-ref-siblings` (which covers description/allOf) by adding
      summary, title, externalDocs, deprecated. Targets: *.
    message: "`$ref` co-occurs with sibling keys; OAS 3.0 silently drops them."
    severity: error
    resolved: false
    formats:
      - oas3_0
    given: "$..[?(@.$ref && (@.summary!==undefined || @.title!==undefined || @.externalDocs!==undefined || @.deprecated!==undefined))]"
    then:
      - field: summary
        function: undefined
      - field: title
        function: undefined
      - field: externalDocs
        function: undefined
      - field: deprecated
        function: undefined
