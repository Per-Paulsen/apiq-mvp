  apiq-cl66-discriminator-mapping-shape:
    description: >-
      [CL-66] `discriminator.mapping` values MUST be strings that look
      like `$ref`-pointers (`#/components/schemas/...`). Missing-schema
      detection is performed by the cross-reference-consistency walker.
      Targets: *.
    message: "Discriminator mapping value `{{value}}` is not a `#/components/schemas/...` reference."
    severity: error
    given: "$..discriminator.mapping[*]"
    then:
      function: pattern
      functionOptions:
        match: "^#/components/(schemas|responses|requestBodies)/[A-Za-z0-9_-]+$"
    apiq-meta:
      pattern-id: CL-66
      lenses: [client-friction, internal-consistency]
      sources:
