  # =========================================================================
  # CL-58 — Duplicate paths case-insensitive.
  # Cross-spec aggregation — walker territory. Sentinel rule below fires
  # if a path contains uppercase-segments inside a {param} (a stronger
  # signal that the path was authored case-sensitively without intent).
  # The full case-insensitive cross-path duplicate detection lives in
  # the `path-template-parser` module.
  # =========================================================================

  # Source: MIN-7 + MIN-8 Vacuum;
  #         rules-brainstorm.md CL-58 (P1, sentinel)
  # Lens: 4 (Client-Friction)
  # Round: 2
  apiq-cl58-path-no-mixed-case-segments:
    description: >-
      [CL-58] Path-template static segments should be lowercase to avoid
      case-insensitive cross-path duplicates (`/Users/{id}` and
      `/users/{id}` resolve to the same route in many routers). The full
      cross-path detector lives in the path-template-parser walker.
      Targets: *.
    message: "Path key contains uppercase static segments; case-insensitive routers may dedupe."
    severity: warn
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        notMatch: "/[A-Z][A-Za-z0-9]*(/|$)"
    apiq-meta:
      pattern-id: CL-58
      lenses: [client-friction, style-coherence]
      sources:
        - type: vendor
          name: 'Vacuum (MIN-7 + MIN-8)'
          url: 'https://quobix.com/vacuum/'
          verifiedAt: '2026-05-08'
        - type: mining
