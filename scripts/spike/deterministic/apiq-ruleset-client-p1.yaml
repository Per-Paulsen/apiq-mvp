  # =========================================================================
  # CL-66 — Discriminator mapping references missing schemas.
  # We can't fully resolve $refs in pure Spectral, but we can require that
  # every mapping value is a non-empty string starting with `#/components/`
  # and that the mapping object itself is a record-of-strings. The
  # cross-reference (does the schema actually exist?) is delegated to the
  # `cross-reference-consistency` walker.
  # =========================================================================

  # Source: OAS 3.0 §4.7.25 (discriminator.mapping) + apiq A4/A5 +
  #         swagger-ui #9832; rules-brainstorm.md CL-66 (P1)
