  # Source: API Docs Smells arXiv (Aghajani 2019); patterns.json F-19
  # Lens: 4 (Client-Friction), 10 (Operational-Metadata)
  # Round: 2 (R2)
  apiq-f-19-lazy-description:
    description: >-
      [F-19] Doc-smell: Lazy description — when `description` is a verbatim copy of the field/operation name (e.g. property `firstName` with description `firstName` or `First name`). Provide substantive descriptions with purpose, units, constraints — agents and humans need more than the name repeated.
    message: "{{error}}"
    severity: hint
    given: "$..properties.*"
    then:
      function: lazy-description
    apiq-meta:
      pattern-id: F-19
      lenses: [ client-friction, operational-metadata ]
      sources:
        - type: vendor
          name: 'API Docs Smells (Aghajani et al., arXiv 2019)'
          url: 'https://arxiv.org/abs/1907.07725'
          summary: 'Lazy description: description is just a copy of the name'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev, docs-tool ]
      lifecycle-phase: documentation-time
      defect-class: ergonomic
