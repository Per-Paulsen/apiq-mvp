    severity: warn
    given: "$..[?(@.properties && @.properties.attributes && @.properties.relationships)]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            properties:
              type: object
              required: [ type, id ]
    apiq-meta:
      pattern-id: SCF-2
      lenses: [ style-coherence, standards-compliance ]
      sources:
        - type: vendor
          name: 'JSON:API v1.1 §Resource Objects'
          url: 'https://jsonapi.org/format/#document-resource-objects'
          summary: 'A resource object MUST contain at least the following top-level members: id, type'
