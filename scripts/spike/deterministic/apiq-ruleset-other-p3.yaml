  # Source: RFC 7519 + FAPI; patterns.json F-20
  # Lens: 1 (Threat-Modeling), 2 (Standards-Compliance)
  # Round: 2 (R2) — re-tag of RFC2-57
  apiq-f-20-bearer-format-jwt-declared:
    description: >-
      [F-20] HTTP Bearer security-schemes should declare `bearerFormat: "JWT"` per RFC 7519 + FAPI when JWTs are used as bearer tokens. Without bearerFormat, agents can't distinguish JWT-bearer (which requires JWT validation) from opaque-bearer.
    message: "HTTP bearer security-scheme lacks 'bearerFormat: JWT' declaration."
    severity: hint
    given: "$.components.securitySchemes[?(@.type=='http' && @.scheme=='bearer')]"
    then:
      field: bearerFormat
      function: defined
    apiq-meta:
      pattern-id: F-20
      lenses: [ threat-modeling, standards-compliance ]
      sources:
        - type: rfc
          number: 7519
          summary: 'JSON Web Token (JWT)'
        - type: vendor
          name: 'OpenID FAPI'
          url: 'https://openid.net/specs/openid-financial-api-part-2.html'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ security, spec-author, client-dev ]
      lifecycle-phase: authoring-time
      defect-class: incomplete
      iso25010: [ security, compatibility ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.AA-01' ]
        asvs: [ 'V51.4.1' ]
