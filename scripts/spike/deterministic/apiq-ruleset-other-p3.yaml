# apiq Spectral Ruleset — P3 Other-Lens (T-Other-Lens, Welle D)
#
# 47 P3 lens-divers patterns covering Style/Convention (SC-Tier),
# Structured-Format conformance (SCF-Tier), Lens-6 (Privacy), Lens-7
# (Operations), Lens-9 (AI-Agent-Consumability), Lens-10 (Operational-
# Metadata), and F-Tier (DOLAR + cross-vendor).
#
# Patterns covered:
#   - SC-Tier (15):  SC-1, SC-2, SC-3, SC-4, SC-7, SC-12, SC-15, SC-16,
#                    SC-17, SC-18, SC-19, SC-21, SC-22, SC-23, SC-25
#   - SCF-Tier (15): SCF-2, SCF-3, SCF-4, SCF-5, SCF-6, SCF-7, SCF-8,
#                    SCF-9, SCF-10, SCF-11, SCF-12, SCF-13, SCF-14,
#                    SCF-15, SCF-17
#   - Lens-6/7/9/10 (11): L6-3, L7-1, L9-2, L9-3, L9-4, L9-5, L9-6, L9-8,
#                         L10-4, L10-5, L10-6
#   - F-Tier (6):    F-2, F-3, F-5, F-15, F-19, F-20
#                    (F-12, F-13 already implemented in apiq-ruleset-client-p2.yaml,
#                     F-11, F-14 already covered there too)
#
# Total: 47 rules. Default severity = `hint` per Plan-Doc §7 P3-discipline.
#
# Authored 2026-05-09 (T-Other-Lens / Welle D, owner: other-p3-builder) from:
#   - specs/big-spec-architecture-spike-stage-a-implementation-priority.md
#     (P3 Other-Lens table, lines 366-405)
#   - specs/big-spec-architecture-spike-stage-a-restwork-plan.md §0
#     (Strategic Vision Constants — agent-readiness-positioning)
#   - specs/E09-w-d-p3-trail.md T-Other-Lens section
#   - scripts/spike/data/patterns.json (single-source pattern substrate)
#   - rules-brainstorm.md (R1+R2+R3+R4 Mining round consolidations)
#
# Severity discipline (per Severity-Schema Final, T23):
#   - error: RFC-2119 MUST violated; CI-blocking. (Not used in P3.)
#   - warn:  RFC-2119 SHOULD violated, OR strong cross-source consensus.
#   - hint:  Soft signal; informative; opinion-divided. (P3 default.)
#
# Strategic-Vision Coupling (Plan-Doc §0):
#   L9-* and L10-* rules carry `agent-readiness-impact: high` or `medium`
#   (NOT `none` / `low`) per Plan-Doc §0 — these are agent-readiness
#   territory and feed Welle M2 + Welle Z post-V planning.
#
# Custom-functions used (registered in spectral-runner.ts as part of
# Phase 3 Integration):
#   - rest-vs-rpc-mixing (SC-1)
#   - http-method-semantics-violated (SC-3)
#   - crud-asymmetric-resources (SC-15)
#   - field-name-casing-mixed (SC-18)
#   - time-field-naming-mixed (SC-19)
#   - filter-syntax-incoherent (SC-22)
#   - sort-syntax-incoherent (SC-23)
#   - status-code-distribution-per-op-type (SC-25)
#   - odata-dollar-param-allowed-set (SCF-12)
#   - aip-custom-method-uses-post (SCF-13)
#   - aip-time-field-imperative (SCF-17)
#   - phi-field-name-hint (L6-3)
#   - list-endpoint-missing-cache-headers (L7-1)
#   - description-parameter-ratio (L9-2)
#   - error-schema-discoverability (L9-3)
#   - pagination-cursor-stability (L9-4)
#   - operation-id-machine-friendly (L9-5)
#   - summary-concise (L9-6)
#   - function-call-friendly-schema (L9-8)
#   - external-docs-stub (L10-4)
#   - info-contact-substantive (L10-5)
#   - accept-language-on-user-facing-ops (F-2)
#   - consistent-expand-fields-param (F-5)
#   - polymorphism-wire-discriminator (F-15)
#   - lazy-description (F-19)

extends:
  - spectral:oas

formats:
  - oas3
  - oas3_0
  - oas3_1

rules:
  # ===========================================================================
  # SC-Tier — Style/Convention (Lens 5, primary)
  # ===========================================================================

  # Source: Microsoft REST API Guidelines + Google AIP-121 + Richardson
  #         Maturity Model; patterns.json SC-1
  # Lens: 5 (Style-Coherence), 4 (Client-Friction)
  # Round: 2 (R2)
  apiq-sc-1-rest-vs-rpc-mixing:
    description: >-
      [SC-1] Spec mixes REST-style and RPC-style paths (>10% each style). Pure REST or pure RPC is fine; mixing produces inconsistent SDK method names and confuses both human and agent consumers. Pick one style and apply consistently.
    message: "{{error}}"
    severity: hint
    given: "$"
    then:
      function: rest-vs-rpc-mixing
    apiq-meta:
      pattern-id: SC-1
      lenses: [ style-coherence, client-friction ]
      sources:
        - type: vendor
          name: 'Microsoft REST API Guidelines'
          url: 'https://github.com/microsoft/api-guidelines'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Google AIP-121 (Resource oriented design)'
          url: 'https://google.aip.dev/121'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Richardson Maturity Model'
          url: 'https://martinfowler.com/articles/richardsonMaturityModel.html'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev, ai-agent ]
      lifecycle-phase: authoring-time
      defect-class: ergonomic
      iso25010: [ usability, maintainability ]
      codegen-targets:
        - java
        - go
        - python
        - typescript
        - rust
        - csharp
        - kotlin
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: medium

  # Source: Google AIP-136 (custom methods) + Microsoft REST guidelines;
  #         patterns.json SC-2
  # Lens: 5 (Style-Coherence)
  # Round: 2 (R2)
  apiq-sc-2-custom-method-colon-verb:
    description: >-
      [SC-2] Custom-method paths (AIP-136 colon-verb form like `/users/{id}:cancel`) should use kebab-case OR lowerCamelCase verb consistently across the spec. Mixing `:cancelOrder` and `:cancel-order` produces inconsistent SDKs.
    message: "Custom-method verb in path-key '{{value}}' deviates from kebab-case OR lowerCamelCase convention."
    severity: hint
    given: "$.paths"
    then:
      field: "@key"
      function: pattern
      functionOptions:
        match: "^(/[^:/]*)*(:([a-z][a-zA-Z0-9]*|[a-z]+(-[a-z]+)*))?$"
    apiq-meta:
      pattern-id: SC-2
      lenses: [ style-coherence ]
      sources:
        - type: vendor
          name: 'Google AIP-136 (Custom methods)'
          url: 'https://google.aip.dev/136'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Microsoft REST API Guidelines'
          url: 'https://github.com/microsoft/api-guidelines'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: authoring-time
      defect-class: ergonomic
      iso25010: [ usability ]
      codegen-targets: [ '*' ]
      detection-precision: low
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # Source: Fielding REST dissertation + Microsoft REST guidelines + AIP-131;
  #         patterns.json SC-3
  # Lens: 5 (Style-Coherence), 4 (Client-Friction)
  # Round: 2 (R2)
  apiq-sc-3-http-method-semantics:
    description: >-
      [SC-3] GET operations whose operationId or path contains state-change verbs ("create", "delete", "cancel", "submit", ...) violate HTTP semantics — GET is cacheable + safe per RFC 9110 §9.2.1. Use POST for state-changing actions or remove the verb from naming.
    message: "{{error}}"
    severity: warn
    given: "$.paths[*].get"
    then:
      function: http-method-semantics-violated
    apiq-meta:
      pattern-id: SC-3
      lenses: [ style-coherence, client-friction, standards-compliance ]
      sources:
        - type: rfc
          number: 9110
          section: '9.2.1'
          summary: 'GET is safe ... means that the request is essentially read-only'
        - type: vendor
          name: 'Fielding REST Dissertation §5.1'
          url: 'https://www.ics.uci.edu/~fielding/pubs/dissertation/top.htm'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Google AIP-131 (Standard methods)'
          url: 'https://google.aip.dev/131'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev, ai-agent ]
      lifecycle-phase: authoring-time
      defect-class: semantic
      iso25010: [ reliability, usability ]
      codegen-targets:
        - java
        - go
        - python
        - typescript
        - rust
        - csharp
        - kotlin
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # Source: HAL + JSON:API + Siren + Fielding REST; patterns.json SC-4
  # Lens: 5 (Style-Coherence), 4 (Client-Friction)
  # Round: 2 (R2)
  apiq-sc-4-hypermedia-marker-consistency:
    description: >-
      [SC-4] Responses that opt into hypermedia (HAL `_links`, JSON:API `data`/`relationships`, Siren `class`/`actions`) should use the hypermedia format consistently — not mix HAL with raw arrays in the same spec. Heuristic: detect schemas with `_links` properties — they should appear in ALL successful responses or NONE.
    message: "Schema declares HAL/JSON-API/Siren marker but other responses don't."
    severity: hint
    given: "$..[?(@.properties && @.properties._links)]"
    then:
      field: properties._links
      function: defined
    apiq-meta:
      pattern-id: SC-4
      lenses: [ style-coherence, client-friction ]
      sources:
        - type: vendor
          name: 'HAL spec'
          url: 'https://stateless.group/hal_specification.html'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'JSON:API v1.1'
          url: 'https://jsonapi.org/format/'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Siren spec'
          url: 'https://github.com/kevinswiber/siren'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Fielding REST Dissertation §5.3'
          url: 'https://www.ics.uci.edu/~fielding/pubs/dissertation/top.htm'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev, ai-agent ]
      lifecycle-phase: authoring-time
      defect-class: ergonomic
      iso25010: [ usability, maintainability ]
      codegen-targets:
        - java
        - go
        - python
        - typescript
        - rust
        - csharp
        - kotlin
      detection-precision: low
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: medium

  # Source: Google AIP-122 (Resource names) + Microsoft REST guidelines;
  #         patterns.json SC-7
  # Lens: 5 (Style-Coherence)
  # Round: 2 (R2)
  apiq-sc-7-path-segment-alternation:
    description: >-
      [SC-7] Resource paths should alternate collection / id segments (`/users/{id}/posts/{id}`) per AIP-122 — paths like `/users/{id}/{otherId}/{moreId}` skip collection segments and become ambiguous. Detection: path keys with two consecutive `{var}` segments.
    message: "Path-key '{{value}}' contains consecutive path-template segments without intervening collection name."
    severity: hint
    given: "$.paths"
    then:
      field: "@key"
      function: pattern
      functionOptions:
        notMatch: "/\\{[^}]+\\}/\\{"
    apiq-meta:
      pattern-id: SC-7
      lenses: [ style-coherence ]
      sources:
        - type: vendor
          name: 'Google AIP-122 (Resource names)'
          url: 'https://google.aip.dev/122'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Microsoft REST API Guidelines'
          url: 'https://github.com/microsoft/api-guidelines'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: authoring-time
      defect-class: ergonomic
      iso25010: [ usability ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: medium

  # Source: Siren spec; patterns.json SC-12
  # Lens: 5 (Style-Coherence), 2 (Standards-Compliance)
  # Round: 2 (R2)
  apiq-sc-12-siren-class-array:
    description: >-
      [SC-12] Schemas with `class` property (Siren conformance) should declare it as an array per Siren §`class` MUST. Strings/objects in the `class` field break Siren-aware clients.
    message: "Siren-conforming schema declares 'class' but not as an array."
    severity: hint
    given: "$..[?(@.properties && @.properties.class && @.properties.entities)]"
    then:
      field: properties.class.type
      function: enumeration
      functionOptions:
        values: [ array ]
    apiq-meta:
      pattern-id: SC-12
      lenses: [ style-coherence, standards-compliance ]
      sources:
        - type: vendor
          name: 'Siren spec'
          url: 'https://github.com/kevinswiber/siren'
          summary: 'class is an array of strings'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: authoring-time
      defect-class: norm
      iso25010: [ compatibility ]
      codegen-targets: [ '*' ]
      detection-precision: medium
      auto-fix-safe: true
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # Source: Google AIP-121 + REST conventions; patterns.json SC-15
  # Lens: 5 (Style-Coherence), 4 (Client-Friction)
  # Round: 2 (R2)
  apiq-sc-15-crud-symmetry-per-resource:
    description: >-
      [SC-15] Resources with item-operations (GET/PUT/PATCH/DELETE /resource/{id}) should have a corresponding collection-GET (GET /resource); collections with POST should have a corresponding item-GET. Asymmetric CRUD makes resources hard to discover for both humans and agents.
    message: "{{error}}"
    severity: hint
    given: "$"
    then:
      function: crud-asymmetric-resources
    apiq-meta:
      pattern-id: SC-15
      lenses: [ style-coherence, client-friction ]
      sources:
        - type: vendor
          name: 'Google AIP-121 (Resource oriented design)'
          url: 'https://google.aip.dev/121'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'REST conventions (Richardson)'
          url: 'https://martinfowler.com/articles/richardsonMaturityModel.html'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev, ai-agent ]
      lifecycle-phase: authoring-time
      defect-class: incomplete
      iso25010: [ usability, functional-suitability ]
      codegen-targets:
        - java
        - go
        - python
        - typescript
        - rust
        - csharp
        - kotlin
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: high
      mttr-impact: medium
      agent-readiness-impact: medium

  # Source: Microsoft REST API Guidelines + Google AIP-136; patterns.json SC-16
  # Lens: 5 (Style-Coherence)
  # Round: 2 (R2)
  apiq-sc-16-resource-vs-action-shape:
    description: >-
      [SC-16] Path segments should be either resource-nouns (plural, `/users`, `/orders`) OR explicit action verbs prefixed with colon (AIP-136 `:cancel`). Mixing flat `/cancelOrder` with both resource paths and colon-actions in the same spec breaks consumer expectations.
    message: "Path-key '{{value}}' uses verb-prefix camelCase form (e.g. /getThing) — prefer resource-noun OR colon-action."
    severity: hint
    given: "$.paths"
    then:
      field: "@key"
      function: pattern
      functionOptions:
        notMatch: "^/(get|create|delete|update|fetch|cancel|submit)[A-Z]"
    apiq-meta:
      pattern-id: SC-16
      lenses: [ style-coherence ]
      sources:
        - type: vendor
          name: 'Microsoft REST API Guidelines'
          url: 'https://github.com/microsoft/api-guidelines'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Google AIP-136 (Custom methods)'
          url: 'https://google.aip.dev/136'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: authoring-time
      defect-class: ergonomic
      iso25010: [ usability, maintainability ]
      codegen-targets: [ '*' ]
      detection-precision: low
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: low

  # Source: Richardson Maturity Model + Google AIPs; patterns.json SC-17
  # Lens: 5 (Style-Coherence), 4 (Client-Friction)
  # Round: 2 (R2)
  apiq-sc-17-http-method-coverage:
    description: >-
      [SC-17] Operations should declare `operationId` so HTTP-method-per-op distribution can be analyzed across SDK output. Heuristic: ALL operations must have operationId — if missing, agents and codegen cannot reliably address the op.
    message: "Operation lacks operationId; HTTP-method semantics indistinguishable for agents."
    severity: hint
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace]"
    then:
      field: operationId
      function: defined
    apiq-meta:
      pattern-id: SC-17
      lenses: [ style-coherence, client-friction, ai-agent-consumability ]
      sources:
        - type: vendor
          name: 'Richardson Maturity Model'
          url: 'https://martinfowler.com/articles/richardsonMaturityModel.html'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Google AIP-131 (Standard methods)'
          url: 'https://google.aip.dev/131'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev, ai-agent, codegen-tool ]
      lifecycle-phase: authoring-time
      defect-class: incomplete
      iso25010: [ usability ]
      codegen-targets:
        - java
        - go
        - python
        - typescript
        - rust
        - csharp
        - kotlin
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: high

  # Source: JSON:API v1.1 + Google AIP-140 (Field names); patterns.json SC-18
  # Lens: 5 (Style-Coherence), 4 (Client-Friction)
  # Round: 2 (R2)
  apiq-sc-18-field-name-casing:
    description: >-
      [SC-18] Field names in object schemas should follow consistent casing (camelCase OR snake_case). Mixed `firstName` and `last_name` in the same spec produces inconsistent SDK output. JSON:API §Member-names requires snake-case; AIP-140 requires snake_case; OData/Microsoft prefer camelCase. Pick one.
    message: "{{error}}"
    severity: hint
    given: "$"
    then:
      function: field-name-casing-mixed
    apiq-meta:
      pattern-id: SC-18
      lenses: [ style-coherence, client-friction ]
      sources:
        - type: vendor
          name: 'JSON:API v1.1 §Member-names'
          url: 'https://jsonapi.org/format/#document-member-names'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Google AIP-140 (Field names)'
          url: 'https://google.aip.dev/140'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev, codegen-tool ]
      lifecycle-phase: authoring-time
      defect-class: ergonomic
      iso25010: [ usability, compatibility ]
      codegen-targets:
        - java
        - go
        - python
        - typescript
        - rust
        - csharp
        - kotlin
      detection-precision: low
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: medium

  # Source: Google AIP-142 + Stripe/Rails + Microsoft REST; patterns.json SC-19
  # Lens: 5 (Style-Coherence), 4 (Client-Friction)
  # Round: 2 (R2)
  apiq-sc-19-time-field-naming:
    description: >-
      [SC-19] Spec mixes time-field naming styles (`*_time` AIP-142 vs `*_at` Stripe/Rails). Pick one convention and apply consistently — `created_time` AND `updated_at` in the same spec produces inconsistent SDK output and confuses agents.
    message: "{{error}}"
    severity: hint
    given: "$"
    then:
      function: time-field-naming-mixed
    apiq-meta:
      pattern-id: SC-19
      lenses: [ style-coherence, client-friction ]
      sources:
        - type: vendor
          name: 'Google AIP-142 (Time fields)'
          url: 'https://google.aip.dev/142'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Stripe API Reference'
          url: 'https://stripe.com/docs/api'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Microsoft REST API Guidelines'
          url: 'https://github.com/microsoft/api-guidelines'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: authoring-time
      defect-class: ergonomic
      iso25010: [ usability, maintainability ]
      codegen-targets:
        - java
        - go
        - python
        - typescript
        - rust
        - csharp
        - kotlin
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: low
      agent-readiness-impact: medium

  # Source: All hypermedia specs (HAL/JSON:API/Siren); patterns.json SC-21
  # Lens: 5 (Style-Coherence)
  # Round: 2 (R2)
  apiq-sc-21-reserved-field-leakage:
    description: >-
      [SC-21] Field names should not collide with reserved hypermedia/format keywords from non-target styles. E.g. plain-JSON spec using `_links` (HAL-reserved) or `data` at top level (JSON:API-reserved) confuses tooling that auto-detects the format from these markers.
    message: "Field name '{{property}}' is reserved by a non-target hypermedia/format spec."
    severity: hint
    given: "$..properties"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          not:
            anyOf:
              - required: [ _links ]
              - required: [ _embedded ]
              - required: [ jsonapi ]
    apiq-meta:
      pattern-id: SC-21
      lenses: [ style-coherence ]
      sources:
        - type: vendor
          name: 'HAL spec'
          url: 'https://stateless.group/hal_specification.html'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'JSON:API v1.1'
          url: 'https://jsonapi.org/format/'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Siren spec'
          url: 'https://github.com/kevinswiber/siren'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: authoring-time
      defect-class: ergonomic
      iso25010: [ compatibility ]
      codegen-targets: [ '*' ]
      detection-precision: low
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # Source: Google AIP-160 + JSON:API + OData; patterns.json SC-22
  # Lens: 5 (Style-Coherence), 4 (Client-Friction)
  # Round: 2 (R2)
  apiq-sc-22-filter-syntax-coherence:
    description: >-
      [SC-22] Spec mixes filter-syntax styles (AIP-160 `filter`, JSON:API `filter[field]`, OData `$filter`). Pick one convention. Mixed filtering across endpoints produces inconsistent SDK output and confuses agents that must learn each variant.
    message: "{{error}}"
    severity: hint
    given: "$"
