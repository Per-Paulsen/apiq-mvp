          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'JSON:API v1.1 §Polymorphism'
          url: 'https://jsonapi.org/format/'
          verifiedAt: '2026-05-09'
        - type: vendor
          name: 'Schema.org `@type`'
          url: 'https://schema.org/docs/datamodel.html'
          verifiedAt: '2026-05-09'
        - type: mining
          phase: round2
          subagent: other-p3-builder
