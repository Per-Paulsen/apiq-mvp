    message: "{{error}}"
    severity: hint
    given: "$.components.schemas[*]"
    then:
      function: polymorphism-wire-discriminator
    apiq-meta:
      pattern-id: F-15
      lenses: [ style-coherence, operational-metadata ]
      sources:
