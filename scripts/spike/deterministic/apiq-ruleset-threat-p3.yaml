# apiq Spectral Ruleset — P3 Threat-Modeling Rules (T16c, Welle D)
#
# 31 P3 (Defense-in-Depth + Nice-to-Have) Threat-Modeling rules per
# implementation-priority.md §"P3 — Defense-in-Depth + Nice-to-Have" — patterns
# that complement P1 (parity) + P2 (USP/differentiator) coverage.
#
# Authored 2026-05-09 (T16c / Welle D) from:
#   - specs/big-spec-architecture-spike-stage-a-implementation-priority.md (P3 list)
#   - specs/big-spec-architecture-spike-stage-a-restwork-plan.md §7 (Welle D)
#   - scripts/spike/data/patterns.json (single-source pattern substrate)
#   - rules-brainstorm.md (R1+R2+R3+R4 mining round consolidations)
#
# Severity discipline (per Severity-Schema Final, T23):
#   - error: RFC-2119 MUST violated; CI-blocking. (Y-18, Y-20)
#   - warn:  RFC-2119 SHOULD violated, OR strong cross-source consensus. (Y-6,
#           Y-9, Y-11, TM-A30, TM-A31, TM-A33, TM-A43, TM-A48, TM-A51)
#   - hint:  Soft signal; defense-in-depth; informative. (the rest — most P3.)
#
# Many P3 rules default to `hint` (off-by-default-overridable) — operators may
# raise them to `warn`/`error` per project policy.
#
# apiq-meta block (Welle F schema): every rule carries pattern-id, lenses,
# sources (with verbatim+verifiedAt where applicable), stakeholders,
# lifecycle-phase, defect-class, iso25010 (array), codegen-targets,
# detection-precision, auto-fix-safe, regulatory-mapping (NIST+ASVS+CIS for
# Lens-1), cost-impact, mttr-impact, agent-readiness-impact.
#
# This file is loaded by spectral-runner.ts in addition to apiq-ruleset.yaml,
# apiq-ruleset-threat-p1.yaml, apiq-ruleset-client-p1.yaml,
# apiq-ruleset-evolution.yaml, apiq-ruleset-threat-p2.yaml, and
# apiq-ruleset-client-p2.yaml.

extends:
  - spectral:oas

formats:
  - oas3
  - oas3_0
  - oas3_1

rules:
  # =========================================================================
  # Y-6 — OAuth2: refreshUrl recommended
  # OWASP F-SP-2 + RFC 6749 §6; severity: warn
  # =========================================================================
  # Source: OWASP F-SP-2 + RFC 6749 §6 (OAuth2 refresh_token);
  #         patterns.json Y-6 (P3, Lens-1, severityHypothesis warn)
  # Lens: 1 (Threat-Modeling)
  # Round: 1
  apiq-tm-y6-oauth2-refresh-url-recommended:
    description: >-
      OAuth2 password / clientCredentials / authorizationCode flows SHOULD declare `refreshUrl` so clients can rotate tokens without re-prompting the user — supports refresh-token rotation per RFC 6749 §6 + OAuth-BCP.
    message: "OAuth2 flow lacks `refreshUrl` — refresh-token rotation undocumented (RFC 6749 §6)."
    severity: warn
    given: "$..flows[?(@property && @property.toString && @property.toString().match(/^(password|clientCredentials|authorizationCode)$/))]"
    then:
      function: defined
      field: refreshUrl
    apiq-meta:
      pattern-id: Y-6
      lenses: [ threat-modeling ]
      sources:
        - { type: rfc, number: 6749, section: '6', summary: 'refreshing an access token' }
        - { type: vendor, name: 'OWASP F-SP-2 OAuth2-flow-completeness' }
      stakeholders: [ security, client-dev, spec-author ]
      lifecycle-phase: deploy-time
      defect-class: incomplete
      iso25010: [ security, usability ]
      codegen-targets: [ '*' ]
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.AA-01', 'PR.AA-05' ]
        asvs: [ 'V51.4.1', 'V51.4.4' ]
        cis: [ 'CIS-6.1' ]
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # Y-9 — Auth-Schemes outdated (negotiate, OAuth1)
  # OWASP F-SP-5 + IANA HTTP-Authentication-Schemes; severity: warn
  # =========================================================================
  # Source: OWASP F-SP-5 + IANA HTTP-Authentication-Schemes registry;
  #         patterns.json Y-9 (P3, Lens-1)
  # Lens: 1 (Threat-Modeling)
  # Round: 1
  apiq-tm-y9-auth-scheme-outdated:
    description: >-
      Security schemes using outdated mechanisms (negotiate, OAuth1, basic over plain HTTP, NTLM) carry known weaknesses — replace with OAuth2/OIDC, http-bearer, or http-basic-over-TLS.
    message: "Security scheme uses outdated auth mechanism — prefer OAuth2/OIDC or http-bearer."
    severity: warn
    given: "$.components.securitySchemes[?(@ && @.type=='http')]"
    then:
      function: pattern
      field: scheme
      functionOptions:
        notMatch: "^(negotiate|ntlm|oauth1|digest|hoba|mutual|vapid|scram-)"
    apiq-meta:
      pattern-id: Y-9
      lenses: [ threat-modeling ]
      sources:
        - { type: vendor, name: 'OWASP F-SP-5 outdated-auth-schemes' }
        - { type: vendor, name: 'IANA HTTP Authentication Schemes registry' }
      stakeholders: [ security, client-dev, spec-author ]
      lifecycle-phase: deploy-time
      defect-class: norm
      iso25010: [ security ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.AA-01', 'PR.AA-02' ]
        asvs: [ 'V2.1.1', 'V51.4.1' ]
        cis: [ 'CIS-6.1' ]
      cost-impact: medium
      mttr-impact: high
      agent-readiness-impact: medium

  # =========================================================================
  # Y-11 — unevaluatedProperties:false (OAS 3.1 mass-assignment)
  # OWASP X-SP-1 + OAS 3.1; severity: warn
  # =========================================================================
  # Source: OWASP X-SP-1 + OAS 3.1 spec (JSON Schema 2020-12);
  #         patterns.json Y-11 (P3, Lens-1, OAS 3.1 only)
  # Lens: 1 (Threat-Modeling)
  # Round: 1
  apiq-tm-y11-unevaluated-properties-false:
    description: >-
      OAS 3.1 component-level object schemas using `allOf`/`oneOf`/`anyOf` composition SHOULD declare `unevaluatedProperties: false` (the 2020-12 mass-assignment hardener that complements `additionalProperties`).
    message: "Composed object schema '{{property}}' lacks `unevaluatedProperties: false` — mass-assignment risk in OAS 3.1."
    severity: warn
    given: "$.components.schemas[?(@ && @.type=='object' && (@.allOf || @.oneOf || @.anyOf))]"
    then:
      function: defined
      field: unevaluatedProperties
    apiq-meta:
      pattern-id: Y-11
      lenses: [ threat-modeling ]
      sources:
        - { type: vendor, name: 'OWASP X-SP-1 unevaluatedProperties-false' }
        - { type: vendor, name: 'JSON Schema 2020-12 §11 unevaluatedProperties' }
      stakeholders: [ security, spec-author, codegen-tool ]
      lifecycle-phase: validation-time
      defect-class: over-specification
      iso25010: [ security, maintainability ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.AA-05', 'PR.DS-01' ]
        asvs: [ 'V4.2.1', 'V13.2.4' ]
        cis: [ 'CIS-6.7' ]
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # Y-16 — Response-objects CORS Access-Control-Allow-Origin
  # OWASP M-SP-12 + OWASP CORS-Misconfig; severity: hint
  # =========================================================================
  # Source: OWASP M-SP-12 + OWASP CORS-Misconfig + Fetch-spec CORS;
  #         patterns.json Y-16 (P3, Lens-1, hint)
  # Lens: 1 (Threat-Modeling)
  # Round: 1
  apiq-tm-y16-response-cors-allow-origin-documented:
    description: >-
      2xx response operations SHOULD document the `Access-Control-Allow-Origin` response header so cross-origin clients know whether the API accepts browser requests — undocumented CORS surface is browser-bypass-risk (OWASP CORS-Misconfig).
    message: "2xx response of public API lacks Access-Control-Allow-Origin documentation — declare allowlist or remove CORS expectation."
    severity: hint
    given: "$.paths[*][get,post,put,patch,delete].responses[?(@property && @property.match && @property.match(/^2\\d\\d$/))]"
    then:
      function: defined
      field: headers
    apiq-meta:
      pattern-id: Y-16
      lenses: [ threat-modeling ]
      sources:
        - { type: vendor, name: 'OWASP M-SP-12 CORS-documentation' }
        - { type: vendor, name: 'OWASP CORS-Misconfig' }
      stakeholders: [ security, client-dev, spec-author ]
      lifecycle-phase: documentation-time
      defect-class: incomplete
      iso25010: [ security, usability, compatibility ]
      codegen-targets: [ '*' ]
      detection-precision: low
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.AA-05', 'PR.DS-02' ]
        asvs: [ 'V14.4.1', 'V14.5.3' ]
        cis: [ 'CIS-9.5' ]
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # Y-18 — Sensitive Header-Names (Password/Token) rejected
  # OWASP T-SP-9 + API8; severity: error
  # Custom function `sensitive-header-name-rejected`.
  # =========================================================================
  # Source: OWASP API8 + T-SP-9 sensitive-header-rejection;
  #         patterns.json Y-18 (P3, Lens-1, severityHypothesis error)
  # Lens: 1 (Threat-Modeling)
  # Round: 1
  apiq-tm-y18-sensitive-header-name-rejected:
    description: >-
      Header parameters named "password" / "token" / "secret" / "api-key" (and similar credential-bearing names) MUST NOT be declared as ad-hoc header parameters — use a defined `securityScheme` (apiKey, http-bearer, oauth2) so credentials are tracked and not leaked into proxy logs.
    message: "{{error}}"
    severity: error
    given: "$.paths[*][*].parameters[?(@ && @.in=='header')]"
    then:
      function: sensitive-header-name-rejected
    apiq-meta:
      pattern-id: Y-18
      lenses: [ threat-modeling ]
      sources:
        - { type: vendor, name: 'OWASP API8:2023 (Security Misconfiguration)' }
        - { type: vendor, name: 'OWASP T-SP-9 sensitive-header-rejection' }
      stakeholders: [ security, end-user, spec-author ]
      lifecycle-phase: validation-time
      defect-class: norm
      iso25010: [ security ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.AA-01', 'PR.DS-02' ]
        asvs: [ 'V2.1.1', 'V14.5.3' ]
        cis: [ 'CIS-3.10', 'CIS-6.1' ]
      cost-impact: medium
      mttr-impact: high
      agent-readiness-impact: medium

  # =========================================================================
  # Y-20 — Path: no port in server-URL (außer localhost)
  # OWASP P-SP-2 + RFC 3986; severity: error
  # =========================================================================
  # Source: OWASP P-SP-2 + RFC 3986 §3.2.3 (port-in-URL); patterns.json Y-20
  #         (P3, Lens-1, severityHypothesis error)
  # Lens: 1 (Threat-Modeling)
  # Round: 1
  apiq-tm-y20-server-url-no-port:
    description: >-
      Production server URLs MUST NOT declare an explicit port (`:8080`, `:3000`, etc.) — ports leak deployment details and bypass routing conventions. Localhost / 127.0.0.1 / dev-host URLs are exempt.
    message: "Server URL '{{value}}' has explicit port — bind production to standard 443 (OWASP P-SP-2)."
    severity: error
    given: "$.servers[*].url"
    then:
      function: pattern
      functionOptions:
        notMatch: "^https?://(?!(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0|.*\\.local(host)?|.*\\.test|.*\\.localhost))[^/:]+:\\d+"
    apiq-meta:
      pattern-id: Y-20
      lenses: [ threat-modeling ]
      sources:
        - { type: vendor, name: 'OWASP P-SP-2 no-port-in-server-URL' }
        - { type: rfc, number: 3986, section: '3.2.3', summary: 'authority component' }
      stakeholders: [ security, operations, spec-author ]
      lifecycle-phase: deploy-time
      defect-class: semantic
      iso25010: [ security, maintainability ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.AA-05', 'ID.AM-02' ]
        asvs: [ 'V14.3.2' ]
        cis: [ 'CIS-4.1' ]
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: low

  # =========================================================================
  # Y-22 — Admin-paths use distinct security-scheme
  # OWASP SP-DM-17 differentSecuritySchemes; severity: hint
  # =========================================================================
  # Source: OWASP SP-DM-17 differentSecuritySchemes;
  #         patterns.json Y-22 (P3, Lens-1, hint — covered by custom-fn TM-A27)
  # Lens: 1 (Threat-Modeling)
  # Round: 1
  apiq-tm-y22-admin-distinct-security:
    description: >-
      Admin / internal paths (matching /admin, /internal, /backoffice) SHOULD declare a distinct `security` requirement at operation-level — sharing the public scheme means privilege-escalation has no scheme-boundary (companion to TM-A27 which checks the inverse cross-cut).
    message: "Admin-style path '{{property}}' lacks distinct operation-level security — privilege-escalation surface (OWASP SP-DM-17)."
    severity: hint
    given: "$.paths[?(@property && @property.match && @property.match(/\\/(admin|internal|backoffice|management)\\b/i))]"
    then:
      function: defined
      field: security
    apiq-meta:
      pattern-id: Y-22
      lenses: [ threat-modeling ]
      sources:
        - { type: vendor, name: 'OWASP SP-DM-17 differentSecuritySchemes' }
      stakeholders: [ security, spec-author ]
      lifecycle-phase: deploy-time
      defect-class: incomplete
      iso25010: [ security ]
      codegen-targets: [ '*' ]
      detection-precision: low
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.AA-01', 'PR.AA-05' ]
        asvs: [ 'V4.1.1', 'V4.2.1' ]
        cis: [ 'CIS-6.7' ]
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # Y-24 — Read-Operations should be security-protected
  # OWASP SP-G-OWASP-11; severity: hint
  # =========================================================================
  # Source: OWASP SP-G-OWASP-11; patterns.json Y-24 (P3, Lens-1, hint —
  #         off-by-default; many APIs intentionally have unauthenticated reads)
  # Lens: 1 (Threat-Modeling)
  # Round: 1
  apiq-tm-y24-read-ops-need-security:
    description: >-
      GET / HEAD operations SHOULD declare `security` — unauthenticated reads expose data inventory to scrapers / scrappers (OWASP SP-G-OWASP-11). Off-by-default-overridable; many specs intentionally have public reads.
    message: "Read operation declares no `security` — confirm public access is intentional (OWASP SP-G-OWASP-11)."
    severity: hint
    given: "$.paths[*][get,head]"
    then:
      function: defined
      field: security
    apiq-meta:
      pattern-id: Y-24
      lenses: [ threat-modeling ]
      sources:
        - { type: vendor, name: 'OWASP SP-G-OWASP-11 read-ops-security' }
      stakeholders: [ security, spec-author ]
      lifecycle-phase: deploy-time
      defect-class: incomplete
      iso25010: [ security ]
      codegen-targets: [ '*' ]
      detection-precision: low
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.AA-01' ]
        asvs: [ 'V4.1.1' ]
        cis: [ 'CIS-6.7' ]
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # Y-25 / RFC2-90 — Idempotency-Key on POST creates
  # draft-ietf-httpapi-idempotency-key; severity: hint
  # Custom function `post-creates-need-idempotency-key`.
  # =========================================================================
  # Source: draft-ietf-httpapi-idempotency-key (IETF httpapi WG, 2024-2025);
  #         patterns.json Y-25 = RFC2-90 (P3, Lens-1+Lens-2, hint)
  # Lens: 1 (Threat-Modeling), 2 (Standards-Compliance)
  # Round: 2
  apiq-tm-y25-post-creates-need-idempotency-key:
    description: >-
      POST operations that create resources (declaring 201/202 responses on a non-{id}-tail collection path) SHOULD accept an `Idempotency-Key` request header — without it, retries silently double-create. Per draft-ietf-httpapi-idempotency-key (Stripe / Square / PayPal consensus).
    message: "{{error}}"
    severity: hint
    given: "$.paths[*][post]"
    then:
      function: post-creates-need-idempotency-key
    apiq-meta:
      pattern-id: [ Y-25, RFC2-90 ]
      lenses: [ threat-modeling, standards-compliance ]
      sources:
        - { type: vendor, name: 'draft-ietf-httpapi-idempotency-key (Stripe / PayPal / Square consensus)', url: 'https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key/' }
        - { type: mining, phase: round2, subagent: 'Y-25/RFC2-90', summary: 'IETF idempotency-key draft adopted by httpapi WG' }
      stakeholders: [ security, client-dev, ai-agent, spec-author ]
      lifecycle-phase: validation-time
      defect-class: incomplete
      iso25010: [ reliability, security ]
      codegen-targets: [ '*' ]
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.PT-01', 'PR.IR-04' ]
        asvs: [ 'V13.2.4' ]
        cis: [ 'CIS-13.1' ]
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: high

  # =========================================================================
  # TM-A3 — 3+ ID-params in one path → BOLA risk
  # OWASP API1; severity: hint
  # Custom function `three-or-more-id-params-bola`.
  # =========================================================================
  # Source: OWASP API1:2023 (BOLA); patterns.json TM-A3 (P3, Lens-1, hint)
  # Lens: 1 (Threat-Modeling)
  # Round: 2
  apiq-tm-a3-three-or-more-id-params-bola:
    description: >-
      Paths with ≥3 `{id}`-style template segments deepen the BOLA attack surface — every additional ID is another authorization boundary the server must enforce (OWASP API1).
    message: "{{error}}"
    severity: hint
    given: "$.paths"
    then:
      function: three-or-more-id-params-bola
      field: "@key"
    apiq-meta:
      pattern-id: TM-A3
      lenses: [ threat-modeling ]
      sources:
        - { type: vendor, name: 'OWASP API1:2023 (Broken Object Level Authorization)' }
        - { type: mining, phase: round2, subagent: 'TM-A3', summary: 'multi-ID-path BOLA-multiplier' }
      stakeholders: [ security, end-user, spec-author ]
      lifecycle-phase: deploy-time
      defect-class: semantic
      iso25010: [ security ]
      codegen-targets: [ '*' ]
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.AA-01', 'PR.AA-05' ]
        asvs: [ 'V4.1.1', 'V4.2.1' ]
        cis: [ 'CIS-6.7' ]
      cost-impact: medium
      mttr-impact: high
      agent-readiness-impact: medium

  # =========================================================================
  # TM-A4 — Body has user_id/account_id on non-admin endpoint
  # OWASP API1; severity: hint
  # Custom function `body-contains-user-id-on-non-admin`.
  # =========================================================================
  # Source: OWASP API1:2023; patterns.json TM-A4 (P3, Lens-1, hint)
  # Lens: 1 (Threat-Modeling)
  # Round: 2
  apiq-tm-a4-body-contains-user-id-on-non-admin:
    description: >-
      Non-admin POST/PUT/PATCH endpoints accepting `user_id` / `account_id` / `tenant_id` etc. in request body invite spoofing — the field overrides session-derived identity. Either rename to a per-resource reference, mark `readOnly: true`, or restrict to admin paths.
    message: "{{error}}"
    severity: hint
    given: "$.paths[*][post,put,patch]"
    then:
      function: body-contains-user-id-on-non-admin
    apiq-meta:
      pattern-id: TM-A4
      lenses: [ threat-modeling ]
      sources:
        - { type: vendor, name: 'OWASP API1:2023 (BOLA / parameter tampering)' }
        - { type: mining, phase: round2, subagent: 'TM-A4', summary: 'identity-bearing-body-field server-side spoofing' }
      stakeholders: [ security, end-user, spec-author ]
      lifecycle-phase: validation-time
      defect-class: semantic
      iso25010: [ security ]
      codegen-targets: [ '*' ]
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.AA-01', 'PR.AA-05' ]
        asvs: [ 'V4.1.1', 'V13.1.4' ]
        cis: [ 'CIS-6.7' ]
      cost-impact: medium
      mttr-impact: high
      agent-readiness-impact: medium

  # =========================================================================
  # TM-A8 — Multiple AND securityRequirements same type
  # OWASP API2; severity: hint
  # Custom function `multiple-and-security-same-type`.
  # =========================================================================
  # Source: OWASP API2:2023; patterns.json TM-A8 (P3, Lens-1, hint)
  # Lens: 1 (Threat-Modeling), 4 (Client-Friction)
  # Round: 2
  apiq-tm-a8-multiple-and-security-same-type:
    description: >-
      A `security` AND-requirement (single object with multiple keys) where all keys resolve to the same scheme-type (e.g. two apiKey schemes) is effectively single-factor — pseudo-MFA hides absence of real second factor (OWASP API2).
    message: "{{error}}"
    severity: hint
    given: "$.paths[*][get,post,put,patch,delete,head,options,trace]"
    then:
      function: multiple-and-security-same-type
    apiq-meta:
      pattern-id: TM-A8
      lenses: [ threat-modeling, client-friction ]
      sources:
        - { type: vendor, name: 'OWASP API2:2023 (Broken Authentication)' }
        - { type: mining, phase: round2, subagent: 'TM-A8', summary: 'AND-security-of-same-type pseudo-MFA' }
      stakeholders: [ security, spec-author ]
      lifecycle-phase: deploy-time
      defect-class: semantic
      iso25010: [ security ]
      codegen-targets:
        - java
        - go
        - python
        - typescript
        - rust
        - csharp
        - kotlin
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'PR.AA-01', 'PR.AA-02' ]
        asvs: [ 'V2.1.1', 'V2.2.1' ]
        cis: [ 'CIS-6.5' ]
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: low

  # =========================================================================
  # TM-A16 — email property SHOULD declare format:email
  # OWASP + OAS; severity: hint
  # =========================================================================
  # Source: OWASP API3 + OAS-3 spec; patterns.json TM-A16 (P3, Lens-1, hint)
  # Lens: 1 (Threat-Modeling)
  # Round: 2
  apiq-tm-a16-email-property-needs-format:
    description: >-
      Schema properties named `email` / `email_address` / `userEmail` etc. typed `string` SHOULD declare `format: email` so codegen tools enforce RFC 5322 validation at the boundary — defends against header-injection via malformed-email payloads.
    message: "Email-named property '{{property}}' lacks `format: email` — declare format for codegen-side validation."
    severity: hint
    given: "$..properties[?(@property && @property.match && @property.match(/^([a-z_]*email|user_?email|emailAddress|email_address|primary_?email|contact_?email)$/i) && @ && @.type=='string')]"
    then:
      - function: defined
        field: format
      - function: pattern
        field: format
        functionOptions:
          match: "^email$"
    apiq-meta:
      pattern-id: TM-A16
      lenses: [ threat-modeling ]
      sources:
        - { type: vendor, name: 'OWASP API3:2023' }
        - { type: vendor, name: 'OAS-3 format-email spec' }
      stakeholders: [ security, codegen-tool, spec-author ]
      lifecycle-phase: validation-time
      defect-class: incomplete
      iso25010: [ security, usability ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: true
      regulatory-mapping:
        nist: [ 'PR.DS-01' ]
        asvs: [ 'V13.1.5', 'V5.1.3' ]
        cis: [ 'CIS-3.13' ]
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # TM-A19 — object schema with >50 properties (DoS / unboundedness)
  # OWASP API4 + 42Crunch; severity: hint
