  # =========================================================================
  # TM-A51 — Webhook accepts */* content-type
  # OWASP API10 + GitHub webhook hardening; severity: warn
  # Custom function `webhook-rejects-wildcard-content-type`.
  # =========================================================================
  # Source: OWASP API10:2023 + GitHub webhook-hardening guide;
  #         patterns.json TM-A51 (P3, Lens-1+Lens-2, severityHypothesis warn)
  # Lens: 1 (Threat-Modeling), 2 (Standards-Compliance)
  # Round: 2
  apiq-tm-a51-webhook-rejects-wildcard-content-type:
    description: >-
      Webhook receivers (paths matching /webhook|/hooks/|/event-receiver) MUST NOT accept `*\/*` / `application/*` / `text/*` content-types — strict media-type pinning blocks Content-Type-confusion bypass attempts (OWASP API10 + GitHub hardening).
