  # =========================================================================
  # RFC2-70 — OAS path-template = RFC 6570 Level-1 only
  # RFC 6570 + OAS; severity: error
  # OAS only supports Level-1 (simple `{var}`); Level-2/3/4 expressions
  # (`{?var}`, `{+var}`, `{var:3}`) are forbidden.
  # =========================================================================
  # Source: RFC 6570 + OAS-3 path-template spec; patterns.json RFC2-70 (P2)
  # Lens: 2 (Standards-Compliance)
  # Round: 2
  apiq-rfc2-70-oas-path-template-level1-only:
    description: >-
      OAS path-templates MUST use RFC 6570 Level-1 syntax only (simple
      `{varname}`). Level-2/3/4 operators (`{?var}`, `{+var}`, `{var:N}`)
      are not legal in OAS.
    message: "Path '{{property}}' uses RFC 6570 Level-2+ syntax; OAS supports Level-1 simple `{var}` only."
    severity: error
    given: "$.paths"
    then:
      function: pattern
      field: "@key"
      functionOptions:
        notMatch: "\\{[?+#./;&=]|\\{[^}]+:[0-9]+\\}|\\{[^}]+\\*\\}"
    apiq-meta:
      pattern-id: RFC2-70
      lenses: [standards-compliance]
      sources:
        - { type: rfc, number: 6570, verbatim: 'URI Template (Level 1-4 expressions)', verifiedAt: '2026-05-08' }
        - { type: vendor, name: 'OAS-3 path-template spec' }
      stakeholders: [spec-author, codegen-tool]
      lifecycle-phase: validation-time
      defect-class: syntax
      iso25010: [reliability, usability]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: false
      regulatory-mapping:
