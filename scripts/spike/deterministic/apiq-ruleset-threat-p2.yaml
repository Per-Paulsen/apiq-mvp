  # =========================================================================
  # RFC2-11 — Header names canonical Title-Case
  # RFC 9110 §5.1; severity: warn
  # =========================================================================
  # Source: RFC 9110 §5.1 (Field-Name conventions); patterns.json RFC2-11
  # Lens: 4 (Client-Friction)
  # Round: 2
  apiq-rfc2-11-header-names-title-case:
    description: >-
      Response-header names SHOULD use canonical Title-Case (e.g. ETag /
      Content-Type / Last-Modified). HTTP field-names are
      case-insensitive but mixed-casing degrades readability and trips
      naive client-parsers.
    message: "Header name '{{property}}' should use Title-Case (e.g. Etag→ETag, last-modified→Last-Modified)."
    severity: warn
    given: "$..responses[*].headers"
    then:
      function: pattern
      field: "@key"
