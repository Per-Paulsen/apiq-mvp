# apiq Spectral Ruleset — P2 Threat-Modeling Rules (T16b, Welle C)
#
# 41 P2 (Differentiator / apiq-USP) Threat-Modeling rules per
# implementation-priority.md §"P2 — Differentiator-Patterns" — patterns
# mature linters DON'T catch and that form apiq's competitive moat.
#
# Authored 2026-05-08 (T16b / Welle C) from:
#   - specs/big-spec-architecture-spike-stage-a-implementation-priority.md (P2 list)
#   - specs/big-spec-architecture-spike-stage-a-restwork-plan.md §6 (Welle C)
#   - scripts/spike/data/patterns.json (single-source pattern substrate)
#   - rules-brainstorm.md (R1+R2 Mining round consolidations)
#
# Severity discipline (per Severity-Schema Final, T23):
#   - error: RFC-2119 MUST violated; CI-blocking.
#   - warn:  RFC-2119 SHOULD violated, OR strong cross-source consensus.
#   - hint:  Soft signal; informative; opinion-divided.
#
# apiq-meta block (Welle F schema): every rule carries pattern-id, lenses,
# sources (with verbatim+verifiedAt), stakeholders, lifecycle-phase,
# defect-class, iso25010 (array), codegen-targets, detection-precision,
# auto-fix-safe, regulatory-mapping (NIST+ASVS+CIS), cost-impact,
# mttr-impact, agent-readiness-impact.
#
# This file is loaded by spectral-runner.ts in addition to apiq-ruleset.yaml,
# apiq-ruleset-threat-p1.yaml, apiq-ruleset-client-p1.yaml,
# apiq-ruleset-evolution.yaml, and apiq-ruleset-client-p2.yaml.

extends:
  - spectral:oas

formats:
  - oas3
  - oas3_0
  - oas3_1

rules:
  # =========================================================================
  # Y-1 / TM-A1 — Numeric-IDs in path-params (Enumeration / BOLA risk)
  # OWASP API1 + SPS sps-no-numeric-ids; severity: warn
  # Heuristic: path params with `schema.type: integer` (or numeric-pattern
  # name like /id/numeric/) without `format: uuid` and without explicit
  # randomness-evidence are enumeration-prone.
  # =========================================================================
  # Source: OWASP API1:2023 + SP-AYWH no-numeric-ids + SPS sps-no-numeric-ids
  #         + MIN-36 cluster; patterns.json Y-1 + rules-brainstorm.md
  # Lens: 1 (Threat-Modeling), 4 (Client-Friction)
  # Round: 1 (P2-promoted by USP-uniqueness)
  apiq-tm-y1-numeric-id-path-params:
    description: >-
      Path parameters typed as integer (or named like `*_id`/`id`/`num`)
      without `format: uuid` enable BOLA-via-enumeration attacks (OWASP
      API1). Mature linters (Vacuum / Redocly / Spectral-OWASP) don't
      catch this; apiq-USP differentiator.
    message: "Path parameter '{{property}}' uses integer type — enumeration-risk per OWASP API1; prefer UUIDv4."
    severity: warn
    given: "$.paths[*][*].parameters[?(@ && @.in=='path' && @.schema && @.schema.type=='integer')].schema"
    then:
      - function: defined
        field: format
      - function: pattern
        field: format
        functionOptions:
          match: "^(uuid|uri|opaque)$"
    apiq-meta:
      pattern-id: Y-1
      lenses: [threat-modeling, client-friction]
      sources:
        - { type: vendor, name: 'OWASP API1:2023 (Broken Object Level Authorization)' }
        - { type: vendor, name: 'SP-AYWH no-numeric-ids' }
        - { type: vendor, name: 'SPS sps-no-numeric-ids' }
        - { type: mining, phase: round1, subagent: 'Y-1', verbatim: 'mature-linters miss enumeration-via-int-id; apiq-USP', verifiedAt: '2026-05-08' }
      stakeholders: [security, end-user, spec-author]
      lifecycle-phase: deploy-time
      defect-class: semantic
      iso25010: [security]
      codegen-targets: ['*']
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        nist: ['PR.AA-05', 'PR.DS-01']
        asvs: ['V4.1.1', 'V4.2.1']
        cis: ['CIS-6.7']
      cost-impact: high
      mttr-impact: high
      agent-readiness-impact: medium

  # =========================================================================
  # Y-8 / RFC2-58 — Bearer JWT description SHOULD mention RFC 8725
  # OWASP JWT cheat + RFC 8725 (BCP); severity: warn
  # =========================================================================
  # Source: OWASP JWT cheatsheet + RFC 8725 §3.1/§3.2; patterns.json
  #         Y-8 + RFC2-58 (P2, Lens-1+Lens-2)
  # Lens: 1 (Threat-Modeling), 2 (Standards-Compliance)
  # Round: 1
  apiq-tm-y8-jwt-bearer-rfc-8725-mention:
    description: >-
      Security schemes with `bearerFormat: JWT` SHOULD reference RFC 8725
      (JWT BCP) in their description so consumers know the issuer's
      JWT-validation rules. Catches "naive JWT" specs that don't acknowledge
      the alg/iss/exp pitfalls codified in RFC 8725.
    message: "JWT bearer scheme description should reference RFC 8725 (JWT BCP)."
    severity: warn
    given: "$.components.securitySchemes[?(@ && @.type=='http' && @.scheme=='bearer' && @.bearerFormat=='JWT')]"
    then:
      function: pattern
      field: description
      functionOptions:
        match: "(RFC\\s*8725|BCP\\s*[-]?\\s*225|JWT\\s*BCP|JWT\\s*Best\\s*Current\\s*Practices)"
    apiq-meta:
      pattern-id: Y-8
      lenses: [threat-modeling, standards-compliance]
      sources:
        - { type: rfc, number: 8725, section: '3.1', verbatim: 'JWTs that are sent as bearer tokens MUST be signed and integrity-protected', verifiedAt: '2026-05-08' }
        - { type: vendor, name: 'OWASP JWT Cheatsheet' }
        - { type: mining, phase: round1, subagent: 'Y-8', verbatim: 'apiq-USP — RFC-8725 BCP-mention heuristic', verifiedAt: '2026-05-08' }
      stakeholders: [security, end-user, spec-author]
      lifecycle-phase: documentation-time
      defect-class: incomplete
      iso25010: [security, usability]
      codegen-targets: ['*']
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        nist: ['PR.AA-01', 'PR.AA-02']
        asvs: ['V51.4.1', 'V51.4.2']
        cis: ['CIS-6.1']
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # Y-10 / TM-A17 — additionalProperties:false (per-schema mass-assignment hard.)
  # OWASP API3 + Team-D no-additionalProperties; severity: warn
  # Component schemas of type:object MUST declare `additionalProperties: false`
  # OR an explicit object-shape (closed-world hardening). Sharper than the
  # P1 TM-A17 which only checks request-bodies; this rule covers ALL schemas.
  # =========================================================================
  # Source: OWASP API3:2023 + Team-D no-additionalProperties +
  #         constrained-additionalProperties + MIN-16/17;
  #         patterns.json Y-10 + rules-brainstorm.md (P2)
  # Lens: 1 (Threat-Modeling), 3 (Evolution-Friction)
  # Round: 1
  apiq-tm-y10-component-schema-additional-properties-false:
    description: >-
      Component-level object schemas SHOULD declare `additionalProperties:
      false` (or a typed schema for additionalProperties) — mass-assignment
      hardening per OWASP API3. apiq-USP catch — broader than spectral-OWASP
      which only checks request-bodies.
    message: "Component schema '{{property}}' lacks `additionalProperties: false` — mass-assignment risk."
    severity: warn
    given: "$.components.schemas[?(@ && @.type=='object' && @.properties)]"
    then:
      function: defined
      field: additionalProperties
    apiq-meta:
      pattern-id: Y-10
      lenses: [threat-modeling, evolution-friction]
      sources:
        - { type: vendor, name: 'OWASP API3:2023 (Mass Assignment)' }
        - { type: vendor, name: 'Team-D no-additionalProperties' }
        - { type: mining, phase: round1, subagent: 'Y-10', verbatim: 'per-schema rule sharper than P1 request-body-only', verifiedAt: '2026-05-08' }
      stakeholders: [security, spec-author, codegen-tool]
      lifecycle-phase: validation-time
      defect-class: over-specification
      iso25010: [security, maintainability]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: false
      regulatory-mapping:
        nist: ['PR.AA-05', 'PR.DS-01']
        asvs: ['V4.2.1', 'V13.2.4']
        cis: ['CIS-6.7']
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # Y-12 — Array maxItems (DoS — per-property rule)
  # OWASP API4 + 42Crunch; severity: warn
  # =========================================================================
  # Source: OWASP API4:2023 + 42Crunch security-rules; patterns.json Y-12
  # Lens: 1 (Threat-Modeling)
  # Round: 1
  apiq-tm-y12-array-needs-max-items:
    description: >-
      Array-typed schemas MUST declare `maxItems` per OWASP API4 (resource
      consumption / DoS). Unbounded arrays in request OR response are
      DoS-multipliers.
    message: "Array schema lacks `maxItems` — DoS risk per OWASP API4."
    severity: warn
    given: "$..[?(@ && @.type=='array')]"
    then:
      function: defined
      field: maxItems
    apiq-meta:
      pattern-id: Y-12
      lenses: [threat-modeling]
      sources:
        - { type: vendor, name: 'OWASP API4:2023 (Unrestricted Resource Consumption)' }
        - { type: vendor, name: '42Crunch security-rules' }
      stakeholders: [security, operations, spec-author]
      lifecycle-phase: runtime-at-scale
      defect-class: incomplete
      iso25010: [security, performance-efficiency]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: false
      regulatory-mapping:
        nist: ['PR.PT-04', 'PR.IR-04']
        asvs: ['V11.1.4', 'V13.4.1']
        cis: ['CIS-13.1']
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # Y-13 — String maxLength/enum/const (DoS-bound)
  # OWASP API4 + 42Crunch; severity: warn
  # String-typed schemas MUST declare ONE of: maxLength | enum | const —
  # otherwise DoS via huge-string-input.
  # =========================================================================
  # Source: OWASP API4 + 42Crunch; patterns.json Y-13 (P2)
  # Lens: 1 (Threat-Modeling)
  # Round: 1
  apiq-tm-y13-string-needs-max-length-or-enum:
    description: >-
      String-typed schemas without `maxLength` / `enum` / `const` permit
      unbounded input — DoS-bound per OWASP API4.
    message: "String schema needs maxLength, enum, or const (DoS-bound per OWASP API4)."
    severity: warn
    given: "$..[?(@ && @.type=='string' && !@.format)]"
    then:
      function: xor
      functionOptions:
        properties: [maxLength, enum, const]
    apiq-meta:
      pattern-id: Y-13
      lenses: [threat-modeling]
      sources:
        - { type: vendor, name: 'OWASP API4:2023' }
        - { type: vendor, name: '42Crunch security-rules' }
      stakeholders: [security, operations, spec-author]
      lifecycle-phase: runtime-at-scale
      defect-class: incomplete
      iso25010: [security, performance-efficiency]
      codegen-targets: ['*']
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        nist: ['PR.PT-04']
        asvs: ['V11.1.4', 'V13.4.1']
        cis: ['CIS-13.1']
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # Y-14 — Integer minimum + maximum (per-property rule)
  # OWASP API4 + Team-D number-boundaries; severity: warn
  # =========================================================================
  # Source: OWASP API4 + Team-D number-boundaries; patterns.json Y-14 (P2)
  # Lens: 1 (Threat-Modeling)
  # Round: 1
  apiq-tm-y14-integer-needs-min-and-max:
    description: >-
      Integer-typed schemas without BOTH `minimum` AND `maximum` permit
      unbounded numeric input — DoS-bound per OWASP API4.
    message: "Integer schema lacks minimum and/or maximum — DoS-bound per OWASP API4."
    severity: warn
    given: "$..[?(@ && (@.type=='integer' || @.type=='number'))]"
    then:
      - function: defined
        field: minimum
      - function: defined
        field: maximum
    apiq-meta:
      pattern-id: Y-14
      lenses: [threat-modeling]
      sources:
        - { type: vendor, name: 'OWASP API4:2023' }
        - { type: vendor, name: 'Team-D number-boundaries' }
      stakeholders: [security, operations, spec-author]
      lifecycle-phase: runtime-at-scale
      defect-class: incomplete
      iso25010: [security, performance-efficiency]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: false
      regulatory-mapping:
        nist: ['PR.PT-04']
        asvs: ['V11.1.4', 'V13.4.1']
        cis: ['CIS-13.1']
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # Y-15 / TM-A34 — URL-handling-params SSRF-Review-Flag (per-property)
  # OWASP API7 + SSRF-Cheat; severity: warn
  # Hint-level review-flag for ALL URL-shaped property names without
  # format:uri AND scheme-allowlist.
  # =========================================================================
  # Source: OWASP API7:2023 + OWASP SSRF Cheat-Sheet; patterns.json Y-15 (P2)
  # Lens: 1 (Threat-Modeling), 2 (Standards-Compliance)
  # Round: 1
  apiq-tm-y15-url-property-needs-format-uri:
    description: >-
      Properties whose name suggests URL-handling (url, uri, *_url, *_uri,
      callback, webhook, redirect) MUST declare `format: uri` so codegen
      tools can enforce URL-validation — SSRF prerequisite per OWASP API7.
    message: "URL-handling property '{{property}}' lacks `format: uri` — SSRF review-flag (OWASP API7)."
    severity: warn
    given: "$..properties[?(@ && @property.toString().match(/^([a-z_]*url|[a-z_]*uri|webhook|callback|redirect|origin|fetch_target|source_uri)$/i) && @.type=='string')]"
    then:
      - function: defined
        field: format
      - function: pattern
        field: format
        functionOptions:
          match: "^uri$"
    apiq-meta:
      pattern-id: Y-15
      lenses: [threat-modeling, standards-compliance]
      sources:
        - { type: vendor, name: 'OWASP API7:2023 (Server Side Request Forgery)' }
        - { type: vendor, name: 'OWASP SSRF Cheat-Sheet' }
        - { type: mining, phase: round1, subagent: 'Y-15', verbatim: 'extends-by-property-name SSRF flag', verifiedAt: '2026-05-08' }
      stakeholders: [security, end-user, spec-author]
      lifecycle-phase: deploy-time
      defect-class: incomplete
      iso25010: [security]
      codegen-targets: ['*']
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        nist: ['PR.AA-05', 'PR.PT-04']
        asvs: ['V12.6.1', 'V13.4.2']
        cis: ['CIS-13.1', 'CIS-13.10']
      cost-impact: medium
      mttr-impact: high
      agent-readiness-impact: medium

  # =========================================================================
  # Y-19 — Path: no environment-Names (/prod, /dev, /staging)
  # OWASP API8 + S-SP-4; severity: error
  # =========================================================================
  # Source: OWASP API8:2023 + S-SP-4; patterns.json Y-19 (P2, error)
  # Lens: 1 (Threat-Modeling), 3 (Evolution-Friction)
  # Round: 1
  apiq-tm-y19-path-no-env-names:
    description: >-
      Path keys MUST NOT contain environment-names (/prod, /dev, /test,
      /staging, /qa, /sandbox, /preprod) per OWASP API8 — environment
      bleed via paths is operational/security debt.
    message: "Path '{{property}}' contains environment-name segment; use server-URL hierarchy or vendor-extension instead."
    severity: error
    given: "$.paths"
    then:
      function: pattern
      field: "@key"
      functionOptions:
        notMatch: "^/(prod|production|dev|development|test|testing|staging|stage|qa|sandbox|preprod|pre-prod)(/|$)"
    apiq-meta:
      pattern-id: Y-19
      lenses: [threat-modeling, evolution-friction]
      sources:
        - { type: vendor, name: 'OWASP API8:2023 (Security Misconfiguration)' }
        - { type: vendor, name: 'S-SP-4' }
      stakeholders: [security, operations, spec-author]
      lifecycle-phase: deploy-time
      defect-class: semantic
      iso25010: [security, maintainability]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: false
      regulatory-mapping:
        nist: ['PR.AA-05', 'ID.AM-02']
        asvs: ['V14.3.2', 'V14.5.1']
        cis: ['CIS-4.1', 'CIS-4.8']
      cost-impact: medium
      mttr-impact: high
      agent-readiness-impact: low

  # =========================================================================
  # Y-21 — Property names: no programming-keywords (Codegen-correctness)
  # G-SP-6 + multi-codegen; severity: warn
  # Schema property names matching reserved keywords break Java/Python/Go/JS
  # codegen output. The CL-1 P1 ruleset uses `multi-lang-reserved-keywords`
  # to flag these in operationId/parameter-names; this rule extends coverage
  # to ALL component-schema property-names.
  # =========================================================================
  # Source: G-SP-6 + openapi-generator multi-language; patterns.json Y-21
  # Lens: 1 (Threat-Modeling), 4 (Client-Friction)
  # Round: 1
  apiq-tm-y21-property-name-no-programming-keywords:
    description: >-
      Schema property names that collide with programming-language reserved
      keywords (e.g. class, type, return, def, async, await, private,
      public) break codegen output across languages. Threat-modeling angle:
      a renamed-by-codegen property lets attackers craft requests that
      bypass server-side schema validation.
    message: "Property '{{property}}' is a reserved keyword in 1+ codegen-target languages — rename or alias."
    severity: warn
    given: "$.components.schemas[*].properties"
    then:
      function: pattern
      field: "@key"
      functionOptions:
        notMatch: "^(class|type|return|def|async|await|private|public|static|protected|interface|enum|abstract|final|implements|extends|new|delete|import|export|module|package|namespace|try|catch|throw|throws|finally|while|for|do|switch|case|default|break|continue|if|else|true|false|null|undefined|void|yield|let|var|const|function|this|super|self|None|True|False|nil|fn|impl|trait|use|mod|crate|pub|fn|in|out|as|is|when|then|select|union|operator|register|sizeof|typedef|volatile)$"
    apiq-meta:
      pattern-id: Y-21
      lenses: [threat-modeling, client-friction]
      sources:
        - { type: vendor, name: 'G-SP-6' }
        - { type: vendor, name: 'openapi-generator multi-language reserved-keyword lists' }
        - { type: mining, phase: round1, subagent: 'Y-21', verbatim: 'codegen-correctness has security-impact', verifiedAt: '2026-05-08' }
      stakeholders: [security, codegen-tool, client-dev, spec-author]
      lifecycle-phase: build-time
      defect-class: semantic
      iso25010: [security, compatibility, maintainability]
      codegen-targets: ['java', 'python', 'go', 'typescript', 'rust', 'csharp', 'kotlin']
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        nist: ['PR.AA-05']
        asvs: ['V13.2.4']
        cis: ['CIS-16.10']
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # TM-A2 — object-id-write-op SHOULD have security (sharper than Y-23)
  # OWASP API1 (BOLA); severity: warn
  # Custom function `object-id-write-op-needs-security` checks each write op
  # on a path with `{id}`-template segment.
  # =========================================================================
  # Source: OWASP API1:2023 (BOLA); patterns.json TM-A2 (P2, sharper than Y-23)
  # Lens: 1 (Threat-Modeling), 2 (Standards-Compliance)
  # Round: 2
  apiq-tm-a2-object-id-write-op-needs-security:
    description: >-
      Write operations (POST/PUT/PATCH/DELETE) on a path containing an
      `{id}`-template segment MUST declare `security` (or rely on spec-level
      `security`). Sharper than P1 Y-23 — BOLA-prone resource-write paths
      are the highest-risk subset.
    message: "{{error}}"
    severity: warn
    given: "$.paths[*][post,put,patch,delete]"
    then:
      function: object-id-write-op-needs-security
    apiq-meta:
      pattern-id: TM-A2
      lenses: [threat-modeling, standards-compliance]
      sources:
        - { type: vendor, name: 'OWASP API1:2023 (Broken Object Level Authorization)' }
        - { type: mining, phase: round2, subagent: 'TM-A2', verbatim: 'sharper than Y-23 — BOLA-prone subset', verifiedAt: '2026-05-08' }
      stakeholders: [security, end-user, spec-author]
      lifecycle-phase: deploy-time
      defect-class: incomplete
      iso25010: [security]
      codegen-targets: ['*']
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        nist: ['PR.AA-01', 'PR.AA-05']
        asvs: ['V4.1.1', 'V4.2.1']
        cis: ['CIS-6.7']
      cost-impact: medium
      mttr-impact: high
      agent-readiness-impact: high

  # =========================================================================
  # TM-A5 — Bearer + JWT description SHOULD mention RFC 8725
  # OWASP JWT + RFC 8725; severity: warn
  # Companion to Y-8 — covers cases where bearerFormat isn't strictly "JWT"
  # but description text mentions JWT.
  # =========================================================================
  # Source: OWASP JWT + RFC 8725 §3.1/§3.2; patterns.json TM-A5 (P2)
  # Lens: 1 (Threat-Modeling), 2 (Standards-Compliance)
  # Round: 2
  apiq-tm-a5-bearer-jwt-text-rfc-8725-mention:
    description: >-
      Security-scheme bearer where description-text mentions "JWT" SHOULD
      reference RFC 8725 (JWT BCP). Catches "naive JWT" specs where
      bearerFormat is unset but description prose says "JWT".
    message: "Bearer scheme description mentions JWT but does not reference RFC 8725 (JWT BCP)."
    severity: warn
    given: "$.components.securitySchemes[?(@ && @.type=='http' && @.scheme=='bearer' && @.description && @.description.toString().match(/JWT|jwt|JSON\\s+Web\\s+Token/))]"
    then:
      function: pattern
      field: description
      functionOptions:
        match: "(RFC\\s*8725|BCP\\s*[-]?\\s*225|JWT\\s*BCP|JWT\\s*Best\\s*Current\\s*Practices)"
    apiq-meta:
      pattern-id: TM-A5
      lenses: [threat-modeling, standards-compliance]
      sources:
        - { type: rfc, number: 8725, section: '3.1', verbatim: 'JWTs that are sent as bearer tokens MUST be signed and integrity-protected', verifiedAt: '2026-05-08' }
        - { type: vendor, name: 'OWASP JWT Cheatsheet' }
      stakeholders: [security, end-user, spec-author]
      lifecycle-phase: documentation-time
      defect-class: incomplete
      iso25010: [security, usability]
      codegen-targets: ['*']
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        nist: ['PR.AA-01', 'PR.AA-02']
        asvs: ['V51.4.1', 'V51.4.2']
        cis: ['CIS-6.1']
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # TM-A7 — OAuth2 authorizationCode SHOULD declare PKCE
  # RFC 9700 (BCP-240) §2.1.1; severity: warn
  # Custom function `oauth2-authcode-pkce-recommended`.
  # =========================================================================
  # Source: RFC 9700 BCP-240 §2.1.1 verbatim "Clients MUST use PKCE";
  #         patterns.json TM-A7 (P2)
  # Lens: 1 (Threat-Modeling), 2 (Standards-Compliance)
  # Round: 2
  apiq-tm-a7-oauth2-authcode-pkce-recommended:
    description: >-
      OAuth2 authorizationCode flows SHOULD declare PKCE per RFC 9700
      BCP-240 — either via `x-pkce-required: true` extension or by
      mentioning PKCE in the flow description.
    message: "{{error}}"
    severity: warn
    given: "$.components.securitySchemes[?(@ && @.type=='oauth2')].flows"
    then:
      function: oauth2-authcode-pkce-recommended
    apiq-meta:
      pattern-id: TM-A7
      lenses: [threat-modeling, standards-compliance]
      sources:
        - { type: bcp, number: 240, rfc: 9700, section: '2.1.1', verbatim: 'Clients MUST use PKCE', verifiedAt: '2026-05-08' }
      stakeholders: [security, end-user, ai-agent, spec-author]
      lifecycle-phase: deploy-time
