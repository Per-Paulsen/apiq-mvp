  apiq-tm-a35-url-property-needs-scheme-allowlist:
    description: >-
      Properties typed `format: uri` that match URL-shaped names MUST also
      declare a `pattern` constraining the URL-scheme (e.g. `^https?://`)
      — without scheme-allowlist, file:// + javascript:// + gopher:// URLs
      slip through (OWASP API7 SSRF).
    message: "URL-handling property '{{property}}' has format:uri but no scheme-restricting pattern (SSRF risk)."
    severity: warn
    given: "$..properties[?(@ && @property.toString().match(/^([a-z_]*url|[a-z_]*uri|webhook|callback|redirect|origin|fetch_target|source_uri)$/i) && @.format=='uri')]"
    then:
      function: defined
      field: pattern
    apiq-meta:
      pattern-id: TM-A35
      lenses: [threat-modeling]
      sources:
        - { type: vendor, name: 'OWASP API7:2023 (SSRF)' }
