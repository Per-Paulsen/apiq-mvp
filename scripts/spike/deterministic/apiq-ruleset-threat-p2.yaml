  # RFC 9457 §3.1; severity: warn
  # =========================================================================
  # Source: RFC 9457 §3.1 (Problem Details for HTTP APIs);
  #         patterns.json RFC2-1 (P2)
  # Lens: 2 (Standards-Compliance), 4 (Client-Friction)
  # Round: 2 (R3+R4 severity-evidence: 0% adoption — high-priority)
  apiq-rfc2-1-problem-json-needs-type:
    description: >-
      Schemas declared as `application/problem+json` MUST include a `type`
      property AND SHOULD include `title`, `status`, `detail`, `instance`
      per RFC 9457 §3.1.
    message: "problem+json schema lacks `type` property — RFC 9457 §3.1."
    severity: warn
    given: "$..content['application/problem+json'].schema"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - properties
          properties:
            properties:
              type: object
              required:
                - type
    apiq-meta:
      pattern-id: RFC2-1
      lenses: [standards-compliance, client-friction]
      sources:
        - { type: rfc, number: 9457, section: '3.1', verbatim: 'A problem details object can have the following members: type ...', verifiedAt: '2026-05-08' }
