  # ------------------------------------------------------------------------
  # EV-48 — PATCH accepts application/json (RFC errata 3169)
  # [drift] [warn] sources: SP-G-TD-4 + Azure az-patch-content-type + IBM
  # ------------------------------------------------------------------------
  # Source: SP-G-TD-4 + Azure az-patch-content-type + IBM MIN-30 + RFC 7396
  #         (merge-patch+json) + RFC 6902 (json-patch+json) + RFC errata 3169;
  #         rules-brainstorm.md EV-48 (P2, drift) + RFC2-97
  # Lens: 3 (Evolution-Friction), 2 (Standards-Compliance)
  # Round: 2
  apiq-ev-48-patch-content-type:
    description: >-
      [lens-3 | drift] EV-48: `PATCH` operation accepts `application/json`
      instead of `application/merge-patch+json` (RFC 7396) or
      `application/json-patch+json` (RFC 6902). RFC errata 3169 + IETF guidance.
      Standardizing the content-type later is breaking. Sources:
      [SP-G-TD-4] [Azure az-patch-content-type] [SG-34] [IBM MIN-30].
    message: "`PATCH` accepts `application/json` instead of `application/merge-patch+json` or `application/json-patch+json` (RFC 7396 / 6902)."
    severity: warn
    given: "$.paths[*].patch.requestBody.content"
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - required: ['application/merge-patch+json']
            - required: ['application/json-patch+json']
    apiq-meta:
      pattern-id: EV-48
      lenses: [evolution-friction, standards-compliance, client-friction]
      direction: drift
      sources:
        - type: rfc
          number: 7396
          summary: 'A JSON merge patch document describes changes to be made to a target JSON document.'
        - type: rfc
          number: 6902
          summary: 'JSON Patch defines a JSON document structure for expressing a sequence of operations to apply to a JSON document.'
        - type: vendor
          name: 'Azure az-patch-content-type'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'IBM MIN-30'
          verifiedAt: '2026-05-08'
      stakeholders: [spec-author, client-dev, codegen-tool]
      lifecycle-phase: authoring-time
      defect-class: norm
      iso25010: [compatibility, maintainability]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

