  apiq-ev-19-unused-securityschemes:
    description: >-
      [lens-3 | drift] EV-19: Security scheme is defined but no operation (or
      `security` block) references it. Adding it as a requirement later is
      breaking for existing public endpoints. Sources: [OASDIFF security-removed-or-added-is-breaking] [apiq F3].
    message: "Security scheme {{property}} is defined but never referenced."
    severity: warn
    recommended: true
    resolved: false
    given: "$.components.securitySchemes"
    then:
