# apiq Spectral Evolution Ruleset (Lens 3 — Single-Spec Breaking-Change-Prediction)
#
# Authored 2026-05-06 (Task T17 / Wave-2 Welle-B). This ruleset implements the
# EV-* P1 + P2 patterns from Round-2 Phase C mining:
#   - specs/big-spec-architecture-spike-stage-a-mining-round2-evolution.md
#   - specs/big-spec-architecture-spike-stage-a-implementation-priority.md
#   - specs/big-spec-architecture-spike-stage-a-rules-brainstorm.md
#
# Lens 3 is apiq's first DIFF — no other linter does single-spec breaking-change
# prediction. Mature linters (Vacuum, Redocly, IBM, OWASP-Spectral, Zalando-Zally)
# cover Lens-1/2/5; oasdiff and openapi-changes need TWO specs. apiq Stage-A
# predicts breaking changes from a SINGLE spec by flagging structural patterns
# that imply future tightening / loosening / drift will be breaking.
#
# Welle F (2026-05-08) — apiq-meta-block migration applied to all 30 rules.
# Each rule now carries:
#   - structured `direction:` field (replacing description-prefix Prosa)
#   - lenses[] (multi-lens membership per patterns.json)
#   - sources[] (RFC / vendor / mining citations)
#   - stakeholders[], lifecycle-phase, defect-class, iso25010[]
#   - codegen-targets[], detection-precision, auto-fix-safe
#   - regulatory-mapping (where security/privacy-relevant)
#   - cost-impact, mttr-impact, agent-readiness-impact
# The Spectral runner (`spectral-runner.ts`) reads `apiq-meta` at YAML-load time
# and strips it before handing the rule to Spectral; the block is propagated
# into `DetectorFinding.meta.apiqMeta` for downstream consumers.
#
# Severity-Schema Final integration:
#   - Each rule carries a `direction` modifier (tighten/loosen/drift) per
#     `severity-schema.ts` Section 2 — implemented as a top-level `apiq-meta`
#     field. The legacy `[lens-3 | direction]` description-prefix is preserved
#     for human-reader continuity.
#   - Sources are tagged in description prose as `[OASDIFF/OPTIC/STRIPE/...]`
#     and structured under `apiq-meta.sources` for machine consumption.
#
# Welle F severity-upgrades applied (per patterns.json severity-hypothesis):
#   - EV-5  hint→warn (patterns.json severityHypothesis: warn; OASDIFF + Microsoft + Zalando)
#   - EV-6  hint→warn (patterns.json severityHypothesis: warn; OASDIFF + Bump.sh)
#   - EV-14 hint→warn (patterns.json severityHypothesis: warn; SP-G-AZ-9 + IBM)
#   - EV-17 hint→warn (patterns.json severityHypothesis: warn; SG-41 + spectral:oas)
#   - EV-23 hint→warn (both string + array variants; OASDIFF schema-tightening)
#   - EV-18 warn→hint (patterns.json severityHypothesis: hint; OWASP-mass-assignment-class)
# Note: EV-1 already at warn (matches RFC 9745 / R4-IETF-ST-01 target).
#
# Cross-cut with apiq-ruleset.yaml: the base ruleset already covers EV-19
# (unused securitySchemes, via spectral:oas), EV-22 ($ref-cycle DoS via apiq's
# A2 cycle module), and several Lens-3-tagged patterns through other lenses.
# This file adds the EV-specific net-new rules.
#
# Rules below grouped by P-tier (P1 first — mature-linter-pari; P2 second —
# apiq-USP differentiator). Walkers in `walkers/evolution-statistical.ts`
# cover the patterns Spectral DSL cannot express (statistical aggregation,
# graph-walks, cross-spec property-name-checks).

extends:
  - spectral:oas

formats:
  - oas3
  - oas3_0
  - oas3_1

rules:
  # =========================================================================
  # ============================ P1 — EV PATTERNS ===========================
  # =========================================================================
  # Mature-linter-pari (oasdiff/Optic/Spectral catch these in two-spec mode;
  # apiq catches them in single-spec mode by flagging the structural pattern).

  # ------------------------------------------------------------------------
  # EV-1 — `deprecated: true` operation/parameter without sunset/replacement
  # [drift] [warn] sources: OASDIFF + OAS-3.3-PROP + RFC 8594 + RFC 9745 + API-Platform + Zalando #189
  # ------------------------------------------------------------------------
  # Source: OASDIFF endpoint-deprecated-no-sunset + RFC 8594 (Sunset header) +
  #         RFC 9745 (Deprecation header, March 2025, R4-IETF-ST-01) +
  #         API-Platform x-deprecation-details + Zalando #189;
  #         rules-brainstorm.md EV-1 (P1, drift)
  # Lens: 3 (Evolution-Friction), 4 (Client-Friction)
  # Round: 2 + R4-IETF-ST-01 (RFC 9745)
  apiq-ev-1-deprecated-needs-sunset:
    description: >-
      [lens-3 | drift] EV-1: An operation flagged `deprecated: true` should also
      indicate WHEN it sunsets (`x-sunset` / `Sunset` header / RFC 8594) and a
      replacement reference (`x-replacement` / `x-deprecation-details` / prose).
      Without these markers the deprecation-removal-without-sunset-window is a
      breaking-change-class-O. Sources: [OASDIFF endpoint-deprecated-no-sunset]
      [OAS-3.3-PROP] [RFC 8594] [RFC 9745 Deprecation Header (March 2025)]
      [API-Platform x-deprecation-details] [Zalando #189].
    message: "Deprecated operation lacks sunset date or replacement reference (description should mention sunset/removed/use ... instead, or set x-sunset / x-replacement)."
    severity: warn
    given: "$.paths[*][?(@.deprecated===true)]"
    then:
      function: truthy
      field: description
    apiq-meta:
      pattern-id: EV-1
      lenses: [evolution-friction, client-friction, operational-metadata]
      direction: drift
      sources:
        - type: rfc
          number: 8594
          section: '2'
          summary: 'The Sunset HTTP response header field indicates that a URI is likely to become unresponsive at a specified point in the future.'
        - type: rfc
          number: 9745
          section: '1'
          summary: 'Deprecation is an Item Structured Header Field; its value MUST be a Date as per Section 3.3.7 of [RFC9651].'
        - type: vendor
          name: 'OASDIFF endpoint-deprecated-no-sunset'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'Zalando RESTful API Guidelines #189'
          verifiedAt: '2026-05-08'
      stakeholders: [client-dev, end-user, ai-agent]
      lifecycle-phase: evolution-time
      defect-class: operational-metadata-missing
      iso25010: [reliability, maintainability, compatibility]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: high
      agent-readiness-impact: high

  # ------------------------------------------------------------------------
  # EV-4 — Bare-array request/response body
  # [tighten] [warn] sources: OASDIFF + already-cross-source consensus
  # ------------------------------------------------------------------------
  # Source: OASDIFF body-type-changed-from-array-to-object + apiq §1;
  #         rules-brainstorm.md EV-4 (P1, tighten)
  # Lens: 3 (Evolution-Friction), 4 (Client-Friction)
  # Round: 2
  apiq-ev-4-bare-array-response-body:
    description: >-
      [lens-3 | tighten] EV-4: A response body schema typed `array` (no envelope)
      forces a breaking change to add metadata, pagination, or links later.
      Wrap arrays in an envelope object (e.g. {data: [], pagination: {...}}).
      Source: [OASDIFF body-type-changed-from-array-to-object is breaking].
    message: "Bare array response body — wrapping in an envelope later is a breaking change."
    severity: warn
    given: "$.paths[*][get,post,put,patch,delete].responses[*].content[*].schema[?(@.type=='array')]"
    then:
      function: undefined
      field: type
    apiq-meta:
      pattern-id: EV-4
      lenses: [evolution-friction, client-friction]
      direction: tighten
      sources:
        - type: vendor
          name: 'OASDIFF body-type-changed-from-array-to-object'
          verifiedAt: '2026-05-08'
      stakeholders: [client-dev, spec-author]
      lifecycle-phase: evolution-time
      defect-class: over-specification
      iso25010: [maintainability, compatibility]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: high
      mttr-impact: high
      agent-readiness-impact: medium

  # Source: OASDIFF body-type-changed (request-side mirror);
  #         rules-brainstorm.md EV-4 (P1, request variant)
  # Lens: 3 (Evolution-Friction), 4 (Client-Friction)
  # Round: 2
  apiq-ev-4-bare-array-request-body:
    description: >-
      [lens-3 | tighten] EV-4 (request-side): A request-body schema typed `array`
      forces a breaking change to add metadata or wrap fields later.
      Source: [OASDIFF body-type-changed].
    message: "Bare array request body — adding fields later is a breaking change."
    severity: warn
    given: "$.paths[*][post,put,patch].requestBody.content[*].schema[?(@.type=='array')]"
    then:
      function: undefined
      field: type
    apiq-meta:
      pattern-id: EV-4
      lenses: [evolution-friction, client-friction]
      direction: tighten
      sources:
        - type: vendor
          name: 'OASDIFF body-type-changed'
          verifiedAt: '2026-05-08'
      stakeholders: [client-dev, spec-author]
      lifecycle-phase: evolution-time
      defect-class: over-specification
      iso25010: [maintainability, compatibility]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: high
      mttr-impact: high
      agent-readiness-impact: medium

  # ------------------------------------------------------------------------
  # EV-5 — additionalProperties not declared on response schemas
  # [tighten] [warn] sources: OASDIFF + Microsoft + Zalando #225
  # NOTE: Statistical M8 walker handles spec-wide aggregation; this rule fires
  # per-component-schema so each violation is locatable.
  # Welle F severity-upgrade: hint → warn (patterns.json severityHypothesis: warn).
  # ------------------------------------------------------------------------
  # Source: OASDIFF additionalProperties-changed + Microsoft rest-fail-for-
  #         unknown-fields + Zalando #225 + SG-42; rules-brainstorm.md EV-5 (P1)
  # Lens: 3 (Evolution-Friction), 4 (Client-Friction), 1 (Threat-Modeling)
  # Round: 2
  apiq-ev-5-response-schema-additionalproperties-undeclared:
    description: >-
      [lens-3 | tighten] EV-5: Response component schemas should declare
      `additionalProperties: false` (or true with explicit allowed types) so
      tightening to false later is non-breaking. Adding strict-validation later
      breaks clients that sent extra props (mass-assignment-class A1).
      Sources: [OASDIFF additionalProperties-changed] [Microsoft rest-fail-for-unknown-fields] [Zalando #225].
    message: "Response schema does not declare `additionalProperties`; future tightening is breaking."
    severity: warn
    given: "$.components.schemas[?(@.type=='object' && @.properties && @.additionalProperties===undefined)]"
    then:
      function: defined
      field: additionalProperties
    apiq-meta:
      pattern-id: EV-5
      lenses: [evolution-friction, client-friction, threat-modeling]
      direction: tighten
      sources:
        - type: vendor
          name: 'OASDIFF additionalProperties-changed'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'Microsoft rest-fail-for-unknown-fields'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'Zalando RESTful API Guidelines #225'
          verifiedAt: '2026-05-08'
      stakeholders: [spec-author, client-dev, security]
      lifecycle-phase: evolution-time
      defect-class: incomplete
      iso25010: [security, maintainability]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        asvs: ['V13.2.1']
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: low

  # ------------------------------------------------------------------------
  # EV-8 — Operation lacks operationId
  # [drift] [warn] sources: OPTIC + OASDIFF + Spectral default
  # NOTE: spectral:oas already includes `operation-operationId`; we re-state it
  # at warn to bind the Lens-3 framing (path-rename without operationId is breaking).
  # ------------------------------------------------------------------------
  # Source: OPTIC operationId-required + OASDIFF operationId-removed-is-breaking +
  #         spectral:oas operation-operationId; rules-brainstorm.md EV-8 (P1)
  # Lens: 3 (Evolution-Friction), 4 (Client-Friction)
  # Round: 2
  apiq-ev-8-operation-needs-operationid:
    description: >-
      [lens-3 | drift] EV-8: Without `operationId`, the only stable identity for
      the operation is path+method — any path rename becomes a breaking-rename.
      Codegen tools build SDK function-names from operationId; absence forces
      brittle path-derived names. Source: [OPTIC operationId-required] [OASDIFF operationId-removed-is-breaking].
    message: "Operation lacks `operationId`; path-rename later becomes a breaking-rename."
    severity: warn
    given: "$.paths[*][get,post,put,patch,delete,options,head,trace]"
    then:
      function: truthy
      field: operationId
    apiq-meta:
      pattern-id: EV-8
      lenses: [evolution-friction, client-friction, ai-agent-consumability]
      direction: drift
      sources:
        - type: vendor
          name: 'OPTIC operationId-required'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'OASDIFF operationId-removed-is-breaking'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'spectral:oas operation-operationId'
          verifiedAt: '2026-05-08'
      stakeholders: [spec-author, client-dev, codegen-tool, ai-agent]
      lifecycle-phase: authoring-time
      defect-class: incomplete
      iso25010: [maintainability, usability]
      codegen-targets: [java, go, python, typescript, rust, csharp, kotlin]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: high
      agent-readiness-impact: high

  # ------------------------------------------------------------------------
  # EV-10 — Mixed URL+Header versioning
  # [drift] [warn] sources: SG-6 + Zalando MUST-single-version + Stripe + GH-API + MS-AZ
  # NOTE: Detected via Walker (cross-cutting; needs to inspect both servers and parameters).
  # See evolution-statistical.ts walkVersioningAxisDrift.
  # ------------------------------------------------------------------------

  # ------------------------------------------------------------------------
  # EV-23 — Request property maxLength/maxItems/maximum/pattern absent
  # [tighten] [warn] sources: OASDIFF schema-tightening
  # NOTE: Statistical Walker handles spec-wide; this DSL rule fires per-property
  # for string-typed request properties without maxLength.
  # Welle F severity-upgrade: hint → warn (patterns.json severityHypothesis: warn).
  # ------------------------------------------------------------------------
  # Source: OASDIFF schema-pattern-added (request) + maxLength-decreased;
  #         rules-brainstorm.md EV-23 (P1, tighten)
  # Lens: 3 (Evolution-Friction), 1 (Threat-Modeling)
  # Round: 2
  apiq-ev-23-request-string-needs-maxlength:
    description: >-
      [lens-3 | tighten] EV-23: Request-string property without `maxLength` —
      server tightening (adding `maxLength: 100`) later breaks clients that
      send 101-char strings. Sources: [OASDIFF schema-pattern-added (request)]
      [OASDIFF maxLength-decreased].
    message: "Request property is `type: string` without `maxLength` — server tightening later is breaking."
    severity: warn
    given: "$.paths[*][post,put,patch].requestBody.content[*].schema..properties[?(@.type=='string' && @.maxLength===undefined && @.enum===undefined && @.format===undefined)]"
    then:
      function: defined
      field: maxLength
    apiq-meta:
      pattern-id: EV-23
      lenses: [evolution-friction, threat-modeling]
      direction: tighten
      sources:
        - type: vendor
          name: 'OASDIFF schema-pattern-added (request)'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'OASDIFF maxLength-decreased'
          verifiedAt: '2026-05-08'
      stakeholders: [spec-author, client-dev, security]
      lifecycle-phase: evolution-time
      defect-class: incomplete
      iso25010: [security, reliability]
      codegen-targets: ['*']
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        asvs: ['V5.1.4']
        nist: ['PR.DS-2']
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: low

  # Source: OASDIFF schema-tightening (array variant);
  #         rules-brainstorm.md EV-23 (P1, tighten)
  # Lens: 3 (Evolution-Friction), 1 (Threat-Modeling)
  # Round: 2
  apiq-ev-23-request-array-needs-maxitems:
    description: >-
      [lens-3 | tighten] EV-23 (array variant): Request-array property without
      `maxItems` — server tightening later is breaking.
    message: "Request property is `type: array` without `maxItems` — server tightening later is breaking."
    severity: warn
    given: "$.paths[*][post,put,patch].requestBody.content[*].schema..properties[?(@.type=='array' && @.maxItems===undefined)]"
    then:
      function: defined
      field: maxItems
    apiq-meta:
      pattern-id: EV-23
      lenses: [evolution-friction, threat-modeling]
      direction: tighten
      sources:
        - type: vendor
          name: 'OASDIFF schema-tightening'
          verifiedAt: '2026-05-08'
      stakeholders: [spec-author, client-dev, security]
      lifecycle-phase: evolution-time
      defect-class: incomplete
      iso25010: [security, reliability]
      codegen-targets: ['*']
      detection-precision: medium
      auto-fix-safe: false
      regulatory-mapping:
        asvs: ['V5.1.4']
        nist: ['PR.DS-2']
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: low

  # ------------------------------------------------------------------------
  # EV-24 — Request pattern without ^/$ anchors
  # [tighten] [warn] sources: MIN-2 IBM + OASDIFF
  # ------------------------------------------------------------------------
  # Source: IBM ibm-anchored-patterns (MIN-2) + OASDIFF pattern-tightened;
  #         rules-brainstorm.md EV-24 (P1, tighten) + CL-26
  # Lens: 3 (Evolution-Friction), 2 (Standards-Compliance)
  # Round: 2
  apiq-ev-24-pattern-needs-anchors:
    description: >-
      [lens-3 | tighten] EV-24: A `pattern` constraint without `^...$` anchors
      matches only a substring; server tightening anchors later rejects
      previously-passing strings. Sources: [IBM ibm-anchored-patterns] [OASDIFF pattern-tightened].
    message: "`pattern` does not contain `^...$` anchors — server tightening to anchored later is breaking."
    severity: warn
    given: "$..[?(@.pattern && @.type=='string')]"
    then:
      function: pattern
      field: pattern
      functionOptions:
        match: "(^\\^.*\\$$)|(^\\^[^|]*$)|(^.*\\$$)"
    apiq-meta:
      pattern-id: EV-24
      lenses: [evolution-friction, standards-compliance, threat-modeling]
      direction: tighten
      sources:
        - type: vendor
          name: 'IBM ibm-anchored-patterns (MIN-2)'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'OASDIFF pattern-tightened'
          verifiedAt: '2026-05-08'
      stakeholders: [spec-author, client-dev, security]
      lifecycle-phase: evolution-time
      defect-class: incomplete
      iso25010: [security, reliability]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: true
      regulatory-mapping:
        asvs: ['V5.1.3']
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: low

  # ------------------------------------------------------------------------
  # EV-25 — type:integer without format:int32/int64
  # [tighten] [warn] sources: SP-G-OWASP-21 + Zalando + OASDIFF + JSON-Schema-evolution
  # ------------------------------------------------------------------------
  # Source: SP-G-OWASP-21 must-define-a-format-for-integer-types + Zalando
  #         integer-format + OASDIFF format-changed + JSON-Schema-evolution
  #         int->long->float->double; rules-brainstorm.md EV-25 (P1, drift)
  # Lens: 3 (Evolution-Friction), 2 (Standards-Compliance), 4 (Client-Friction)
  # Round: 2
  apiq-ev-25-integer-needs-format:
    description: >-
      [lens-3 | tighten] EV-25: An untyped `integer` (no `format: int32` /
      `int64`) leaves codegen-classes ambiguous — declaring format later
      changes precision and codegen-class (silent-breaking on edge cases).
      Sources: [SP-G-OWASP-21 must-define-a-format-for-integer-types]
      [Zalando integer-format] [OASDIFF format-changed]
      [JSON-Schema-evolution int->long->float->double].
    message: "`type: integer` without `format: int32` / `int64` — declaring format later is breaking on edge cases."
    severity: warn
    given: "$..[?(@.type=='integer' && @.format===undefined)]"
    then:
      function: defined
      field: format
    apiq-meta:
      pattern-id: EV-25
      lenses: [evolution-friction, standards-compliance, client-friction]
      direction: tighten
      sources:
        - type: vendor
          name: 'SP-G-OWASP-21 must-define-a-format-for-integer-types'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'Zalando integer-format'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'OASDIFF format-changed'
          verifiedAt: '2026-05-08'
      stakeholders: [spec-author, client-dev, codegen-tool]
      lifecycle-phase: evolution-time
      defect-class: incomplete
      iso25010: [compatibility, maintainability]
      codegen-targets: [java, go, csharp, kotlin, rust]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: medium

  # ------------------------------------------------------------------------
  # EV-27 — Path-segment file-extension
  # [drift] [error] sources: SP-G-AYWH-14 + SG-5 + SPS
  # ------------------------------------------------------------------------
  # Source: SP-G-AYWH-14 + SG-5 + SPS sps-paths-expose-extension;
  #         rules-brainstorm.md EV-27 (P1, drift) + CL-50
  # Lens: 3 (Evolution-Friction), 5 (Style-Coherence)
  # Round: 2
  apiq-ev-27-path-no-file-extension:
    description: >-
      [lens-3 | drift] EV-27: A path segment with file-extension (`.json`,
      `.xml`, `.html`) bakes content-negotiation-via-extension into the URL.
      Replacing with `Accept`-header negotiation later is a major breaking
      change (URL-rotation). Sources: [SP-G-AYWH-14] [SG-5] [SPS sps-paths-expose-extension].
    message: "Path contains file-extension segment ({{value}}); content-negotiation-via-Accept later is breaking."
    severity: error
    given: "$.paths"
    then:
      function: pattern
      field: "@key"
      functionOptions:
        notMatch: "\\.(json|xml|html|yaml|yml|txt|csv|pdf)(/|$)"
    apiq-meta:
      pattern-id: EV-27
      lenses: [evolution-friction, style-coherence]
      direction: drift
      sources:
        - type: vendor
          name: 'SPS sps-paths-expose-extension'
          verifiedAt: '2026-05-08'
        - type: vendor
          name: 'SG-5 / SP-G-AYWH-14'
          verifiedAt: '2026-05-08'
      stakeholders: [spec-author, client-dev]
      lifecycle-phase: authoring-time
      defect-class: norm
      iso25010: [maintainability, compatibility]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: false
      cost-impact: high
      mttr-impact: high
      agent-readiness-impact: medium

  # ------------------------------------------------------------------------
  # EV-28 — Server URL contains environment name
  # [drift] [error] sources: SP-G-SPS-10
  # ------------------------------------------------------------------------
  # Source: SP-G-SPS-10 (no-environment-in-server-url);
  #         rules-brainstorm.md EV-28 (P1, drift)
  # Lens: 3 (Evolution-Friction), 1 (Threat-Modeling — env-leak)
  # Round: 2
  apiq-ev-28-server-url-no-environment:
    description: >-
      [lens-3 | drift] EV-28: Server URL contains environment name (`/dev/`,
      `/staging/`, `/sandbox/`, `/prod/`) — promoting from staging to prod
      requires URL rotation, which is breaking. Source: [SP-G-SPS-10].
    message: "Server URL contains environment name (dev/staging/sandbox/prod); promotion later is breaking."
    severity: error
    given: "$.servers[*].url"
    then:
      function: pattern
      functionOptions:
        notMatch: "/(dev|staging|stage|sandbox|prod|production|test|qa|uat)(/|$)"
    apiq-meta:
      pattern-id: EV-28
      lenses: [evolution-friction, threat-modeling]
      direction: drift
      sources:
        - type: vendor
          name: 'SPS sps-no-environment-in-server-url'
          verifiedAt: '2026-05-08'
      stakeholders: [spec-author, security, operations]
      lifecycle-phase: deploy-time
      defect-class: semantic
      iso25010: [security, maintainability]
      codegen-targets: ['*']
      detection-precision: high
      auto-fix-safe: false
      regulatory-mapping:
        nist: ['PR.AC-5']
        soc2: ['CC6.6']
      cost-impact: medium
      mttr-impact: high
