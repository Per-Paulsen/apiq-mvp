# apiq Spectral Ruleset — P3 Standards-Compliance Rules (T-RFC2, Welle D)
#
# 47 P3 (Defense-in-Depth + Nice-to-Have) RFC-/Standards-rooted rules per
# implementation-priority.md P3 RFC2-* table — patterns drawn from RFC 9110,
# RFC 9111, RFC 9457, RFC 8288, RFC 8594, RFC 7240, RFC 7578, RFC 7396,
# RFC 6902, RFC 9700, OAS 3.0/3.1, JSON-Schema, IETF drafts, and IANA
# registries.
#
# Rule-count: 30 yaml-rules (47 patterns, after 4 bundle-consolidations:
#   - apiq-rfc2-cache-header-bundle      RFC2-30/31/33/34
#   - apiq-rfc2-cache-validators-bundle  RFC2-35/36/37/38/39
#   - apiq-rfc2-link-header-bundle       RFC2-52/53/54/55
#   - apiq-rfc2-multipart-form-bundle    RFC2-100/101
# Bundle-Konsolidation per Welle-D spec analog to Welle-C
# `apiq-rfc2-conditional-request-correctness` (RFC2-20/21/22/25/26).
#
# Authored 2026-05-09 (T-RFC2 / Welle D) from:
#   - specs/big-spec-architecture-spike-stage-a-implementation-priority.md
#   - specs/big-spec-architecture-spike-stage-a-restwork-plan.md §7
#   - scripts/spike/data/patterns.json (single-source pattern substrate)
#   - rules-brainstorm.md (R1+R2+R3+R4 mining-round consolidations)
#
# Severity discipline (per Severity-Schema Final, T23):
#   - error: RFC-2119 MUST violated; CI-blocking. (RFC2-15, RFC2-41 only —
#            both verbatim "MUST" per source.)
#   - warn:  RFC-2119 SHOULD violated, OR strong cross-source consensus.
#   - hint:  Soft signal; informative; opinion-divided. Default for P3.
#
# apiq-meta block (Welle F schema): every rule carries pattern-id, lenses,
# sources (with verbatim+verifiedAt where source-verbatim available),
# stakeholders, lifecycle-phase, defect-class, iso25010 (array),
# codegen-targets, detection-precision, auto-fix-safe, regulatory-mapping
# (NIST+ASVS where applicable), cost-impact, mttr-impact,
# agent-readiness-impact.
#
# `source-verbatim`-fields populated for the 3 patterns flagged "verbatim" in
# implementation-priority.md (RFC2-15 §15.5.16, RFC2-41 §11.6.4) plus
# additional verbatim citations on bundles + single-rule patterns where
# source-verbatim is on hand. Feeds T25 Source-Verify-CI (Welle D).
#
# This file is loaded by spectral-runner.ts — wiring lives in Phase-3
# integration task (#9) of Welle D, not in this file.

extends:
  - spectral:oas

formats:
  - oas3
  - oas3_0
  - oas3_1

rules:
  # =========================================================================
  # RFC2-4 — problem-details extensions MUST NOT redefine reserved names
  # RFC 9457 §3.2 + §4.2; severity: warn
  # Custom function `problem-details-extension-reserved`.
  # =========================================================================
  # Source: RFC 9457 §3.2/§4.2 — reserved member-names: type, title, status,
  #         detail, instance. patterns.json RFC2-4 (P3 standards).
  # Lens: 2 (Standards-Compliance)
  # Round: 2 / Welle D
  apiq-rfc2-4-problem-details-reserved-names:
    description: >-
      Problem-Details (RFC 9457) `application/problem+json` extension objects MUST NOT redefine the 5 reserved member-names (type, title, status, detail, instance) with conflicting types. Detected via type-check on schema-properties bearing reserved names.
    message: "{{error}}"
    severity: warn
    given:
      - "$.paths[*][*].responses[*].content[application/problem+json]"
      - "$.paths[*][*].responses[*].content[application/problem+xml]"
    then:
      function: problem-details-extension-reserved
    apiq-meta:
      pattern-id: RFC2-4
      lenses: [ standards-compliance ]
      sources:
        - { type: rfc, number: 9457, section: '3.2', summary: 'reserved member names: type, title, status, detail, instance' }
        - { type: rfc, number: 9457, section: '4.2', summary: 'extensions MUST NOT use the same names as reserved members' }
        - { type: mining, phase: round2, subagent: 'RFC2-4', summary: 'patterns.json RFC2-4 P3' }
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: validation-time
      defect-class: norm
      iso25010: [ compatibility, usability ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: false
      regulatory-mapping:
        nist: [ 'GV.SC-04' ]
        asvs: [ 'V13.2.1' ]
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # RFC2-13 — 1xx response → Upgrade/Connection header declared
  # RFC 9110 §6.2; severity: hint
  # Custom function `one-xx-response-upgrade-header`.
  # =========================================================================
  # Source: RFC 9110 §6.2. patterns.json RFC2-13 (P3 standards).
  # Lens: 2
  # Round: 2 / Welle D
  apiq-rfc2-13-1xx-upgrade-connection:
    description: >-
      1xx informational responses (100, 101, etc.) SHOULD declare an `Upgrade` or `Connection` header — per RFC 9110 §6.2 the typical use of 1xx is during protocol-upgrade negotiation.
    message: "{{error}}"
    severity: hint
    given: "$.paths[*][get,head,post,put,patch,delete,options,trace].responses"
    then:
      function: one-xx-response-upgrade-header
    apiq-meta:
      pattern-id: RFC2-13
      lenses: [ standards-compliance ]
      sources:
        - { type: rfc, number: 9110, section: '6.2', verifiedAt: '2026-05-09' }
        - { type: mining, phase: round2, subagent: 'RFC2-13', summary: '1xx → Upgrade/Connection' }
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: documentation-time
      defect-class: incomplete
      iso25010: [ compatibility ]
      codegen-targets: [ '*' ]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # RFC2-15 — 426 → Upgrade header REQUIRED (verbatim "MUST")
  # RFC 9110 §15.5.16; severity: error
  # Custom function `upgrade-required-426`.
  # =========================================================================
  # Source: RFC 9110 §15.5.16 verbatim "MUST send Upgrade".
  #         patterns.json RFC2-15 (P3 standards, error).
  # Lens: 2
  # Round: 2 / Welle D
  apiq-rfc2-15-426-upgrade-required:
    description: >-
      426 (Upgrade Required) responses MUST declare an `Upgrade` header per RFC 9110 §15.5.16 (verbatim "The server MUST send an Upgrade header field").
    message: "{{error}}"
    severity: error
    given: "$.paths[*][get,head,post,put,patch,delete,options,trace].responses"
    then:
      function: upgrade-required-426
    apiq-meta:
      pattern-id: RFC2-15
      lenses: [ standards-compliance ]
      sources:
        - { type: rfc, number: 9110, section: '15.5.16', summary: 'The server MUST send an Upgrade header field in a 426 response' }
        - { type: mining, phase: round2, subagent: 'RFC2-15', summary: 'verbatim MUST per implementation-priority.md' }
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: validation-time
      defect-class: norm
      iso25010: [ compatibility, reliability ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: medium

  # =========================================================================
  # RFC2-17 — 1xx codes MUST NOT be declared as response-keys (OAS-3)
  # OAS 3.0 §4.8.16 (Patterned Fields); severity: hint
  # Custom function `one-xx-not-in-responses-keys`.
  # =========================================================================
  # Source: OAS 3.0 §4.8.16 — only HTTP status codes 2xx-5xx + '1XX' wildcard
  #         are valid response-keys. patterns.json RFC2-17 (P3 standards).
  # Lens: 2
  # Round: 2 / Welle D
  apiq-rfc2-17-1xx-codes-as-response-keys:
    description: >-
      Concrete 1xx response-codes (100, 101, 103) SHOULD NOT be declared as OAS3 response-keys — use the `1XX` wildcard form per OAS 3.0 §4.8.16 patterned-fields. 1xx are interim responses not surfaced by most clients.
    message: "{{error}}"
    severity: hint
    given: "$.paths[*][get,head,post,put,patch,delete,options,trace].responses"
    then:
      function: one-xx-not-in-responses-keys
    apiq-meta:
      pattern-id: RFC2-17
      lenses: [ standards-compliance ]
      sources:
        - { type: vendor, name: 'OAS 3.0 §4.8.16 Patterned Fields', verifiedAt: '2026-05-09' }
        - { type: mining, phase: round2, subagent: 'RFC2-17', summary: 'OAS-3 1XX-only-wildcard' }
      stakeholders: [ spec-author ]
      lifecycle-phase: validation-time
      defect-class: norm
      iso25010: [ compatibility ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: true
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # RFC2-18 — Content-Length response-header SHOULD NOT be declared
  # RFC 9110 §8.6; severity: hint (stock-DSL undefined)
  # =========================================================================
  # Source: RFC 9110 §8.6 — Content-Length is auto-computed by the HTTP
  #         framework; declaring it in OAS3 is over-specification.
  #         patterns.json RFC2-18 (P3 standards).
  # Lens: 2
  # Round: 2 / Welle D
  apiq-rfc2-18-content-length-not-declared:
    description: >-
      `Content-Length` SHOULD NOT be declared as an OAS3 response-header — it is auto-computed by the HTTP framework and declaring it in the spec is over-specification (RFC 9110 §8.6).
    message: "Content-Length response-header SHOULD NOT be declared (over-specification per RFC 9110 §8.6)."
    severity: hint
    given: "$.paths[*][*].responses[*].headers[Content-Length,content-length]"
    then:
      function: undefined
    apiq-meta:
      pattern-id: RFC2-18
      lenses: [ standards-compliance ]
      sources:
        - { type: rfc, number: 9110, section: '8.6', verifiedAt: '2026-05-09' }
        - { type: mining, phase: round2, subagent: 'RFC2-18', summary: 'Content-Length over-specification' }
      stakeholders: [ spec-author ]
      lifecycle-phase: authoring-time
      defect-class: over-specification
      iso25010: [ maintainability ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: true
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # RFC2-19 — Date response-header SHOULD NOT be declared
  # RFC 9110 §6.6.1; severity: hint
  # =========================================================================
  # Source: RFC 9110 §6.6.1 — Date is auto-emitted by HTTP servers.
  #         patterns.json RFC2-19 (P3 standards).
  # Lens: 2
  # Round: 2 / Welle D
  apiq-rfc2-19-date-header-not-declared:
    description: >-
      `Date` SHOULD NOT be declared as an OAS3 response-header — auto-emitted by HTTP servers per RFC 9110 §6.6.1; declaring is over-specification.
    message: "Date response-header SHOULD NOT be declared (auto-emitted by HTTP server, RFC 9110 §6.6.1)."
    severity: hint
    given: "$.paths[*][*].responses[*].headers[Date,date]"
    then:
      function: undefined
    apiq-meta:
      pattern-id: RFC2-19
      lenses: [ standards-compliance ]
      sources:
        - { type: rfc, number: 9110, section: '6.6.1', verifiedAt: '2026-05-09' }
        - { type: mining, phase: round2, subagent: 'RFC2-19', summary: 'Date over-specification' }
      stakeholders: [ spec-author ]
      lifecycle-phase: authoring-time
      defect-class: over-specification
      iso25010: [ maintainability ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: true
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # RFC2-23 — If-Modified-Since param on GET/HEAD → 304 declared
  # RFC 9110 §13.1.3; severity: hint
  # Custom function `if-modified-since-implies-304`.
  # =========================================================================
  # Source: RFC 9110 §13.1.3. patterns.json RFC2-23 (P3 standards).
  # Lens: 2
  # Round: 2 / Welle D
  apiq-rfc2-23-if-modified-since-implies-304:
    description: >-
      Operations accepting `If-Modified-Since` header on GET/HEAD SHOULD declare a 304 (Not Modified) response per RFC 9110 §13.1.3 conditional-request semantics.
    message: "{{error}}"
    severity: hint
    given: "$.paths[*][get,head]"
    then:
      function: if-modified-since-implies-304
    apiq-meta:
      pattern-id: RFC2-23
      lenses: [ standards-compliance, operations ]
      sources:
        - { type: rfc, number: 9110, section: '13.1.3', verifiedAt: '2026-05-09' }
        - { type: mining, phase: round2, subagent: 'RFC2-23', summary: 'If-Modified-Since → 304' }
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: validation-time
      defect-class: incomplete
      iso25010: [ compatibility, performance-efficiency ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # RFC2-24 — If-Unmodified-Since param → 412 declared
  # RFC 9110 §13.1.4; severity: warn
  # Custom function `if-unmodified-since-implies-412`.
  # =========================================================================
  # Source: RFC 9110 §13.1.4. patterns.json RFC2-24 (P3 standards, warn).
  # Lens: 2
  # Round: 2 / Welle D
  apiq-rfc2-24-if-unmodified-since-implies-412:
    description: >-
      Operations accepting `If-Unmodified-Since` header SHOULD declare a 412 (Precondition Failed) response per RFC 9110 §13.1.4 — without 412 the precondition is silently ignored.
    message: "{{error}}"
    severity: warn
    given: "$.paths[*][get,head,post,put,patch,delete]"
    then:
      function: if-unmodified-since-implies-412
    apiq-meta:
      pattern-id: RFC2-24
      lenses: [ standards-compliance, operations ]
      sources:
        - { type: rfc, number: 9110, section: '13.1.4', verifiedAt: '2026-05-09' }
        - { type: mining, phase: round2, subagent: 'RFC2-24', summary: 'If-Unmodified-Since → 412' }
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: validation-time
      defect-class: incomplete
      iso25010: [ reliability, compatibility ]
      codegen-targets: [ '*' ]
      detection-precision: high
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # RFC2-27 — ETag value SHOULD use opaque DQUOTE form
  # RFC 9110 §8.8.3; severity: hint (stock pattern)
  # =========================================================================
  # Source: RFC 9110 §8.8.3 — ETag opaque-tag = DQUOTE *etagc DQUOTE.
  #         patterns.json RFC2-27 (P3 standards).
  # Lens: 2
  # Round: 2 / Welle D
  apiq-rfc2-27-etag-opaque-quoted:
    description: >-
      `ETag` response-header values SHOULD use the opaque-quoted-string form (DQUOTE-wrapped) per RFC 9110 §8.8.3. Examples like `"abc123"` or `W/"abc123"` are valid; bare `abc123` is not.
    message: "ETag header example/default SHOULD be DQUOTE-wrapped per RFC 9110 §8.8.3."
    severity: hint
    given: "$.paths[*][*].responses[*].headers[ETag,etag,Etag].schema"
    then:
      - field: pattern
        function: pattern
        functionOptions:
          match: "^(W/)?\".*\""
    apiq-meta:
      pattern-id: RFC2-27
      lenses: [ standards-compliance ]
      sources:
        - { type: rfc, number: 9110, section: '8.8.3', summary: 'opaque-tag = DQUOTE *etagc DQUOTE' }
        - { type: mining, phase: round2, subagent: 'RFC2-27', summary: 'ETag opaque DQUOTE form' }
      stakeholders: [ spec-author ]
      lifecycle-phase: documentation-time
      defect-class: norm
      iso25010: [ compatibility ]
      codegen-targets: [ '*' ]
      detection-precision: medium
      auto-fix-safe: true
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # RFC2-28 — ETag consistency cross-resource ops
  # RFC 9110 §8.8.3; severity: hint
  # Custom function `etag-cross-resource-consistency`.
  # =========================================================================
  # Source: RFC 9110 §8.8.3 — write-ops on ETag-validated resources should
  #         return updated ETag for round-trip optimistic-concurrency.
  #         patterns.json RFC2-28 (P3 standards, Lens-2 + Lens-8).
  # Lens: 2 (Standards-Compliance), 8 (Internal-Consistency)
  # Round: 2 / Welle D
  apiq-rfc2-28-etag-cross-resource-consistency:
    description: >-
      If a path declares ETag on its GET 200 response, sibling write-ops (PUT/PATCH) on the same path SHOULD also declare ETag on their success response — enabling round-trip optimistic-concurrency (RFC 9110 §8.8.3).
    message: "{{error}}"
    severity: hint
    given: "$.paths[*]"
    then:
      function: etag-cross-resource-consistency
    apiq-meta:
      pattern-id: RFC2-28
      lenses: [ standards-compliance, internal-consistency ]
      sources:
        - { type: rfc, number: 9110, section: '8.8.3', verifiedAt: '2026-05-09' }
        - { type: mining, phase: round2, subagent: 'RFC2-28', summary: 'ETag cross-resource consistency' }
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: validation-time
      defect-class: incomplete
      iso25010: [ compatibility, reliability ]
      codegen-targets: [ '*' ]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # RFC2-29 — PUT/PATCH/DELETE on /{id} SHOULD support If-Match + ETag
  # RFC 9110 + Microsoft API Guidelines; severity: hint
  # Custom function `id-write-op-etag-support`.
  # =========================================================================
  # Source: RFC 9110 §8.8.3 + Microsoft REST API Guidelines.
  #         patterns.json RFC2-29 (P3 standards, Lens-2 + Lens-4).
  # Lens: 2, 4 (Client-Friction)
  # Round: 2 / Welle D
  apiq-rfc2-29-id-write-op-etag-support:
    description: >-
      Write operations (PUT/PATCH/DELETE) on resource-{id} paths SHOULD support optimistic-concurrency via `If-Match` parameter + ETag response-header — prevents lost-update from concurrent writers (RFC 9110 §8.8.3 + Microsoft API Guidelines).
    message: "{{error}}"
    severity: hint
    given: "$.paths[*][put,patch,delete]"
    then:
      function: id-write-op-etag-support
    apiq-meta:
      pattern-id: RFC2-29
      lenses: [ standards-compliance, client-friction ]
      sources:
        - { type: rfc, number: 9110, section: '8.8.3', verifiedAt: '2026-05-09' }
        - { type: vendor, name: 'Microsoft REST API Guidelines (Concurrency)', verifiedAt: '2026-05-09' }
        - { type: mining, phase: round2, subagent: 'RFC2-29', summary: '{id} write-op If-Match' }
      stakeholders: [ spec-author, client-dev ]
      lifecycle-phase: validation-time
      defect-class: incomplete
      iso25010: [ reliability, compatibility ]
      codegen-targets:
        - java
        - go
        - python
        - typescript
        - rust
        - csharp
        - kotlin
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: medium
      mttr-impact: medium
      agent-readiness-impact: medium

  # =========================================================================
  # BUNDLE — apiq-rfc2-cache-header-bundle (RFC2-30/31/33/34)
  # RFC 9110 §14 + Heroku idiom; severity: hint
  # Custom function `cache-header-bundle`.
  # =========================================================================
  # Source: RFC 9110 §14.1 (Range), §15.5.17 (416), §14.3 (Accept-Ranges)
  #         + Heroku Range pagination idiom. patterns.json
  #         RFC2-30 + RFC2-31 + RFC2-33 + RFC2-34 (P3 bundle).
  # Lens: 2
  # Round: 2 / Welle D
  apiq-rfc2-cache-header-bundle:
    description: >-
      Range/Accept-Ranges correctness bundle (RFC 9110 §14): Range param → 206 declared (RFC2-30); Range param → 416 declared (RFC2-31); Accept-Ranges value IANA-registered ("bytes" or "none") (RFC2-33); Heroku-style Range pagination consistency (RFC2-34, soft).
    message: "{{error}}"
    severity: hint
    given: "$.paths[*][get,head,post,put,patch,delete]"
    then:
      function: cache-header-bundle
    apiq-meta:
      pattern-id: RFC2-30
      lenses: [ standards-compliance ]
      sources:
        - { type: rfc, number: 9110, section: '14.1', verifiedAt: '2026-05-09' }
        - { type: rfc, number: 9110, section: '15.5.17', verifiedAt: '2026-05-09' }
        - { type: rfc, number: 9110, section: '14.3', summary: 'Accept-Ranges: bytes / none (IANA HTTP Range Unit Registry)' }
        - { type: vendor, name: 'Heroku Range pagination idiom', verifiedAt: '2026-05-09' }
        - { type: mining, phase: round2, subagent: 'RFC2-30', summary: 'cache-header-bundle: RFC2-30 + RFC2-31 + RFC2-33 + RFC2-34' }
      stakeholders: [ spec-author, client-dev, operations ]
      lifecycle-phase: validation-time
      defect-class: incomplete
      iso25010: [ compatibility, performance-efficiency ]
      codegen-targets: [ '*' ]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # BUNDLE — apiq-rfc2-cache-validators-bundle (RFC2-35/36/37/38/39)
  # RFC 9111 §4.1/§4.3.4/§5.2/§5.3/§5.4; severity: hint
  # Custom function `cache-validators-bundle`.
  # =========================================================================
  # Source: RFC 9111 (HTTP Caching). patterns.json
  #         RFC2-35 + RFC2-36 + RFC2-37 + RFC2-38 + RFC2-39 (P3 bundle).
  # Lens: 2 (Standards-Compliance), 7 (Operations), 8 (Internal-Consistency)
  # Round: 2 / Welle D
  apiq-rfc2-cache-validators-bundle:
    description: >-
      Cache-validator bundle (RFC 9111): Cache-Control directives must be IANA-registered (RFC2-35); Pragma deprecated, SHOULD NOT declare (RFC2-36); Cache-Control + Expires together is smell (RFC2-37); Vary SHOULD declare on content-negotiation (RFC2-38); 200 + 304 ETag- shape consistency (RFC2-39).
    message: "{{error}}"
    severity: hint
    given: "$.paths[*][get,head,post,put,patch,delete]"
    then:
      function: cache-validators-bundle
    apiq-meta:
      pattern-id: RFC2-35
      lenses: [ standards-compliance, operations, internal-consistency ]
      sources:
        - { type: rfc, number: 9111, section: '5.2', summary: 'Cache-Control directives IANA-registered' }
        - { type: rfc, number: 9111, section: '5.4', summary: 'Pragma is deprecated' }
        - { type: rfc, number: 9111, section: '5.3', summary: 'Cache-Control overrides Expires' }
        - { type: rfc, number: 9111, section: '4.1', verifiedAt: '2026-05-09' }
        - { type: rfc, number: 9111, section: '4.3.4', verifiedAt: '2026-05-09' }
        - { type: mining, phase: round2, subagent: 'RFC2-35', summary: 'cache-validators bundle RFC2-35..39' }
      stakeholders: [ spec-author, client-dev, operations ]
      lifecycle-phase: validation-time
      defect-class: norm
      iso25010: [ compatibility, performance-efficiency, reliability ]
      codegen-targets: [ '*' ]
      detection-precision: medium
      auto-fix-safe: false
      cost-impact: low
      mttr-impact: low
      agent-readiness-impact: low

  # =========================================================================
  # RFC2-41 — 407 → Proxy-Authenticate REQUIRED (verbatim "MUST")
  # RFC 9110 §11.6.4; severity: error
  # Custom function `proxy-authenticate-407`.
  # =========================================================================
  # Source: RFC 9110 §11.6.4 verbatim "MUST send Proxy-Authenticate".
  #         patterns.json RFC2-41 (P3 standards, error).
  # Lens: 2
  # Round: 2 / Welle D
  apiq-rfc2-41-407-proxy-authenticate-required:
    description: >-
      407 (Proxy Authentication Required) responses MUST declare a `Proxy-Authenticate` header per RFC 9110 §11.6.4 (verbatim "The server MUST send a Proxy-Authenticate header field").
    message: "{{error}}"
